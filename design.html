            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date(); const start = new Date(state.seasonConfig.start);

            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate() + 1);
            firstSunday.setHours(23, 59, 59, 999);
            if (now.getTime() <= firstSunday.getTime()) return 1;
            const diffTime = now.getTime() - firstSunday.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
            let week = 2 + Math.floor(diffDays / 7);
            return Math.max(1, Math.min(week, 4));

                    const theirDocRef = doc(db, 'plot_users', theirUid); const theirDoc = await getDoc(theirDocRef);

                        const theirData = theirDoc.data(); const theirFriends = theirData.friends || [];

                            const theirNextBounty = (theirFriends.length + 1) * 100; const theirNewXp = (theirData.xp || 0) + theirNextBounty; const theirNewLvl = Math.floor(theirNewXp / 1000) + 1;
