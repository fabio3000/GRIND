        /* --- LOOT NODES --- */
        .reward-box { 
            width: 100px; height: 85px;

        .reward-box.unlocked { border-color: rgba(255, 77, 0, 0.4); background: rgba(255, 77, 0, 0.1); box-shadow: 0 0 20px rgba(255, 77, 0, 0.2); }

        .week-btn.active { background: rgba(255, 77, 0, 0.2); color: #ff4d00; border-color: #ff4d00; font-weight: 900; box-shadow: 0 0 15px rgba(255, 77, 0, 0.2); }
        
        /* --- UTILITIES --- */

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { pointer-events: auto; background: rgba(20,20,20,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 16px 24px; border-radius: 16px; font-size: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 12px; }
        .toast.show { transform: translateX(0); }
        
        /* PREMIUM BOUNTY BUTTON ANIMATION */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(255, 77, 0, 0.1); border-color: rgba(255, 77, 0, 0.3); }
            50% { opacity: 0.95; box-shadow: 0 0 30px rgba(255, 77, 0, 0.4); border-color: rgba(255, 77, 0, 0.6); }

            animation: subtle-pulse 3s infinite ease-in-out;

        .completed-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s; pointer-events: none; border-radius: inherit; }
        .card.is-completed .completed-overlay { opacity: 1; pointer-events: auto; }
        
        .pending-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s; pointer-events: none; border-radius: inherit; }
        .card.is-pending .pending-overlay { opacity: 1; pointer-events: auto; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3) translateY(-10px); text-shadow: 0 0 30px #ff4d00; color: #ff4d00; } 100% { transform: scale(1) translateY(0); text-shadow: 0 0 10px rgba(255,77,0,0.5); } }
        .animate-pop { animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.3; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
        .animate-pulse-slow { animation: pulse-slow 4s ease-in-out infinite; }
        .glitch-bg { background: transparent; }

        .grecaptcha-badge { filter: invert(1) grayscale(0.2) opacity(0.3); transition: all 0.5s ease !important; bottom: 20px !important; }
        .grecaptcha-badge:hover { filter: invert(1) grayscale(0) opacity(0.8); }
		
        #intro-layer {
            position: fixed; inset: 0; z-index: 999999;
            background-color: #000; display: flex; align-items: center; justify-content: center;

        }
        @media (min-width: 768px) { .word-flash { font-size: 6vw; } }

        @keyframes flashInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); filter: blur(4px); }
            10% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px); }
            90% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); filter: blur(0px); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); filter: blur(4px); }
        }
        
        .legal-content h2 { color: white; font-weight: 900; font-style: italic; text-transform: uppercase; margin-top: 2.5rem; margin-bottom: 0.75rem; letter-spacing: 0.05em; font-size: 1.25rem; }
        .legal-content h3 { color: #d4d4d4; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .legal-content p { margin-bottom: 1rem; color: #a3a3a3; font-size: 0.875rem; line-height: 1.6; }
        .legal-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #a3a3a3; font-size: 0.875rem; }
        .legal-content li { margin-bottom: 0.25rem; }
        .legal-content strong { color: #ffffff; font-weight: bold; }

<body class="flex flex-col relative select-none">

    <div id="toast-container"></div>
    <div id="recaptcha-container"></div>
    
    <div id="app" class="flex-1 flex flex-col w-full z-10 relative pb-10">
        <div class="flex-1 flex items-center justify-center min-h-[60vh]"><div class="w-16 h-16 border-t-4 border-l-4 border-[#ff4d00] rounded-full animate-spin"></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, arrayUnion, onSnapshot, collection, addDoc, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtwsvmYSONjFufhbJ5I8G_RAMffnh7re0",
            authDomain: "theplot-app.firebaseapp.com",
            projectId: "theplot-app",
            storageBucket: "theplot-app.firebasestorage.app",
            messagingSenderId: "550703275210",
            appId: "1:550703275210:web:81bc0e5a373f87a3c92833"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        let state = {
            user: null, profile: null, prevXp: null, prevLvl: null,
            bundlePrice: '19.00', view: 'loading', prevView: 'dashboard',
            currentWeekTab: 1,
            authStep: 'phone', tempPhone: '', tempUploadData: null,
            weeklyData: { 1: { title: "Loading...", startOffset: 0, missions: [] } },
            rewardData: [], habitData: [], pendingMissions: [], activities: [],
            seasonConfig: null,
            dashboardNeedsScroll: true
        };

        const RANKS = ["Rookie", "Grinder", "Hustler", "Athlete", "Machine", "Legend"];

        let holdTimer = null; let holdProgress = 0; let isRedeeming = false;
        window.currentVerify = null;
        window.countdownInterval = null;

        const getRelativeTime = (timestamp) => {
            if(!timestamp) return "Gerade eben";
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "Gerade eben";
            if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
            if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;
            return `vor ${Math.floor(diff/86400)} Tagen`;
        };

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div'); toast.className = `toast ${type}`;
            const icon = type === 'error' ? `<svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` : `<svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            toast.innerHTML = `${icon} <div><div class="font-black text-[10px] uppercase tracking-widest text-gray-400 mb-0.5">System</div><div>${msg}</div></div>`;
            container.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4000);
        };

        window.logActivity = async (type, text) => {
            try {
                if(!state.profile || !state.profile.alias) return;
                const newAct = {
                    alias: state.profile.alias,
                    isPro: !!state.profile.hasPremium, 
                    type: type, 
                    text: text,
                    timestamp: Date.now()
                };
                
                await addDoc(collection(db, 'plot_activities'), newAct).catch(err => {
                    console.error("Firebase Rules Error beim Feed:", err);
                });
            } catch(e) { 
                console.error("Critical Activity Log Error:", e);
            }
        };

        const getActiveWeek = () => {
            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date();
            const start = new Date(state.seasonConfig.start);

            if(now < start) return 1;

            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) {
                firstSunday.setDate(firstSunday.getDate() + 1);
            }
            firstSunday.setHours(23, 59, 59, 999);

            if (now.getTime() <= firstSunday.getTime()) return 1;

            const diffTime = now.getTime() - firstSunday.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
            
            let week = 2 + Math.floor(diffDays / 7);
            
            return Math.max(1, Math.min(week, 4));
        };

        const getSeasonStatus = () => {
            if (!state.seasonConfig) return { status: 'loading' };
            if (state.seasonConfig.active === false || state.seasonConfig.active === 'false') return { status: 'offline' };
            
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            const end = new Date(state.seasonConfig.end);
            end.setHours(23, 59, 59, 999);
            
            if (now < start) return { status: 'upcoming', date: start };
            if (now > end) return { status: 'ended', date: end };
            return { status: 'active' };
        };

        window.updateCountdown = () => {
            const el = document.getElementById('season-countdown');
            if(!el || !state.seasonConfig) return;
            const start = new Date(state.seasonConfig.start).getTime();
            const now = new Date().getTime();
            const distance = start - now;
            
            if (distance < 0) {
                el.innerHTML = "LAUNCHING...";
                if(window.countdownInterval) clearInterval(window.countdownInterval);
                setTimeout(() => render(), 2000); 
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            el.innerHTML = `${days}D ${hours.toString().padStart(2, '0')}H ${minutes.toString().padStart(2, '0')}M ${seconds.toString().padStart(2, '0')}S`;
        };

        const setupSeasonData = () => {
            onSnapshot(doc(db, 'system', 'grind_season'), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.weeklyData = data.weeklyData || state.weeklyData;
                    state.rewardData = data.rewardData || [];
                    state.habitData = data.habitData || [];
                    state.seasonConfig = data.seasonConfig || { number: 1, active: true, start: '', end: '' };
                    state.currentWeekTab = getActiveWeek();
                }
                if(state.view === 'dashboard' || state.view === 'paywall') render();
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                state.user = user;
                onSnapshot(doc(db, 'plot_users', user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        state.profile = docSnap.data();
                        
                        if (!state.profile.crewCode) {
                            const generatedCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                            state.profile.crewCode = generatedCode;
                            setDoc(doc(db, 'plot_users', user.uid), { crewCode: generatedCode }, { merge: true });
                        }

                        if (['loading', 'auth', 'onboarding'].includes(state.view)) {
                            state.view = 'dashboard';
                            state.dashboardNeedsScroll = true;
                            
                            const urlParams = new URLSearchParams(window.location.search);
                            const crewCode = urlParams.get('crew');
                            if (crewCode) {
                                window.history.replaceState({}, document.title, window.location.pathname);
                                setTimeout(() => window.resolveInvite(crewCode), 1000);
                            }
                        }
                        render();
                    } else { state.view = 'onboarding'; render(); }
                });
                
                onSnapshot(collection(db, 'plot_pending_proofs'), (snap) => {
                    if (snap && snap.docs) {
                        state.pendingMissions = snap.docs.map(d => d.data()).filter(data => data.uid === state.user.uid).map(data => data.mid);
                        if(state.view === 'dashboard') render();
                    }
                });

                const activitiesQuery = query(collection(db, 'plot_activities'), orderBy('timestamp', 'desc'), limit(50));
                onSnapshot(activitiesQuery, (snap) => {
                    if(snap && snap.docs) {
                        state.activities = snap.docs.map(d => d.data());
                        if(state.view === 'dashboard') render();
                    }
                }, (error) => {
                    console.error("Activities Lade-Fehler! (Firebase Rules checken)", error);
                });

                setupSeasonData();
                onSnapshot(doc(db, 'system', 'pricing'), (docSnap) => {
                    if (docSnap.exists()) state.bundlePrice = docSnap.data().bundlePrice; 
                    if (state.view === 'paywall') render(); 
                });
            } else { state.user = null; state.profile = null; state.view = 'auth'; state.authStep = 'phone'; render(); }
        });

        window.closeModal = () => {
            if(window.stopRedeemHold) window.stopRedeemHold(); 
            const forceClose = () => {
                const container = document.getElementById('modal-container');
                if(container) { container.classList.remove('opacity-100'); container.classList.add('opacity-0', 'pointer-events-none'); setTimeout(() => container.innerHTML = '', 300); }
            };
            if(window.html5QrCode) {
                try {
                    const qrState = window.html5QrCode.getState();
                    if(qrState === 2) { 
                        let closed = false; const finish = () => { if(closed) return; closed = true; window.html5QrCode = null; forceClose(); };
                        window.html5QrCode.stop().then(() => { try { window.html5QrCode.clear(); } catch(e){} finish(); }).catch(finish);
                        setTimeout(finish, 800); return; 
                    } else { window.html5QrCode.clear(); window.html5QrCode = null; }
                } catch(e) { window.html5QrCode = null; }
            }
            forceClose();
        };

        window.openModal = (contentHtml) => {
            let container = document.getElementById('modal-container');

                    if (trackLine) trackLine.style.width = `calc(140px * ${targetTrackProgress})`;

                    if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                        if (topCircle) {
                            topCircle.style.transition = 'stroke-dashoffset 1000ms ease-out';
                            topCircle.style.strokeDashoffset = '0'; // Voll
                            setTimeout(() => {
                                topCircle.style.transition = 'none';
                                topCircle.style.strokeDashoffset = '553'; // Leer
                                void topCircle.offsetWidth; // Reflow
                                topCircle.style.transition = 'stroke-dashoffset 1000ms ease-out';
                                topCircle.style.strokeDashoffset = targetOffset.toString();
                            }, 1000);
                        }
                        if (passViewport && currentNode) {
                            const scrollLeft = currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2);
                            passViewport.scrollTo({ left: scrollLeft, behavior: 'smooth' });
                        }
                    } else if (topCircle) {
                        topCircle.style.transition = 'stroke-dashoffset 1000ms ease-out';
                        topCircle.style.strokeDashoffset = targetOffset.toString();
                    }

                    if (state.prevXp !== null && state.prevXp < safeXp) {
                        window.scrollTo({ top: 0, behavior: 'smooth' }); animateValue('xp-counter-num', state.prevXp, safeXp, 1000);
                        if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                            const lvlText = document.getElementById('main-lvl-text'); if (lvlText) lvlText.classList.add('animate-pop');
                            const newCircle = document.getElementById(`circle-node-${safeLvl}`); if (newCircle) newCircle.classList.add('animate-pop');
                        }
                    }
                    state.prevXp = safeXp; state.prevLvl = safeLvl;
                }, 50);
                return;
            }

            // --- 404 FALLBACK ---
            appDiv.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center p-6 min-h-[80vh] relative z-20">
                    <h1 class="text-8xl md:text-9xl font-black italic text-white tracking-tighter mb-4 select-none drop-shadow-2xl">404</h1>
                    <p class="text-[#ff4d00] font-black uppercase tracking-[0.4em] mb-8 text-sm">Signal Lost</p>
                    <p class="text-gray-400 font-bold max-w-xs text-xs leading-relaxed mb-10">Die angeforderte Position existiert nicht auf der Grind Map.</p>
                    <button onclick="window.setView('dashboard')" class="btn-grind">Return to Base</button>
                </div>
            `;
        }
    </script>
</body>
</html>
