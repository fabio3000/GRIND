        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        /* ==========================================================================
           1. WEB AUDIO SYNTHESIZER (Kein Laden externer Sound-Dateien nötig!)
           ========================================================================== */
        const SoundFX = {
            ctx: null,
            muted: false,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            toggleMute() {
                this.muted = !this.muted;
                document.getElementById('sound-toggle-btn').innerText = this.muted ? '🔇' : '🔊';
                if (!this.muted) this.playClick();
            },
            playClick() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.06);
            },
            playSuccess() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                [440, 554.37, 659.25, 880].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.08, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.07); osc.stop(now + idx * 0.07 + 0.25);
                });
            },
            playError() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.linearRampToValueAtTime(95, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.25);
            }
        };
        window.SoundFX = SoundFX;

        /* ==========================================================================

                { id: "hab_hydration", name: "3.0L Clean Hydration + Electrolytes", desc: "Kein Zucker-Crash. Tracke deinen kompletten Wasser- und Elektrolyt-Haushalt.", xp: 120, streakBonus: 25, frequency: "daily_streak", type: "instant" },
                { id: "hab_plant_protein", name: "120g+ Clean Vegetarian Protein Target", desc: "Erreiche dein tägliches Makro-Ziel für optimale Muskelregeneration.", xp: 180, streakBonus: 50, frequency: "daily_streak", type: "upload" }

                { lvl: 4, free: "15% Partner Nutrition Code", free_type: "link", free_info: "GRIND-CGN-15", pro: "VIP Run Club Pacer Access", pro_type: "qr", pro_info: "Priority Check-In" },
                { lvl: 5, free: "Cologne Finisher Patch", free_type: "shipping", pro: "GRIND. // Technical Shell Shirt", pro_type: "shipping" },
                { lvl: 6, free: "+350 XP Boost", free_type: "xp", free_info: "350", pro: "Recovery Sauna Day-Pass", pro_type: "qr", pro_info: "Gültig bei KölnBäder / Partner" }
            ],
            cityLeaderboard: [
                { alias: "FABIO_CGN", sector: "Südstadt", xp: 4850, lvl: 5, isPro: true, streak: 9 },
                { alias: "MIRA_PACE", sector: "Ehrenfeld", xp: 4620, lvl: 5, isPro: true, streak: 14 },
                { alias: "LUKAS_HYROX", sector: "Lindenthal", xp: 3910, lvl: 4, isPro: false, streak: 6 },
                { alias: "KAI_RHEIN", sector: "Nippes", xp: 3150, lvl: 4, isPro: true, streak: 4 },
                { alias: "SARAH_0221", sector: "Belgisches", xp: 2400, lvl: 3, isPro: false, streak: 3 }
            ],
            liveTicker: [
                { alias: "MIRA_PACE", action: "hat am Aachener Weiher eingecheckt (+300 XP)", time: "vor 4 Min", isPro: true },
                { alias: "LUKAS_HYROX", action: "hat 'THE ENGINE: 1000m Row + 5km Run' absolviert", time: "vor 12 Min", isPro: false },
                { alias: "KAI_RHEIN", action: "hat Level 4 im Cologne Sector erreicht!", time: "vor 27 Min", isPro: true }

        };

        /* ==========================================================================
           3. CENTRAL REACTIVE STATE & PERSISTENCE
           ========================================================================== */
        const State = {
            workspace: 'user', // 'user' | 'admin' | 'forge'
            activeUserSubTab: 'ops', // 'ops' | 'radar' | 'syndicate'
            userPos: { lat: 50.9333, lng: 6.9595, accuracy: 24, locked: false }, // Default Thieboldsgasse / Neumarkt CGN
            profile: JSON.parse(localStorage.getItem('grind_v4_profile')) || {

                city: "Köln",
                sector: "Innenstadt / Süd",
                xp: 2350,
                lvl: 3,
                hasPremium: true,
                crewCode: "CGN902",
                completed: [],
                redeemed: [],
                streaks: { "hab_mobility": { streak: 4, lastDate: "" } },
                friends: ["MIRA_PACE", "LUKAS_HYROX"]
            },
            season: COLOGNE_DEFAULT_DATA.seasonConfig,
            spots: COLOGNE_DEFAULT_DATA.activeSpots,
            missions: COLOGNE_DEFAULT_DATA.weeklyMissions,
            habits: COLOGNE_DEFAULT_DATA.habits,
            rewards: COLOGNE_DEFAULT_DATA.rewards,
            leaderboard: COLOGNE_DEFAULT_DATA.cityLeaderboard,
            ticker: COLOGNE_DEFAULT_DATA.liveTicker,
            pendingProofs: [
                { id: "prf_101", alias: "LUKAS_HYROX", missionName: "THE ENGINE: 1000m Row + 5km Run", xp: 650, time: "vor 8 Min", telemetry: "HR 174 bpm • Pace 4:38/km • CGN", confidence: 96 }
            ],
            mapInstance: null,
            qrForgeInstance: null
        };

        const saveLocalState = () => {
            localStorage.setItem('grind_v4_profile', JSON.stringify(State.profile));
        };

        /* ==========================================================================
           4. GEOLOCATION & HAVERSINE TELEMETRY
           ========================================================================== */
        const getDistanceMeters = (lat1, lon1, lat2, lon2) => {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        };

        /* ==========================================================================
           5. CORE APPLICATION CONTROLLER
           ========================================================================== */
        const App = {
            init() {
                this.locateUser(true);
                this.render();
            },

            locateUser(silent = false) {
                const dot = document.getElementById('gps-dot');
                const coordsEl = document.getElementById('gps-coords');
                if (!navigator.geolocation) return;

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        State.userPos = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            accuracy: Math.round(pos.coords.accuracy),
                            locked: true
                        };
                        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]";
                        if (coordsEl) coordsEl.innerText = `${State.userPos.lat.toFixed(4)}°N, ${State.userPos.lng.toFixed(4)}°E (±${State.userPos.accuracy}m)`;
                        if (!silent) this.toast("GPS-Telemetrie synchronisiert.", "success");
                        if (State.workspace === 'user') this.render();
                    },
                    () => {
                        if (dot) dot.className = "w-2 h-2 rounded-full bg-brand";
                        if (coordsEl) coordsEl.innerText = `SIM-GPS: 50.9333°N, 6.9595°E (KÖLN)`;
                        if (!silent) this.toast("Nutze Köln-Zentrum Simulations-Koordinaten.", "info");
                    },
                    { enableHighAccuracy: true, timeout: 6000 }
                );
            },

            switchWorkspace(ws) {
                SoundFX.playClick();
                State.workspace = ws;
                ['user', 'admin', 'forge'].forEach(k => {
                    const btn = document.getElementById(`ws-btn-${k}`);
                    if (btn) {
                        btn.className = k === ws 
                            ? "px-3 py-1 text-[10px] font-mono font-bold uppercase tracking-wider rounded-sm transition bg-brand text-white shadow-[0_0_15px_rgba(255,77,0,0.4)]"
                            : "px-3 py-1 text-[10px] font-mono font-bold uppercase tracking-wider rounded-sm transition text-gray-400 hover:text-white";
                    }
                });
                this.render();
            },

            setUserTab(tab) {
                SoundFX.playClick();
                State.activeUserSubTab = tab;
                this.render();
            },

            toast(msg, type = 'success') {
                const stack = document.getElementById('toast-stack');
                const el = document.createElement('div');
                const borderColor = type === 'error' ? 'border-red-500' : (type === 'info' ? 'border-blue-500' : 'border-brand');
                el.className = `pointer-events-auto tactical-card border-l-4 ${borderColor} p-4 shadow-2xl flex items-center justify-between gap-3 animate-fade-in`;
                el.innerHTML = `
                    <div>
                        <p class="font-mono text-[9px] uppercase tracking-widest text-gray-500">SYS // ${type.toUpperCase()}</p>
                        <p class="text-xs font-bold text-white mt-0.5">${msg}</p>
                    </div>
                    <span class="text-brand font-mono text-xs">⚡</span>
                `;
                stack.appendChild(el);
                setTimeout(() => el.remove(), 3800);
            },

            awardXP(amount, label) {
                SoundFX.playSuccess();
                const oldXp = State.profile.xp;
                const oldLvl = State.profile.lvl;
                const newXp = oldXp + amount;
                const newLvl = Math.floor(newXp / 1000) + 1;

                State.profile.xp = newXp;
                State.profile.lvl = newLvl;
                saveLocalState();

                // Update City Leaderboard entry
                const lbEntry = State.leaderboard.find(x => x.alias === State.profile.alias);
                if (lbEntry) { lbEntry.xp = newXp; lbEntry.lvl = newLvl; }
                State.leaderboard.sort((a, b) => b.xp - a.xp);

                // Push to Live Ticker
                State.ticker.unshift({
                    alias: State.profile.alias,
                    action: `hat '${label}' abgeschlossen (+${amount} XP)`,
                    time: "Gerade eben",
                    isPro: State.profile.hasPremium
                });

                // Show XP HUD
                const hud = document.getElementById('xp-cinematic-hud');
                document.getElementById('hud-gain-title').innerText = `+${amount} XP // ${label}`;
                document.getElementById('hud-lvl-val').innerText = newLvl;
                const pct = ((newXp % 1000) / 1000) * 100;
                const bar = document.getElementById('hud-bar-fill');
                bar.style.width = `${((oldXp % 1000) / 1000) * 100}%`;
                hud.classList.remove('opacity-0', '-translate-y-8');
                setTimeout(() => { bar.style.width = `${pct}%`; }, 100);
                setTimeout(() => { hud.classList.add('opacity-0', '-translate-y-8'); }, 4000);

                if (newLvl > oldLvl) {
                    this.toast(`LEVEL UP! Du hast Level ${newLvl} erreicht!`, "success");
                }
                this.render();
            },

            /* ======================================================================
               MISSION, HABIT & SPOT EXECUTION FLOWS
               ====================================================================== */
            executeMission(id, isHabit = false) {
                SoundFX.playClick();
                const list = isHabit ? State.habits : State.missions;
                const item = list.find(x => x.id === id);
                if (!item) return;

                const today = new Date().toISOString().split('T')[0];
                if (!isHabit && State.profile.completed.includes(id)) {
                    return this.toast("Operation bereits abgeschlossen.", "info");
                }
                if (isHabit && State.profile.streaks[id]?.lastDate === today) {
                    return this.toast("Routine heute bereits geloggt.", "info");
                }

                if (item.type === 'instant') {
                    this.completeItemDirectly(item, isHabit);
                } else {
                    this.openVerificationHUD(item, isHabit);
                }
            },

            completeItemDirectly(item, isHabit) {
                const today = new Date().toISOString().split('T')[0];
                let totalXp = item.xp;

                if (isHabit) {
                    const st = State.profile.streaks[item.id] || { streak: 0, lastDate: "" };
                    st.streak += 1;
                    st.lastDate = today;
                    State.profile.streaks[item.id] = st;
                    totalXp += (st.streak > 1 ? (st.streak - 1) * (item.streakBonus || 0) : 0);
                } else {
                    State.profile.completed.push(item.id);
                }

                this.awardXP(totalXp, item.name);
            },

                SoundFX.playClick();
                const r = State.rewards.find(x => x.lvl === lvl);
                if (!r) return;
                const key = `lvl${lvl}_${tier}`;

                if (State.profile.lvl < lvl) {
                    SoundFX.playError();

                    return this.openProUpgradeModal();

                if (State.profile.redeemed.includes(key)) {
                    return this.toast("Dieser Drop wurde bereits eingelöst.", "info");

                const title = r[tier];
                const rType = r[`${tier}_type`] || 'qr';
                const rInfo = r[`${tier}_info`] || 'Vorzeigen beim Partner in Köln.';

                if (rType === 'xp') {
                    State.profile.redeemed.push(key);

                    return;

                // Header

                ctx.font = '700 32px "JetBrains Mono", monospace';

                ctx.fillStyle = '#ffffff';
                ctx.font = 'italic 900 150px "Inter", sans-serif';

                    qrOptions: { errorCorrectionLevel: 'M' },
                    dotsOptions: { color: '#050507', type: 'rounded' },
                    backgroundOptions: { color: '#ffffff' },
                    cornersSquareOptions: { color: '#ff4d00', type: 'extra-rounded' },
                    cornersDotOptions: { color: '#ff4d00', type: 'dot' }
                });
                State.qrForgeInstance.append(mount);
            },

            downloadForgedQR() {
                if (State.qrForgeInstance) {
                    State.qrForgeInstance.download({ name: 'GRIND_CGN_TAG', extension: 'png' });
                    this.toast("QR-Tag exportiert!", "success");
                }
            }
        };

        window.App = App;
        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
