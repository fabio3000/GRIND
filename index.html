<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIND. // SWEAT FOR DROPS [KÖLN]</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        accent: '#FF5500',
                        neon: '#CCFF00',
                        surface: '#111114',
                        card: '#19191E',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #08080A;
            color: #FFFFFF;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .glass-pill {
            background: rgba(20, 20, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Dark Map Styling */
        .leaflet-container { background: #08080A !important; }
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(95%) grayscale(60%);
        }
        .leaflet-control-attribution { display: none !important; }

        /* Map Pin Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            70% { transform: scale(2.1); opacity: 0; }
            100% { transform: scale(2.1); opacity: 0; }
        }
        .drop-pin {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 9999px;
            background: #19191E;
            border: 2.5px solid #FF5500;
            box-shadow: 0 8px 25px rgba(255, 85, 0, 0.45);
            font-size: 20px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .drop-pin.selected {
            transform: scale(1.22);
            background: #FF5500;
            border-color: #FFFFFF;
        }
        .drop-pin::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: #FF5500;
            z-index: -1;
            animation: pulse-ring 2s infinite;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Apple Wallet Style Ticket */
        .wallet-pass {
            background: linear-gradient(145deg, #22222A 0%, #151519 100%);
            border: 1px solid rgba(255,255,255,0.12);
            position: relative;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- FLOATING TOP BAR -->
    <header class="fixed top-0 left-0 right-0 z-40 px-4 pt-3.5 pointer-events-none">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <!-- Brand & Demo Badge -->
            <div onclick="App.switchTab('map')" class="glass-pill px-4 py-2 rounded-full flex items-center gap-2.5 pointer-events-auto cursor-pointer shadow-lg">
                <span class="font-extrabold text-lg tracking-tight italic">GRIND<span class="text-accent">.</span></span>
                <span class="px-2 py-0.5 rounded-full bg-neon/15 border border-neon/40 text-neon text-[10px] font-extrabold uppercase tracking-wider">
                    Köln Live
                </span>
            </div>

            <!-- Right Controls: Sponsor Pitch Mode & Sparks -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <button onclick="App.switchTab('sponsor')" id="sponsor-top-btn" class="glass-pill px-3.5 py-2 rounded-full flex items-center gap-1.5 text-xs font-bold text-zinc-200 hover:border-neon hover:text-neon transition shadow-lg">
                    <span>💼</span> B2B / Sponsoren
                </button>
                <div onclick="App.switchTab('wallet')" class="glass-pill px-3.5 py-2 rounded-full flex items-center gap-1.5 cursor-pointer shadow-lg">
                    <span>⚡</span>
                    <span id="top-sparks" class="font-mono font-bold text-xs text-white">650</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main id="app-viewport" class="flex-1 w-full max-w-md mx-auto relative min-h-screen pb-28"></main>

    <!-- ACTIVE LIVE WORKOUT / CHALLENGE OVERLAY (Full-Screen HUD wie Strava / Nike Run Club) -->
    <div id="live-tracker-overlay" class="fixed inset-0 z-50 bg-[#08080A] hidden flex-col justify-between p-6"></div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-5 left-0 right-0 z-40 px-4 pointer-events-none">
        <div class="max-w-xs mx-auto glass-pill p-1.5 rounded-full flex items-center justify-between shadow-[0_20px_50px_rgba(0,0,0,0.85)] pointer-events-auto">
            <button onclick="App.switchTab('map')" id="nav-map" class="flex-1 py-2.5 rounded-full flex items-center justify-center gap-1.5 text-xs font-bold transition bg-accent text-white shadow-md">
                <span>📍</span> Drops
            </button>
            <button onclick="App.switchTab('feed')" id="nav-feed" class="flex-1 py-2.5 rounded-full flex items-center justify-center gap-1.5 text-xs font-bold text-zinc-400 hover:text-white transition">
                <span>🔥</span> Club
            </button>
            <button onclick="App.switchTab('wallet')" id="nav-wallet" class="flex-1 py-2.5 rounded-full flex items-center justify-center gap-1.5 text-xs font-bold text-zinc-400 hover:text-white transition relative">
                <span>🎟️</span> Wallet
                <span id="wallet-count" class="w-4 h-4 rounded-full bg-neon text-[10px] text-black flex items-center justify-center font-extrabold">2</span>
            </button>
        </div>
    </nav>

    <script>
        /* ==========================================================================
           1. DIE KÖLNER CHALLENGES (Mit echten Sponsor-Mechaniken & Prüf-Logik)
           ========================================================================== */
        const State = {
            tab: 'map', // 'map' | 'feed' | 'wallet' | 'sponsor'
            selectedDropId: 'drop_pace',
            sparks: 650,
            map: null,
            activeInterval: null,

            drops: [
                {
                    id: 'drop_pace',
                    sponsor: 'MORE NUTRITION × LAP COFFEE',
                    title: 'Aachener Weiher Pace-Drop',
                    place: 'Aachener Weiher • Lindenthal',
                    emoji: '🏃‍♂️',
                    challengeType: 'PACE_RUN', // Erfordert Mindest-km + Mindest-Pace!
                    requirementBadge: '🏃 2.0 km @ min. 5:30 /km',
                    targetKm: 2.0,
                    targetPaceSec: 330, // 5:30 min/km = 330 Sek
                    reward: '1x Gratis Iced Protein Matcha + More Sample Pack',
                    sparks: 300,
                    spotsLeft: 9,
                    totalSpots: 25,
                    lat: 50.9351,
                    lng: 6.9268,
                    claimed: false,
                    howItWorks: 'Live-GPS & Kadenz-Prüfung: Starte den Tracker am Weiher. Halte über 2,0 km eine Pace von 5:30/km oder schneller, um die Kapsel zu knacken.'
                },
                {
                    id: 'drop_sprint',
                    sponsor: 'RED BULL × KÖLN STREET CLUB',
                    title: '3-Minuten Flash-Sprint',
                    place: 'Brüsseler Platz • Belgisches Viertel',
                    emoji: '⚡',
                    challengeType: 'SPEED_SPRINT', // Erfordert Ankunft im Radius bevor der Timer abläuft!
                    requirementBadge: '⏱️ 350m Sprint in < 120 Sek.',
                    startDistanceM: 350,
                    timeLimitSec: 120,
                    reward: 'Limited Heavyweight Shirt + Cold Red Bull Zero',
                    sparks: 400,
                    spotsLeft: 3,
                    totalSpots: 10,
                    lat: 50.9384,
                    lng: 6.9369,
                    claimed: false,
                    howItWorks: 'Speed-Radar: Du bist 350m vom Spot entfernt. Sobald du startest, hast du 120 Sekunden, um physisch in den 30m-Zielkreis zu sprinten!'
                },
                {
                    id: 'drop_hiit',
                    sponsor: 'URBAN SPORTS CLUB × HYROX CGN',
                    title: 'Poller Wiesen 60s Burnout',
                    place: 'Poller Wiesen • Deutz',
                    emoji: '🔥',
                    challengeType: 'MOTION_HIIT', // Prüft Handy-Beschleunigungssensor (Squat Jumps / Burpees)
                    requirementBadge: '🔥 25 Squat-Jumps in 60 Sek.',
                    targetReps: 25,
                    reward: 'Gratis Day-Pass (Sauna / Gym) + Recovery Shake',
                    sparks: 250,
                    spotsLeft: 14,
                    totalSpots: 30,
                    lat: 50.9214,
                    lng: 6.9742,
                    claimed: false,
                    howItWorks: 'Motion-Sensor-Check: Der G-Sensor deines Smartphones zählt jede echte Wiederholung vor Ort an den Poller Wiesen.'
                },
                {
                    id: 'drop_squad',
                    sponsor: 'ESN × EHRENFELD ROASTERS',
                    title: '2-Player Buddy Check-In',
                    place: 'Venloer Str. • Ehrenfeld',
                    emoji: '🤝',
                    challengeType: 'SQUAD_SYNC', // Erfordert 2 Personen gleichzeitig vor Ort
                    requirementBadge: '🤝 2 Personen Live-Sync',
                    reward: '2x Gratis Flat White + 2x ESN Designer Bar',
                    sparks: 200,
                    spotsLeft: 7,
                    totalSpots: 15,
                    lat: 50.9465,
                    lng: 6.9195,
                    claimed: false,
                    howItWorks: 'Kein Solo-Claim: Verbinde dich vor Ort per 1-Tap Radar mit einem Trainingspartner. Nur gemeinsam geht die Kapsel auf.'
                }
            ],

            wallet: [
                {
                    id: 'w_101',
                    sponsor: 'MORE NUTRITION × BELGISCHES VIERTEL',
                    title: '1x Gratis Iced Protein Matcha',
                    code: 'MORE-CGN-941',
                    verifiedBy: 'Verifiziert: 2.0 km Run (4:58 /km Pace)',
                    emoji: '🧋',
                    used: false
                },
                {
                    id: 'w_102',
                    sponsor: 'URBAN SPORTS CLUB KÖLN',
                    title: '1x Free Recovery Sauna Day-Pass',
                    code: 'USC-RHEIN-402',
                    verifiedBy: 'Verifiziert: Poller Wiesen HIIT Session',
                    emoji: '🧖‍♂️',
                    used: false
                }
            ],

            clubFeed: [
                { user: 'Fabio M.', veedel: 'Südstadt', badge: '4:52 /km Pace ✓', text: 'hat den Aachener Weiher Pace-Drop geknackt (2.0 km in 09:44 min)', time: 'vor 3 Min', emoji: '🏃‍♂️' },
                { user: 'Lena & Sarah', veedel: 'Ehrenfeld', badge: 'Buddy-Sync ✓', text: 'haben zusammen den ESN × Roasters Drop auf der Venloer Str. geöffnet', time: 'vor 11 Min', emoji: '🤝' },
                { user: 'Tom_0221', veedel: 'Belgisches', badge: '94 Sek. Sprint ✓', text: 'hat sich eines der letzten 3 Shirts beim Brüsseler Platz Flash-Sprint geholt!', time: 'vor 24 Min', emoji: '⚡' }
            ]
        };

        /* ==========================================================================
           2. APP CONTROLLER & LIVE TRACKING ENGINES
           ========================================================================== */
        const App = {
            init() {
                this.updateBadges();
                this.render();
            },

            updateBadges() {
                document.getElementById('top-sparks').innerText = State.sparks;
                const openCount = State.wallet.filter(w => !w.used).length;
                const wc = document.getElementById('wallet-count');
                wc.innerText = openCount;
                wc.style.display = openCount > 0 ? 'flex' : 'none';
            },

            switchTab(tab) {
                State.tab = tab;
                ['map', 'feed', 'wallet'].forEach(t => {
                    const btn = document.getElementById(`nav-${t}`);
                    if (!btn) return;
                    btn.className = (t === tab)
                        ? "flex-1 py-2.5 rounded-full flex items-center justify-center gap-1.5 text-xs font-bold transition bg-accent text-white shadow-md relative"
                        : "flex-1 py-2.5 rounded-full flex items-center justify-center gap-1.5 text-xs font-bold text-zinc-400 hover:text-white transition relative";
                });
                this.render();
            },

            render() {
                const vp = document.getElementById('app-viewport');
                if (State.tab === 'map') {
                    vp.innerHTML = this.renderMapTab();
                    setTimeout(() => this.initMap(), 40);
                } else if (State.tab === 'feed') {
                    vp.innerHTML = this.renderFeedTab();
                } else if (State.tab === 'wallet') {
                    vp.innerHTML = this.renderWalletTab();
                } else if (State.tab === 'sponsor') {
                    vp.innerHTML = this.renderSponsorPitchTab();
                }
            },

            /* ----------------------------------------------------------------------
               VIEW 1: MAP & CHALLENGE CARDS
               ---------------------------------------------------------------------- */
            renderMapTab() {
                const d = State.drops.find(x => x.id === State.selectedDropId) || State.drops[0];

                return `
                    <!-- MAP CONTAINER -->
                    <div class="relative w-full h-[50vh] overflow-hidden rounded-b-[36px] border-b border-white/10 shadow-2xl">
                        <div id="map-el" class="w-full h-full z-10"></div>
                        <div class="absolute bottom-3.5 left-4 right-4 z-20 flex justify-between items-center pointer-events-none">
                            <div class="glass-pill px-3.5 py-1.5 rounded-full text-[11px] font-bold text-zinc-200">
                                ⚡ Sweat-to-Unlock: Verdiene dir echte Drops in Köln
                            </div>
                        </div>
                    </div>

                    <!-- DROP SELECTOR PILLS -->
                    <div class="px-4 -mt-5 relative z-30">
                        <div class="flex gap-2.5 overflow-x-auto no-scrollbar py-2">
                            ${State.drops.map(item => {
                                const active = item.id === d.id;
                                return `
                                    <button onclick="App.selectDrop('${item.id}')" class="flex-shrink-0 px-4 py-2.5 rounded-2xl flex items-center gap-2 text-xs font-extrabold transition ${active ? 'bg-white text-black shadow-xl scale-[1.03]' : 'bg-card text-zinc-300 border border-white/10'}">
                                        <span>${item.emoji}</span>
                                        <span>${item.place.split('•')[0].trim()}</span>
                                        <span class="text-[10px] px-2 py-0.5 rounded-full ${active ? 'bg-black text-neon' : 'bg-white/10 text-zinc-300'}">${item.spotsLeft} da</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- ACTIVE DROP CHALLENGE CARD -->
                        <div class="mt-2 bg-card border border-white/10 rounded-[28px] p-5 shadow-2xl">
                            <!-- Sponsor Tag & Challenge Badge -->
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                <span class="text-[10px] font-extrabold uppercase tracking-widest text-accent bg-accent/10 border border-accent/30 px-2.5 py-1 rounded-full">
                                    PARTNER: ${d.sponsor}
                                </span>
                                <span class="font-mono text-[11px] font-extrabold bg-neon/15 text-neon border border-neon/30 px-2.5 py-1 rounded-full">
                                    ${d.requirementBadge}
                                </span>
                            </div>

                            <h2 class="text-2xl font-extrabold text-white leading-tight">${d.title}</h2>
                            <p class="text-xs text-zinc-400 mt-0.5 mb-3">${d.place} • Noch ${d.spotsLeft} von ${d.totalSpots} Drops verfügbar</p>

                            <!-- Wie wird es geprüft? -->
                            <div class="bg-surface border border-white/5 rounded-2xl p-3.5 mb-3">
                                <div class="flex items-center gap-2 text-[11px] font-bold text-zinc-300 mb-1">
                                    <span>🛡️</span> Live-Tracking & Anti-Cheat Bedingung:
                                </div>
                                <p class="text-xs text-zinc-400 leading-relaxed">${d.howItWorks}</p>
                            </div>

                            <!-- Belohnung -->
                            <div class="bg-gradient-to-r from-accent/15 to-surface border border-accent/30 rounded-2xl p-3.5 mb-5 flex items-center justify-between">
                                <div>
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-accent block">Wird bei Erfolg sofort freigeschaltet</span>
                                    <span class="text-sm font-extrabold text-white">🎁 ${d.reward}</span>
                                </div>
                                <span class="font-mono text-xs font-extrabold text-neon bg-black/50 px-2.5 py-1 rounded-lg">+${d.sparks}⚡</span>
                            </div>

                            <!-- START CHALLENGE BUTTON -->
                            ${d.claimed ? `
                                <button onclick="App.switchTab('wallet')" class="w-full py-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-extrabold text-sm">
                                    ✓ Challenge geschafft! Gutschein in deiner Wallet →
                                </button>
                            ` : `
                                <button onclick="App.launchLiveChallenge('${d.id}')" class="w-full py-4 rounded-2xl bg-accent hover:bg-[#ff661a] active:scale-[0.99] text-white font-extrabold text-sm shadow-[0_12px_35px_rgba(255,85,0,0.45)] transition flex items-center justify-center gap-2">
                                    <span>🔥</span> Live-Challenge jetzt starten (${d.requirementBadge.split(' ')[1]})
                                </button>
                            `}
                        </div>
                    </div>
                `;
            },

            initMap() {
                const el = document.getElementById('map-el');
                if (!el || typeof L === 'undefined') return;
                if (State.map) { State.map.remove(); State.map = null; }

                const activeDrop = State.drops.find(x => x.id === State.selectedDropId) || State.drops[0];
                const map = L.map(el, { zoomControl: false }).setView([activeDrop.lat, activeDrop.lng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

                State.drops.forEach(d => {
                    const isSel = d.id === activeDrop.id;
                    const icon = L.divIcon({
                        className: 'custom-pin',
                        html: `<div class="drop-pin ${isSel ? 'selected' : ''}">${d.emoji}</div>`,
                        iconSize: [46, 46],
                        iconAnchor: [23, 23]
                    });
                    L.marker([d.lat, d.lng], { icon }).addTo(map).on('click', () => this.selectDrop(d.id));
                });

                State.map = map;
            },

            selectDrop(id) {
                State.selectedDropId = id;
                this.render();
            },

            /* ======================================================================
               3. DAS HERZSTÜCK: DIE INTERAKTIVEN LIVE-CHALLENGE TRACKER (DEMO + ECHT)
               ====================================================================== */
            launchLiveChallenge(dropId) {
                const d = State.drops.find(x => x.id === dropId);
                if (!d) return;

                const overlay = document.getElementById('live-tracker-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');

                if (d.challengeType === 'PACE_RUN') {
                    this.startPaceRunEngine(d, overlay);
                } else if (d.challengeType === 'SPEED_SPRINT') {
                    this.startSprintRadarEngine(d, overlay);
                } else if (d.challengeType === 'MOTION_HIIT') {
                    this.startMotionHiitEngine(d, overlay);
                } else {
                    this.startSquadSyncEngine(d, overlay);
                }
            },

            closeLiveChallenge() {
                if (State.activeInterval) clearInterval(State.activeInterval);
                const overlay = document.getElementById('live-tracker-overlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            },

            /* --- ENGINE A: LIVE GPS PACE TRACKER (Mindest-Pace & Mindest-km) --- */
            startPaceRunEngine(drop, overlay) {
                let currentKm = 0.0;
                let elapsedSec = 0;
                let currentPaceStr = "5:08";
                let cadence = 172;
                let speedMultiplier = 1; // Für den Demo-Turbo-Button

                const renderTracker = () => {
                    const pct = Math.min(100, (currentKm / drop.targetKm) * 100);
                    overlay.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="text-[10px] font-mono uppercase tracking-widest text-neon flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full bg-neon animate-ping"></span>
                                    GPS & CADENCE ANTI-CHEAT ACTIVE
                                </span>
                                <h3 class="text-lg font-extrabold text-white mt-0.5">${drop.title}</h3>
                            </div>
                            <button onclick="App.closeLiveChallenge()" class="px-3 py-1.5 rounded-full bg-card border border-white/10 text-xs text-zinc-400">Abbrechen</button>
                        </div>

                        <!-- BIG STRAVA/NIKE STYLE TELEMETRY NUMBERS -->
                        <div class="my-auto space-y-6 text-center">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-widest text-zinc-500">Gelaufene Distanz (Ziel: ${drop.targetKm.toFixed(1)} km)</span>
                                <div class="font-mono text-7xl font-extrabold text-white tracking-tighter mt-1">
                                    ${currentKm.toFixed(2)} <span class="text-2xl text-accent">km</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-3">
                                <div class="bg-card border border-emerald-500/40 rounded-2xl p-3.5">
                                    <span class="text-[10px] font-bold uppercase text-zinc-400 block">Aktuelle Pace</span>
                                    <span class="font-mono text-2xl font-extrabold text-emerald-400">${currentPaceStr}</span>
                                    <span class="text-[10px] text-emerald-400 block">✓ Ziel ≤ 5:30</span>
                                </div>
                                <div class="bg-card border border-white/10 rounded-2xl p-3.5">
                                    <span class="text-[10px] font-bold uppercase text-zinc-400 block">Schritt-Kadenz</span>
                                    <span class="font-mono text-2xl font-extrabold text-white">${cadence}</span>
                                    <span class="text-[10px] text-zinc-500 block">spm (Kein Bike)</span>
                                </div>
                                <div class="bg-card border border-white/10 rounded-2xl p-3.5">
                                    <span class="text-[10px] font-bold uppercase text-zinc-400 block">Laufzeit</span>
                                    <span class="font-mono text-2xl font-extrabold text-white">${Math.floor(elapsedSec/60)}:${String(elapsedSec%60).padStart(2,'0')}</span>
                                    <span class="text-[10px] text-zinc-500 block">Minuten</span>
                                </div>
                            </div>

                            <!-- Progress Bar -->
                            <div class="bg-card p-4 rounded-2xl border border-white/10 text-left">
                                <div class="flex justify-between text-xs font-bold mb-2">
                                    <span class="text-zinc-300">Drop-Freischaltung</span>
                                    <span class="text-neon">${Math.round(pct)}%</span>
                                </div>
                                <div class="w-full h-3 bg-black rounded-full overflow-hidden">
                                    <div class="h-full bg-gradient-to-r from-accent to-neon transition-all duration-300" style="width: ${pct}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- DEMO TURBO CONTROLS (Damit du jetzt sofort testen kannst!) -->
                        <div class="space-y-2.5">
                            <button onclick="window._boostRun()" class="w-full py-4 rounded-2xl bg-neon text-black font-extrabold text-sm shadow-[0_0_30px_rgba(204,255,0,0.35)] active:scale-95 transition">
                                ⚡ DEMO-TURBO: +0.50 km mit 4:55er Pace vorspulen
                            </button>
                            <p class="text-[11px] text-center text-zinc-500">
                                Im Live-Betrieb misst die App über GPS-Wegpunkte + Smartphone-Schrittzähler deine echte Laufrunde am Aachener Weiher.
                            </p>
                        </div>
                    `;
                };

                window._boostRun = () => {
                    currentKm = Math.min(drop.targetKm, currentKm + 0.55);
                    elapsedSec += 160;
                    currentPaceStr = "4:52";
                    cadence = 178;
                    renderTracker();
                    if (currentKm >= drop.targetKm) {
                        clearInterval(State.activeInterval);
                        setTimeout(() => this.completeChallenge(drop, `2.0 km Run @ ${currentPaceStr}/km Pace`), 400);
                    }
                };

                renderTracker();
                State.activeInterval = setInterval(() => {
                    currentKm = Math.min(drop.targetKm, currentKm + 0.03 * speedMultiplier);
                    elapsedSec += 1;
                    cadence = 170 + Math.floor(Math.random() * 8);
                    const paceSec = 295 + Math.floor(Math.random() * 12);
                    currentPaceStr = `${Math.floor(paceSec/60)}:${String(paceSec%60).padStart(2,'0')}`;
                    renderTracker();

                    if (currentKm >= drop.targetKm) {
                        clearInterval(State.activeInterval);
                        this.completeChallenge(drop, `2.0 km Run @ ${currentPaceStr}/km Pace`);
                    }
                }, 1000);
            },

            /* --- ENGINE B: FLASH-SPRINT RADAR (Sei in < 120 Sek am Spot!) --- */
            startSprintRadarEngine(drop, overlay) {
                let distLeft = drop.startDistanceM;
                let secLeft = drop.timeLimitSec;

                const renderSprint = () => {
                    overlay.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-mono uppercase tracking-widest text-accent">⚡ LIVE PROXIMITY SPRINT</span>
                            <button onclick="App.closeLiveChallenge()" class="px-3 py-1.5 rounded-full bg-card border border-white/10 text-xs text-zinc-400">Abbrechen</button>
                        </div>

                        <div class="my-auto text-center space-y-6">
                            <div class="w-40 h-40 rounded-full border-4 border-accent/40 mx-auto flex flex-col items-center justify-center relative bg-accent/5">
                                <span class="text-[11px] uppercase font-bold text-zinc-400">Distanz zum Drop</span>
                                <span class="font-mono text-5xl font-extrabold text-white mt-1">${distLeft}m</span>
                            </div>

                            <div>
                                <span class="text-xs uppercase font-bold text-zinc-500">Verbleibende Zeit für die letzten ${drop.spotsLeft} Shirts</span>
                                <div class="font-mono text-5xl font-extrabold text-neon mt-1">${secLeft}s</div>
                            </div>
                        </div>

                        <button onclick="window._sprintStep()" class="w-full py-4 rounded-2xl bg-accent text-white font-extrabold text-sm shadow-lg active:scale-95 transition">
                            🏃‍♂️ DEMO-SPRINT: 100 Meter näher an den Brüsseler Platz sprinten
                        </button>
                    `;
                };

                window._sprintStep = () => {
                    distLeft = Math.max(0, distLeft - 100);
                    renderSprint();
                    if (distLeft <= 20) {
                        clearInterval(State.activeInterval);
                        this.completeChallenge(drop, `350m Flash-Sprint in ${drop.timeLimitSec - secLeft} Sek.`);
                    }
                };

                renderSprint();
                State.activeInterval = setInterval(() => {
                    secLeft = Math.max(0, secLeft - 1);
                    distLeft = Math.max(0, distLeft - 4);
                    renderSprint();
                    if (distLeft <= 20) {
                        clearInterval(State.activeInterval);
                        this.completeChallenge(drop, `350m Flash-Sprint in ${drop.timeLimitSec - secLeft} Sek.`);
                    }
                }, 1000);
            },

            /* --- ENGINE C: MOTION SENSOR HIIT (Accelerometer Reps) --- */
            startMotionHiitEngine(drop, overlay) {
                let reps = 0;

                const renderHiit = () => {
                    const pct = Math.min(100, (reps / drop.targetReps) * 100);
                    overlay.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-mono uppercase tracking-widest text-neon">🔥 G-SENSOR WORKOUT VERIFICATION</span>
                            <button onclick="App.closeLiveChallenge()" class="px-3 py-1.5 rounded-full bg-card border border-white/10 text-xs text-zinc-400">Abbrechen</button>
                        </div>

                        <div class="my-auto text-center space-y-6">
                            <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">Erkannte Squat-Jumps / Burpees</span>
                            <div class="font-mono text-8xl font-extrabold text-white">${reps}<span class="text-3xl text-zinc-500">/${drop.targetReps}</span></div>
                            <div class="w-full h-3 bg-card rounded-full overflow-hidden">
                                <div class="h-full bg-neon transition-all" style="width: ${pct}%"></div>
                            </div>
                            <p class="text-xs text-zinc-400">Schüttle dein Smartphone (echter G-Sensor aktiv!) oder nutze den Demo-Button:</p>
                        </div>

                        <button onclick="window._addReps()" class="w-full py-4 rounded-2xl bg-neon text-black font-extrabold text-sm active:scale-95 transition">
                            🔥 +5 Wiederholungen ausführen (Sensor-Burst)
                        </button>
                    `;
                };

                window._addReps = () => {
                    reps = Math.min(drop.targetReps, reps + 5);
                    renderHiit();
                    if (reps >= drop.targetReps) {
                        window.removeEventListener('devicemotion', motionListener);
                        this.completeChallenge(drop, `${drop.targetReps} G-Sensor Verified Reps`);
                    }
                };

                const motionListener = (event) => {
                    const acc = event.accelerationIncludingGravity;
                    if (acc && (Math.abs(acc.y) > 16 || Math.abs(acc.z) > 16)) {
                        window._addReps();
                    }
                };
                window.addEventListener('devicemotion', motionListener);
                renderHiit();
            },

            /* --- ENGINE D: 2-PLAYER SQUAD SYNC --- */
            startSquadSyncEngine(drop, overlay) {
                overlay.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-mono uppercase tracking-widest text-accent">🤝 DUAL PROXIMITY HANDSHAKE</span>
                        <button onclick="App.closeLiveChallenge()" class="px-3 py-1.5 rounded-full bg-card border border-white/10 text-xs text-zinc-400">Abbrechen</button>
                    </div>

                    <div class="my-auto text-center space-y-5">
                        <div class="text-6xl animate-bounce">🤝</div>
                        <h3 class="text-2xl font-extrabold text-white">Suche Buddy im 15m-Radius...</h3>
                        <p class="text-xs text-zinc-400 max-w-xs mx-auto">Damit Sponsoren doppelt profitieren, öffnet sich dieser Drop nur, wenn 2 Freunde gleichzeitig vor dem Café stehen.</p>
                        <div class="bg-card border border-white/10 rounded-2xl p-4 font-mono text-sm text-neon">
                            ✓ Gefunden: MORITZ_CGN (Distanz: 1.8m)
                        </div>
                    </div>

                    <button onclick="App.completeChallenge(State.drops[3], 'Buddy-Sync mit MORITZ_CGN')" class="w-full py-4 rounded-2xl bg-accent text-white font-extrabold text-sm">
                        ⚡ Gemeinsam einchecken & 2x Drop öffnen
                    </button>
                `;
            },

            /* --- ABSCHLUSS & BELOHNUNGS-AUSGABE --- */
            completeChallenge(drop, proofSummary) {
                this.closeLiveChallenge();
                drop.claimed = true;
                drop.spotsLeft = Math.max(0, drop.spotsLeft - 1);
                State.sparks += drop.sparks;

                State.wallet.unshift({
                    id: 'w_' + Date.now(),
                    sponsor: drop.sponsor,
                    title: drop.reward,
                    code: `CGN-${Math.floor(1000 + Math.random() * 9000)}`,
                    verifiedBy: `Verifiziert: ${proofSummary}`,
                    emoji: drop.emoji,
                    used: false
                });

                State.clubFeed.unshift({
                    user: 'Du (Köln)',
                    veedel: drop.place.split('•')[1]?.trim() || 'Köln',
                    badge: `${proofSummary} ✓`,
                    text: `hast gerade '${drop.reward}' von ${drop.sponsor} freigeschaltet!`,
                    time: 'Gerade eben',
                    emoji: drop.emoji
                });

                this.updateBadges();
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 90, spread: 75, origin: { y: 0.65 } });
                }
                this.switchTab('wallet');
            },

            /* ======================================================================
               4. TAB: CLUB FEED (Social Proof & Live-Kölner-Aktivität)
               ====================================================================== */
            renderFeedTab() {
                return `
                    <div class="pt-20 px-4 space-y-5">
                        <div>
                            <span class="text-xs font-extrabold uppercase tracking-wider text-accent">Live Sweat Feed</span>
                            <h1 class="text-3xl font-extrabold mt-0.5">Köln Club 🔥</h1>
                            <p class="text-xs text-zinc-400 mt-1">Jeder Drop hier wurde durch echte Pace, Sprints oder Workouts in Köln verdient.</p>
                        </div>

                        <div class="space-y-3">
                            ${State.clubFeed.map(f => `
                                <div class="bg-card border border-white/10 rounded-3xl p-4">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="flex items-center gap-2.5">
                                            <span class="w-9 h-9 rounded-2xl bg-surface flex items-center justify-center text-lg">${f.emoji}</span>
                                            <div>
                                                <span class="text-xs font-extrabold text-white">${f.user}</span>
                                                <span class="text-[11px] text-zinc-500 block">${f.veedel} •${f.time}</span>
                                            </div>
                                        </div>
                                        <span class="font-mono text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                                            ${f.badge}
                                        </span>
                                    </div>
                                    <p class="text-xs text-zinc-300 leading-relaxed">${f.text}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            /* ======================================================================
               5. TAB: WALLET (Verifizierte Beute-Gutscheine)
               ====================================================================== */
            renderWalletTab() {
                return `
                    <div class="pt-20 px-4 space-y-5">
                        <div>
                            <span class="text-xs font-extrabold uppercase tracking-wider text-neon">Earned, Not Given</span>
                            <h1 class="text-3xl font-extrabold mt-0.5">Deine Wallet 🎟️</h1>
                            <p class="text-xs text-zinc-400 mt-1">Jedes Ticket trägt deinen verifizierten Workout-Stempel. Einfach an der Kasse vorzeigen.</p>
                        </div>

                        <div class="space-y-4">
                            ${State.wallet.map(w => `
                                <div class="wallet-pass rounded-[28px] p-5 shadow-2xl ${w.used ? 'opacity-40' : ''}">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-[10px] font-extrabold uppercase tracking-widest text-accent">${w.sponsor}</span>
                                        <span class="font-mono text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">${w.verifiedBy}</span>
                                    </div>
                                    <div class="flex items-center gap-3.5 my-3">
                                        <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-2xl">${w.emoji}</div>
                                        <h3 class="text-lg font-extrabold text-white leading-snug">${w.title}</h3>
                                    </div>
                                    <div class="pt-3 border-t border-dashed border-white/15 flex items-center justify-between">
                                        <div>
                                            <span class="text-[10px] text-zinc-500 uppercase font-bold block">Partner-Code</span>
                                            <span class="font-mono text-base font-extrabold text-neon tracking-widest">${w.code}</span>
                                        </div>
                                        ${w.used ? `
                                            <span class="text-xs font-bold text-zinc-500">Eingelöst ✓</span>
                                        ` : `
                                            <button onclick="App.redeemWalletItem('${w.id}')" class="px-4 py-2.5 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-neon transition">
                                                Jetzt vorzeigen & einlösen
                                            </button>
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            redeemWalletItem(id) {
                const item = State.wallet.find(x => x.id === id);
                if (item) item.used = true;
                this.updateBadges();
                this.render();
            },

            /* ======================================================================
               6. TAB: B2B SPONSOR PITCH DECK (Warum Marken wie More, ESN & Cafés zahlen)
               ====================================================================== */
            renderSponsorPitchTab() {
                return `
                    <div class="pt-20 px-4 space-y-6">
                        <div class="bg-gradient-to-br from-accent/25 via-card to-card border border-accent/40 rounded-[28px] p-5">
                            <span class="text-[10px] font-mono font-extrabold uppercase tracking-widest text-neon bg-black/60 px-2.5 py-1 rounded-full">
                                B2B PARTNER & SPONSOR COCKPIT
                            </span>
                            <h1 class="text-2xl font-extrabold text-white mt-3 leading-tight">
                                Warum Marken wie More Nutrition, ESN, Lululemon & Kölner Cafés uns lieben:
                            </h1>
                            <p class="text-xs text-zinc-300 mt-2 leading-relaxed">
                                Statt langweiliger Instagram-Werbung kaufen Sponsoren bei <strong>GRIND.</strong> echte physische Bewegung, garantierte Ladenbesuche (Foot Traffic) und hochgradig authentischen Story-Content.
                            </p>
                        </div>

                        <!-- Live ROI Kennzahlen für Sponsoren -->
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-card border border-white/10 rounded-2xl p-4">
                                <span class="text-[10px] font-bold uppercase text-zinc-400">Garantierte Ladenbesuche</span>
                                <div class="font-mono text-2xl font-extrabold text-white mt-1">100% CPA</div>
                                <span class="text-[10px] text-emerald-400">Zahle nur pro echtem Check-In</span>
                            </div>
                            <div class="bg-card border border-white/10 rounded-2xl p-4">
                                <span class="text-[10px] font-bold uppercase text-zinc-400">Ø Pace-Drop Reichweite</span>
                                <div class="font-mono text-2xl font-extrabold text-neon mt-1">4.2 km</div>
                                <span class="text-[10px] text-zinc-400">pro Teilnehmer durch Köln</span>
                            </div>
                        </div>

                        <!-- Eigenen gesponserten Drop erstellen (Live-Demo für Sponsoren-Gespräche!) -->
                        <div class="bg-card border border-white/10 rounded-[28px] p-5">
                            <h3 class="text-base font-extrabold text-white mb-1">🚀 Live-Demo: Sponsor-Drop in 10 Sek. erstellen</h3>
                            <p class="text-xs text-zinc-400 mb-4">Zeige einem Café-Besitzer oder Brand-Manager in Köln live, wie sein eigener Drop aussieht:</p>

                            <form onsubmit="App.createSponsorDrop(event)" class="space-y-3">
                                <input id="sp-brand" placeholder="Brand / Sponsor (z.B. LAP COFFEE × ESN)" required class="w-full p-3 rounded-xl bg-surface border border-white/10 text-xs text-white outline-none focus:border-accent">
                                <input id="sp-title" placeholder="Challenge-Name (z.B. Rheinufer 3km Tempo-Drop)" required class="w-full p-3 rounded-xl bg-surface border border-white/10 text-xs text-white outline-none focus:border-accent">
                                <div class="grid grid-cols-2 gap-2">
                                    <select id="sp-type" class="p-3 rounded-xl bg-surface border border-white/10 text-xs text-white outline-none">
                                        <option value="PACE_RUN">🏃‍♂️ Pace-Run (km + Pace)</option>
                                        <option value="SPEED_SPRINT">⚡ 3-Minuten Flash-Sprint</option>
                                        <option value="MOTION_HIIT">🔥 60s HIIT Sensor-Workout</option>
                                        <option value="SQUAD_SYNC">🤝 2-Personen Buddy-Sync</option>
                                    </select>
                                    <input id="sp-reward" placeholder="Reward (z.B. Free Iced Matcha)" required class="p-3 rounded-xl bg-surface border border-white/10 text-xs text-white outline-none">
                                </div>
                                <button type="submit" class="w-full py-3.5 rounded-xl bg-neon text-black font-extrabold text-xs uppercase tracking-wider shadow-lg">
                                    ⚡ Sponsor-Drop sofort auf die Köln-Karte setzen
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            },

            createSponsorDrop(e) {
                e.preventDefault();
                const sponsor = document.getElementById('sp-brand').value.trim().toUpperCase();
                const title = document.getElementById('sp-title').value.trim();
                const type = document.getElementById('sp-type').value;
                const reward = document.getElementById('sp-reward').value.trim();

                const badges = {
                    PACE_RUN: '🏃 2.0 km @ min. 5:30 /km',
                    SPEED_SPRINT: '⏱️ 350m Sprint in < 120 Sek.',
                    MOTION_HIIT: '🔥 25 Squat-Jumps in 60 Sek.',
                    SQUAD_SYNC: '🤝 2 Personen Live-Sync'
                };

                const newId = 'drop_' + Date.now();
                State.drops.unshift({
                    id: newId,
                    sponsor,
                    title,
                    place: 'Rathenauplatz • Köln Zentrum',
                    emoji: '🔥',
                    challengeType: type,
                    requirementBadge: badges[type],
                    targetKm: 2.0,
                    startDistanceM: 350,
                    timeLimitSec: 120,
                    targetReps: 25,
                    reward,
                    sparks: 350,
                    spotsLeft: 15,
                    totalSpots: 15,
                    lat: 50.9302,
                    lng: 6.9392,
                    claimed: false,
                    howItWorks: `Gesponserte Live-Challenge von ${sponsor}: Absolviere die Vorgabe (${badges[type]}), um deinen Drop direkt in die Wallet zu laden.`
                });

                State.selectedDropId = newId;
                this.switchTab('map');
            }
        };

        window.App = App;
        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
