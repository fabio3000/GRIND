            if(!timestamp) return "Gerade eben";
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "Gerade eben";
            if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
            if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;

            toast.innerHTML = `${icon} <div><div class="font-black text-[10px] uppercase tracking-widest text-gray-400 mb-0.5">${type === 'flame' ? 'Reaction' : 'System'}</div><div>${msg}</div></div>`;

            try {
                if(!state.profile || !state.profile.alias) return;
                await addDoc(collection(db, 'plot_activities'), {
                    alias: state.profile.alias,
                    uid: state.user.uid,
                    isPro: !!state.profile.hasPremium, 
                    type: type, 
                    text: text,
                    flames: [],
                    timestamp: Date.now()
                });
            } catch(e) { console.error(e); }
        };

        /* -----------------------------------------------------------
           MODULE 4: DYNAMIC BACKGROUNDS & LEVEL LOGIC
        ----------------------------------------------------------- */
        const updateBackground = (lvl) => {
            const body = document.body;
            body.classList.remove('bg-lvl-default', 'bg-lvl-purple', 'bg-lvl-blue', 'bg-lvl-red');
            if (lvl >= 30) body.classList.add('bg-lvl-red');
            else if (lvl >= 20) body.classList.add('bg-lvl-blue');
            else if (lvl >= 10) body.classList.add('bg-lvl-purple');
            else body.classList.add('bg-lvl-default');
        };

        const getActiveWeek = () => {
            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            if(now < start) return 1;
            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate() + 1);
            firstSunday.setHours(23, 59, 59, 999);
            if (now.getTime() <= firstSunday.getTime()) return 1;
            const diffDays = Math.floor((now.getTime() - firstSunday.getTime()) / (1000 * 60 * 60 * 24)); 
            return Math.max(1, Math.min(2 + Math.floor(diffDays / 7), 4));
        };

        const getSeasonStatus = () => {
            if (!state.seasonConfig) return { status: 'loading' };
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            const end = new Date(state.seasonConfig.end);
            end.setHours(23, 59, 59, 999);
            if (now < start) return { status: 'upcoming', date: start };

        };

                        state.profile = snap.data();
                        updateBackground(state.profile.lvl || 1);
                        if (['loading', 'auth', 'onboarding'].includes(state.view)) state.view = 'dashboard';
                        render();
                    } else { state.view = 'onboarding'; render(); }
                });
                
                onSnapshot(collection(db, 'plot_pending_proofs'), (snap) => {
                    state.pendingMissions = snap.docs.map(d => d.data()).filter(d => d.uid === user.uid).map(d => d.mid);
                    if(state.view === 'dashboard') render();
                });

                const qActs = query(collection(db, 'plot_activities'), orderBy('timestamp', 'desc'), limit(50));
                onSnapshot(qActs, (snap) => {
                    const acts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    checkFlameNotifications(acts);
                    state.activities = acts;
                    if(state.view === 'dashboard') render();
                });

                    if (snap.exists()) {

                        state.weeklyData = d.weeklyData || state.weeklyData;
                        state.rewardData = d.rewardData || [];

                        <!-- TRACK & OPERATIONS FEHLEN NICHT - IDENTISCH ZUM ORIGINAL RENDERN -->
                        <div class="mb-12">
                            <h3 class="text-2xl font-black italic uppercase italic mb-6">Operations</h3>
                            <div class="space-y-4">
                                ${(state.weeklyData[state.currentWeekTab]?.missions || []).map(m => {
                                    const done = p.completed.includes(m.id);
                                    return `<div class="card p-6 rounded flex justify-between items-center ${done ? 'opacity-50 grayscale' : ''}">
                                        <div><h4 class="font-black italic uppercase">${m.name}</h4><p class="text-gray-400 text-xs mt-1">${m.desc}</p></div>
                                        <div class="text-right">
                                            <span class="block text-[#ff4d00] font-black text-2xl italic">+${m.xp}</span>
                                            <button onclick="window.claimMission('${m.id}', ${m.xp}, '${m.name}')" class="btn-grind px-6 py-2" ${done ? 'disabled' : ''}>${done ? 'Cleared' : 'Clear'}</button>
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>

                        <!-- MODULAR CREW FEED WITH FLAME BUTTON -->
                        <section class="max-w-3xl mx-auto mb-12">
                            <h3 class="text-2xl font-black italic uppercase italic mb-8">Crew Activity</h3>
                            <div class="space-y-4">
                                ${activities.map(act => {
                                    const hasReacted = act.flames?.includes(p.uid);
                                    const flameCount = (act.flames || []).length;
                                    return `<div class="flex gap-4">
                                        <div class="w-10 h-10 rounded-full border border-gray-800 bg-black flex items-center justify-center text-xs font-black uppercase text-gray-600">${act.alias[0]}</div>
                                        <div class="card p-4 rounded-sm flex-1">
                                            <div class="flex justify-between items-start mb-2">
                                                <span class="text-[8px] font-bold text-gray-600 uppercase">${getRelativeTime(act.timestamp)}</span>
                                                <button onclick="window.reactActivity('${act.id}')" class="flex items-center gap-1.5 transition-transform hover:scale-110 ${hasReacted ? 'opacity-100' : 'opacity-40'}">
                                                    <span class="text-sm">🔥</span>
                                                    <span class="text-[10px] font-black ${flameCount > 0 ? 'text-[#ff4d00]' : 'text-gray-500'}">${flameCount}</span>
                                                </button>
                                            </div>
                                            <p class="text-xs text-gray-300"><span class="text-[#ff4d00] font-black italic uppercase">${act.alias}</span> ${act.text}</p>
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </section>
                    </main>

                    <footer class="mt-20 border-t border-white/5 pt-8 text-center pb-8">
                        <div class="flex justify-center gap-6 text-[10px] uppercase font-bold text-gray-600 mb-6">
                            <span onclick="window.setView('impressum')" class="hover:text-white cursor-pointer">Impressum</span>
                            <span onclick="window.setView('datenschutz')" class="hover:text-white cursor-pointer">Datenschutz</span>
                        </div>
                        <p class="text-[#1f1f1f] text-[9px] uppercase font-black tracking-widest">© 2026 GRIND. NETWORK.</p>
                    </footer>
                `;
                appDiv.innerHTML = html;
            }
        }
    </script>

    <!-- INSTALL BANNER (Bleibt wie im Original) -->
    <div id="install-banner" class="hidden fixed bottom-6 left-4 right-4 bg-[#111] border border-[#ff4d00]/30 p-5 rounded shadow-2xl z-[999999] flex flex-col gap-3">
        <p class="text-white text-xs font-bold leading-relaxed">Füge die App zum Home-Bildschirm hinzu, um täglich zu tracken.</p>
