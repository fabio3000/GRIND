    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #ffffff; 
            overflow-x: hidden; 
            min-height: 100vh;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
        }

        #app { position: relative; z-index: 10; }

        /* --- VIDEO BACKGROUND --- */
        .video-bg-container {
            position: fixed; inset: 0; z-index: 0; background: #000; pointer-events: none;
        }
        .video-bg {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.35;
        }
        .video-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, #000000 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0.4) 100%);
        }
        
        /* --- ULTRA PREMIUM GLASS CARDS --- */
        .card { 
            background: rgba(15, 15, 15, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05); 
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease; 
            will-change: transform;
        }
        .card:hover { border-color: rgba(255, 77, 0, 0.2); }

        /* --- INPUTS & SELECTS --- */
        input, select, textarea {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: white !important;
            border-radius: 14px !important;
            padding: 14px 16px !important;
            font-size: 13px !important;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }
        input:focus, select:focus, textarea:focus { 
            border-color: #ff4d00 !important; 
            background: rgba(0,0,0,0.6) !important;
            outline: none !important; 
            box-shadow: 0 0 0 2px rgba(255,77,0,0.15) !important;
        }

        /* --- CLEAN BUTTONS --- */
        .btn-grind { 
            background: rgba(255, 255, 255, 0.06); 
            color: white; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.06em;
            padding: 14px 24px; 
            font-size: 12px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            cursor: pointer; 
            backdrop-filter: blur(8px);
        }
        .btn-grind:hover:not(:disabled) { 
            background: #ff4d00; 
            color: black;
            border-color: #ff4d00; 
            box-shadow: 0 8px 20px rgba(255, 77, 0, 0.3);
            transform: translateY(-2px);
        }
        .btn-grind:active:not(:disabled) { transform: translateY(1px); }
        .btn-grind:disabled { background: rgba(255,255,255,0.02); color: #555; border-color: rgba(255,255,255,0.05); cursor: not-allowed; }

        .btn-pro { 
            background: rgba(168, 85, 247, 0.08); 
            color: #d8b4fe; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            padding: 10px 16px; 
            font-size: 10px; 
            border-radius: 12px; 
            border: 1px solid rgba(168, 85, 247, 0.25); 
            transition: all 0.2s ease; 
            cursor: pointer; 
            backdrop-filter: blur(8px);
        }
        .btn-pro:hover { background: #a855f7; color: white; border-color: #a855f7; box-shadow: 0 8px 15px rgba(168, 85, 247, 0.3); transform: translateY(-1px); }

        /* --- LOOT NODES --- */
        .reward-box { 
            width: 90px; height: 80px; 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; z-index: 10; border-radius: 16px; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            backdrop-filter: blur(8px);
        }
        .reward-box.unlocked { border-color: rgba(255, 77, 0, 0.3); background: rgba(255, 77, 0, 0.06); box-shadow: 0 8px 20px rgba(255, 77, 0, 0.1); }
        .reward-box.pro { border-color: rgba(168, 85, 247, 0.15); height: 90px; width: 100px; }
        .reward-box.pro.unlocked { background: rgba(168, 85, 247, 0.06); border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.15); }

        .tag-free { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.08); color: white; font-size: 7px; font-weight: 700; padding: 3px 8px; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); text-transform: uppercase; border-radius: 6px; z-index: 30; backdrop-filter: blur(5px); }
        .tag-pro { background: linear-gradient(135deg, #7c3aed, #9333ea); color: white; font-size: 8px; font-weight: 700; padding: 3px 10px; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); text-transform: uppercase; border-radius: 6px; box-shadow: 0 4px 10px rgba(124,58,237,0.3); z-index: 30; }
        
        .week-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; transition: all 0.2s; backdrop-filter: blur(5px); }
        .week-btn.active { background: rgba(255, 77, 0, 0.12); color: #ff4d00; border-color: #ff4d00; box-shadow: 0 4px 12px rgba(255, 77, 0, 0.15); }
        
        /* --- UTILITIES --- */
        .grind-gradient { background: linear-gradient(135deg, #ff4d00, #ff8800); }
        .text-gradient { background: linear-gradient(135deg, #ff4d00, #ff8800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
        .level-node { min-width: 130px; position: relative; }
        
        /* --- TOASTS --- */
        #toast-container { position: fixed; top: 15px; right: 15px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { pointer-events: auto; background: rgba(10,10,10,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); color: white; padding: 14px 20px; border-radius: 14px; font-size: 13px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; align-items: center; gap: 12px; }
        .toast.show { transform: translateX(0); }
        
        /* --- ANIMATIONS --- */
        /* FIX: pointer-events: none is extremely important here to not block buttons! */
        .completed-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s ease; border-radius: inherit; pointer-events: none; }
        .card.is-completed .completed-overlay { opacity: 1; pointer-events: auto; }
        
        .pending-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s ease; border-radius: inherit; pointer-events: none; }
        .card.is-pending .pending-overlay { opacity: 1; pointer-events: auto; }

        /* Performance Fix: Removed filter:blur() for smooth mobile animations */
        @keyframes fast-reveal { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-reveal { animation: fast-reveal 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; will-change: transform, opacity; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .animate-float { animation: float 5s ease-in-out infinite; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-3px); } 100% { transform: scale(1) translateY(0); } }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 rgba(255,77,0,0); } 50% { transform: scale(1.03); opacity: 0.95; box-shadow: 0 5px 20px rgba(255,77,0,0.2); } }
        .pulse-soft { animation: pulse-soft 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        h1, h2, h3, h4 { letter-spacing: -0.02em; }
        p { letter-spacing: 0.01em; }
        
        #modal-container > div { background: rgba(15,15,15,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05); border-radius: 24px; }
    </style>
</head>
<body class="flex flex-col relative select-none">

    <!-- Cinematic Video Background -->
    <div class="video-bg-container">
        <video id="app-bg-video" class="video-bg" src="https://cdn.coverr.co/videos/coverr-night-traffic-in-the-city-2715/1080p.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
        <div class="video-overlay"></div>
    </div>

    <div id="toast-container"></div>
    <div id="recaptcha-container"></div>
    
    <div id="app" class="flex-1 flex flex-col w-full z-10 relative pb-10">
        <div class="flex-1 flex items-center justify-center min-h-[60vh]"><div class="w-10 h-10 border-t-2 border-l-2 border-[#ff4d00] rounded-full animate-spin"></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, arrayUnion, onSnapshot, collection, addDoc, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtwsvmYSONjFufhbJ5I8G_RAMffnh7re0",
            authDomain: "theplot-app.firebaseapp.com",
            projectId: "theplot-app",
            storageBucket: "theplot-app.firebasestorage.app",
            messagingSenderId: "550703275210",
            appId: "1:550703275210:web:81bc0e5a373f87a3c92833"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        let state = {
            user: null, profile: null, prevXp: null, prevLvl: null,
            bundlePrice: '19.00', view: 'loading', prevView: 'dashboard',
            currentWeekTab: 1,
            authStep: 'phone', tempPhone: '', tempUploadData: null,
            weeklyData: { 1: { title: "Loading...", startOffset: 0, missions: [] } },
            rewardData: [], habitData: [], pendingMissions: [], activities: [],
            seasonConfig: null,
            dashboardNeedsScroll: true
        };

        const RANKS = ["Rookie", "Grinder", "Hustler", "Athlete", "Machine", "Legend"];

        let holdTimer = null; let holdProgress = 0; let isRedeeming = false;
        window.currentVerify = null;
        window.countdownInterval = null;

        document.addEventListener('touchstart', function() {
            const video = document.getElementById('app-bg-video');
            if (video && video.paused) { video.play().catch(e => console.log("Auto-play prevented", e)); }
        }, { once: true });

        const getRelativeTime = (timestamp) => {
            if(!timestamp) return "Gerade eben";
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "Gerade eben";
            if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
            if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;
            return `vor ${Math.floor(diff/86400)} Tagen`;
        };

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div'); toast.className = `toast ${type}`;
            const icon = type === 'error' ? `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` : `<svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            toast.innerHTML = `${icon} <div><div class="font-bold text-[9px] uppercase tracking-widest text-gray-400 mb-0.5">System</div><div class="font-medium text-xs">${msg}</div></div>`;
            container.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        };

        window.logActivity = async (type, text) => {
            try {
                if(!state.profile || !state.profile.alias) return;
                const newAct = {
                    alias: state.profile.alias,
                    isPro: !!state.profile.hasPremium, 
                    type: type, 
                    text: text,
                    timestamp: Date.now()
                };
                await addDoc(collection(db, 'plot_activities'), newAct).catch(err => console.error("Activity Error:", err));
            } catch(e) {}
        };

        const getActiveWeek = () => {
            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            if(now < start) return 1;

            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) { firstSunday.setDate(firstSunday.getDate() + 1); }
            firstSunday.setHours(23, 59, 59, 999);

            if (now.getTime() <= firstSunday.getTime()) return 1;
            const diffDays = Math.floor((now.getTime() - firstSunday.getTime()) / (1000 * 60 * 60 * 24)); 
            let week = 2 + Math.floor(diffDays / 7);
            return Math.max(1, Math.min(week, 4));
        };

        const getSeasonStatus = () => {
            if (!state.seasonConfig) return { status: 'loading' };
            if (state.seasonConfig.active === false || state.seasonConfig.active === 'false') return { status: 'offline' };
            
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            const end = new Date(state.seasonConfig.end);
            end.setHours(23, 59, 59, 999);
            
            if (now < start) return { status: 'upcoming', date: start };
            if (now > end) return { status: 'ended', date: end };
            return { status: 'active' };
        };

        window.updateCountdown = () => {
            const el = document.getElementById('season-countdown');
            if(!el || !state.seasonConfig) return;
            const start = new Date(state.seasonConfig.start).getTime();
            const distance = start - new Date().getTime();
            
            if (distance < 0) {
                el.innerHTML = "LAUNCHING...";
                if(window.countdownInterval) clearInterval(window.countdownInterval);
                setTimeout(() => render(), 1500); 
                return;
            }
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            el.innerHTML = `${d}D ${h.toString().padStart(2, '0')}H ${m.toString().padStart(2, '0')}M ${s.toString().padStart(2, '0')}S`;
        };

        const setupSeasonData = () => {
            onSnapshot(doc(db, 'system', 'grind_season'), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.weeklyData = data.weeklyData || state.weeklyData;
                    state.rewardData = data.rewardData || [];
                    state.habitData = data.habitData || [];
                    state.seasonConfig = data.seasonConfig || { number: 1, active: true, start: '', end: '' };
                    state.currentWeekTab = getActiveWeek();
                }
                if(state.view === 'dashboard' || state.view === 'paywall') render();
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                state.user = user;
                onSnapshot(doc(db, 'plot_users', user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        state.profile = docSnap.data();
                        
                        if (!state.profile.crewCode) {
                            const generatedCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                            state.profile.crewCode = generatedCode;
                            setDoc(doc(db, 'plot_users', user.uid), { crewCode: generatedCode }, { merge: true });
                        }

                        if (['loading', 'auth', 'onboarding'].includes(state.view)) {
                            state.view = 'dashboard';
                            state.dashboardNeedsScroll = true;
                            
                            const urlParams = new URLSearchParams(window.location.search);
                            const crewCode = urlParams.get('crew');
                            if (crewCode) {
                                window.history.replaceState({}, document.title, window.location.pathname);
                                setTimeout(() => window.resolveInvite(crewCode), 800);
                            }
                        }
                        render();
                    } else { state.view = 'onboarding'; render(); }
                });
                
                onSnapshot(collection(db, 'plot_pending_proofs'), (snap) => {
                    if (snap && snap.docs) {
                        state.pendingMissions = snap.docs.map(d => d.data()).filter(data => data.uid === state.user.uid).map(data => data.mid);
                        if(state.view === 'dashboard') render();
                    }
                });

                const activitiesQuery = query(collection(db, 'plot_activities'), orderBy('timestamp', 'desc'), limit(30));
                onSnapshot(activitiesQuery, (snap) => {
                    if(snap && snap.docs) {
                        state.activities = snap.docs.map(d => d.data());
                        if(state.view === 'dashboard') render();
                    }
                }, () => {});

                setupSeasonData();
                onSnapshot(doc(db, 'system', 'pricing'), (docSnap) => {
                    if (docSnap.exists()) state.bundlePrice = docSnap.data().bundlePrice; 
                    if (state.view === 'paywall') render(); 
                });
            } else { state.user = null; state.profile = null; state.view = 'auth'; state.authStep = 'phone'; render(); }
        });

        window.closeModal = () => {
            if(window.stopRedeemHold) window.stopRedeemHold(); 
            const forceClose = () => {
                const container = document.getElementById('modal-container');
                if(container) { container.classList.remove('opacity-100'); container.classList.add('opacity-0', 'pointer-events-none'); setTimeout(() => container.innerHTML = '', 300); }
            };
            if(window.html5QrCode) {
                try {
                    if(window.html5QrCode.getState() === 2) { 
                        let closed = false; const finish = () => { if(closed) return; closed = true; window.html5QrCode = null; forceClose(); };
                        window.html5QrCode.stop().then(() => { try { window.html5QrCode.clear(); } catch(e){} finish(); }).catch(finish);
                        setTimeout(finish, 600); return; 
                    } else { window.html5QrCode.clear(); window.html5QrCode = null; }
                } catch(e) { window.html5QrCode = null; }
            }
            forceClose();
        };

        window.openModal = (contentHtml) => {
            let container = document.getElementById('modal-container');
            if(!container) { container = document.createElement('div'); container.id = 'modal-container'; container.className = 'fixed inset-0 z-[100] bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-400 overflow-y-auto'; document.body.appendChild(container); }
            container.innerHTML = `<div class="card p-6 md:p-8 w-full max-w-md shadow-[0_30px_60px_rgba(0,0,0,0.8)] transform scale-95 transition-transform duration-400 relative my-auto"><button type="button" onclick="window.closeModal()" class="absolute top-5 right-5 text-gray-500 hover:text-white z-50 transition bg-black/40 p-2 rounded-full backdrop-blur-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>${contentHtml}</div>`;
            setTimeout(() => { container.classList.remove('opacity-0', 'pointer-events-none'); container.classList.add('opacity-100'); container.firstElementChild.classList.remove('scale-95'); container.firstElementChild.classList.add('scale-100'); }, 10);
        };

        window.openInviteModal = () => {
            if(!state.profile) return;
            const link = `${window.location.origin}/?crew=${state.profile.crewCode || ''}`;
            const currentFriendsCount = (state.profile.friends || []).length;
            const nextXpBounty = (currentFriendsCount + 1) * 100;
            
            let innerHtml = `
                <p class="text-[#ff4d00] text-[9px] font-bold uppercase tracking-widest mb-1">Network</p>
                <h3 class="text-2xl font-black italic uppercase tracking-tighter mb-6">Crew Erweitern</h3>
                
                <div class="bg-[rgba(255,255,255,0.03)] p-4 rounded-xl mb-5 border border-[rgba(255,255,255,0.05)] relative overflow-hidden">
                    <div class="relative z-10 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full border border-[#ff4d00]/30 flex items-center justify-center bg-[#ff4d00]/10 flex-shrink-0 shadow-[0_0_10px_rgba(255,77,0,0.15)]">
                            <svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div>
                            <p class="text-white font-bold text-xs tracking-wide">Bounty Active</p>
                            <p class="text-gray-400 text-[11px] mt-1 leading-relaxed">Jeder Grinder, der joint, bringt dir <span class="text-[#ff4d00] font-bold">+${nextXpBounty} XP</span>.</p>
                        </div>
                    </div>
                </div>
                
                <div class="mb-5">
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-2 ml-2">Option 1: Link teilen</p>
                    <div class="flex gap-2">

                                <div class="flex justify-between items-end border-b border-white/10 pb-3">
                                    <div>
                                        <p class="text-[#ff4d00] text-[9px] font-black uppercase tracking-widest mb-1 drop-shadow-sm">Operations</p>
                                        <h3 class="text-xl md:text-2xl font-black uppercase italic tracking-tighter text-white">${(state.weeklyData[currentMonthWeek] || {title: 'Active Week'}).title}</h3>
                                    </div>
                                    <span class="text-[8px] font-black bg-[#ff4d00]/20 border border-[#ff4d00]/30 text-[#ff4d00] px-2.5 py-1 rounded-md italic shadow-[0_0_10px_rgba(255,77,0,0.2)] backdrop-blur-sm">LIVE</span>
                                </div>
                                <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
                `;

                [1, 2, 3, 4].forEach(w => {
                    const weekNum = w; 
                    const isCurrent = weekNum === currentMonthWeek;
                    const isMissed = weekNum < currentMonthWeek;
                    const isFuture = weekNum > currentMonthWeek;
                    
                    let extraClass = isCurrent ? 'active' : 'opacity-50 border-dashed hover:opacity-100 hover:bg-white/5';
                    let badge = isMissed ? '<span class="text-red-400 ml-1.5 opacity-80">MISSED</span>' : (isFuture ? '<span class="text-gray-500 ml-1.5 opacity-80">LOCKED</span>' : '');

                    html += `<button type="button" class="week-btn px-3 py-1.5 text-[9px] font-bold uppercase transition rounded-lg ${extraClass}">W0${weekNum} ${badge}</button>`;
                });

                html += `</div></div><div class="space-y-4">`;

                const currentMissions = state.weeklyData[currentMonthWeek]?.missions || [];
                if (currentMissions.length === 0) html += `<div class="card text-center p-6 text-gray-400 italic text-xs">Der Director bereitet die Operations vor. Stay focused.</div>`;

                currentMissions.forEach(m => {
                    const isCompleted = safeCompleted.includes(m.id);
                    const isPending = state.pendingMissions.includes(m.id) && !isCompleted;
                    
                    let badgeText = '';
                    if(m.type === 'qr') badgeText = '📍 QR Scan';
                    else if(m.type === 'upload') badgeText = '📷 Upload';
                    else if(m.type === 'instant') badgeText = '⚡ Claim';
                    else badgeText = '⚡ Action';

                    const safeName = m.name.replace(/'/g, "\\'");
                    const safeQrSolution = m.qr_solution ? m.qr_solution.replace(/'/g, "\\'") : '';
                    
                    const btnAction = m.type === 'instant' 
                        ? `window.claimInstantMission('${m.id}', ${m.xp}, '${safeName}')` 
                        : `window.openVerifyModal('${m.id}', ${m.xp}, '${m.type}', '${safeName}', '${safeQrSolution}')`;
                    
                    let btnText = m.type === 'instant' ? 'Claim XP' : 'Verify';
                    if (isCompleted) btnText = 'Verified';
                    else if (isPending) btnText = 'Wird überprüft...';

                    let cardClasses = 'card p-5 md:p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden group ';
                    if (isCompleted) cardClasses += 'is-completed border-[#ff4d00]/30 shadow-none opacity-80';
                    else if (isPending) cardClasses += 'is-pending border-yellow-500/30';

                    html += `
                        <div class="${cardClasses}">
                            <div class="absolute inset-y-0 left-0 w-1 ${isPending ? 'bg-yellow-500' : 'bg-[#ff4d00]'} opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                            <div class="completed-overlay"><span class="text-[#ff4d00] font-black italic uppercase tracking-widest flex items-center gap-2 text-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> Verified</span></div>
                            <div class="pending-overlay"><span class="text-yellow-400 font-black italic uppercase tracking-widest flex items-center gap-2 text-sm"><svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Check</span></div>
                            
                            <div class="pr-3 relative z-0 flex-1 w-full">
                                <h4 class="font-black italic uppercase text-lg md:text-xl tracking-tighter text-white group-hover:text-[#ff4d00] transition-colors truncate">${m.name}</h4>
                                <p class="text-gray-400 text-[11px] mt-1.5 leading-relaxed font-medium line-clamp-2">${m.desc}</p>
                                ${!isCompleted ? `<span class="inline-block mt-3 bg-white/10 border border-white/20 px-2.5 py-1 rounded-md text-[8px] font-bold uppercase tracking-widest text-white backdrop-blur-sm">${badgeText}</span>` : ''}
                            </div>
                            <div class="text-left md:text-right flex-shrink-0 relative z-0 flex flex-col items-start md:items-end w-full md:w-auto mt-3 md:mt-0">
                                <span class="block text-[#ff4d00] font-black text-2xl md:text-3xl italic tracking-tighter mb-2 drop-shadow-sm">+${m.xp}</span>
                                <button type="button" id="btn-${m.id}" onclick="${btnAction}" class="btn-grind w-full md:w-auto" ${(isCompleted || isPending) ? 'disabled' : ''}>${btnText}</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                            </div>
                        </section>
                        
                        <!-- HABITS -->
                        <section class="max-w-3xl mx-auto mb-12 animate-reveal" style="animation-delay: 0.4s;">
                            <div class="flex flex-col gap-4 mb-5 px-1">
                                <div class="flex justify-between items-end border-b border-white/10 pb-3">
                                    <div>
                                        <p class="text-[#ff4d00] text-[9px] font-black uppercase tracking-widest mb-1 drop-shadow-sm">Endless Grind</p>
                                        <h3 class="text-xl md:text-2xl font-black uppercase italic tracking-tighter text-white">Daily Habits</h3>
                                    </div>
                                    <span class="text-[8px] font-black bg-white/10 border border-white/10 text-gray-300 px-2.5 py-1 rounded-md italic shadow-sm backdrop-blur-sm">REPEATABLE</span>
                                </div>
                            </div>
                            <div class="space-y-4">
                `;

                if ((state.habitData || []).length === 0) {
                    html += `<div class="card text-center p-6 text-gray-500 italic text-xs">Derzeit keine Daily Habits aktiv.</div>`;
                }

                (state.habitData || []).forEach(m => {
                    const isPending = state.pendingMissions.includes(m.id);
                    const todayStr = new Date().toISOString().split('T')[0];
                    const habitStreak = p.streaks?.[m.id] || { streak: 0, lastDate: '' };
                    const isDoneToday = habitStreak.lastDate === todayStr;
                    
                    let activeStreak = habitStreak.streak;
                    if (habitStreak.lastDate) {
                        const diffDays = Math.round(Math.abs((new Date(todayStr) - new Date(habitStreak.lastDate)) / (1000 * 60 * 60 * 24)));
                        if (diffDays > 1) activeStreak = 0;
                    }

                    const nextStreak = isDoneToday ? activeStreak : activeStreak + 1;
                    const currentBonus = (nextStreak > 1 ? (nextStreak - 1) * (parseInt(m.streakBonus) || 0) : 0);
                    const totalXpDisplay = isDoneToday ? m.xp : m.xp + currentBonus;

                    let habDaysLeftText = "LIVE";
                    if (m.endDate) {
                        const end = new Date(m.endDate); end.setHours(23, 59, 59, 999);
                        const diff = end.getTime() - new Date().getTime();
                        if (diff > 0) {
                            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                            habDaysLeftText = d > 0 ? `NOCH ${d} TAG${d === 1 ? '' : 'E'}` : "LETZTER TAG";
                        } else { habDaysLeftText = "ABGELAUFEN"; }
                    }
                    
                    const isExpired = habDaysLeftText === "ABGELAUFEN";
                    let cardClasses = 'card p-5 md:p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden group ';
                    if (isDoneToday) cardClasses += 'is-completed border-[#ff4d00]/30 shadow-none opacity-80';
                    else if (isPending) cardClasses += 'is-pending border-yellow-500/30';
                    else if (isExpired) cardClasses += 'opacity-40 cursor-not-allowed';

                    let badgeText = m.type === 'qr' ? '📍 QR Scan' : (m.type === 'upload' ? '📷 Upload' : '⚡ Action');
                    const safeName = m.name.replace(/'/g, "\\'");
                    const safeQrSolution = m.qr_solution ? m.qr_solution.replace(/'/g, "\\'") : '';
                    
                    let btnAction = '';
                    if (!isExpired) { btnAction = m.type === 'instant' ? `window.claimInstantMission('${m.id}', ${m.xp}, '${safeName}')` : `window.openVerifyModal('${m.id}', ${m.xp}, '${m.type}', '${safeName}', '${safeQrSolution}')`; }
                    
                    let btnText = isDoneToday ? 'DONE FOR TODAY' : (isPending ? 'Wird überprüft...' : 'Verify Habit');
                    if (isExpired) btnText = 'LOCKED';

                    html += `
                        <div class="${cardClasses}">
                            <div class="absolute inset-y-0 left-0 w-1.5 ${isPending ? 'bg-yellow-500' : (isDoneToday ? 'bg-[#ff4d00]' : 'bg-transparent group-hover:bg-[#ff4d00]')} transition-colors duration-300"></div>
                            ${isDoneToday ? `<div class="completed-overlay"><span class="text-[#ff4d00] font-black italic uppercase tracking-widest flex items-center gap-2 text-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> DONE TODAY</span></div>` : ''}
                            ${isPending ? `<div class="pending-overlay"><span class="text-yellow-400 font-black italic uppercase tracking-widest flex items-center gap-2 text-sm"><svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Check</span></div>` : ''}
                            
                            <div class="pr-3 relative z-0 flex-1 w-full">
                                <div class="flex justify-between items-start mb-1.5">
                                    <h4 class="font-black italic uppercase text-lg md:text-xl tracking-tighter text-white break-words max-w-[75%] group-hover:text-[#ff4d00] transition-colors">${m.name}</h4>
                                    <span class="text-[8px] font-bold text-gray-400 tracking-widest uppercase border border-white/10 bg-white/5 backdrop-blur-sm px-2 py-0.5 rounded shadow-sm">${habDaysLeftText}</span>
                                </div>
                                <p class="text-gray-400 text-[11px] mt-1.5 leading-relaxed font-medium line-clamp-2">${m.desc}</p>
                                <div class="flex flex-wrap items-center gap-2.5 mt-3">
                                    <span class="bg-white/10 border border-white/20 text-white px-2.5 py-1 text-[8px] font-black uppercase tracking-widest rounded-md backdrop-blur-sm shadow-sm">${badgeText}</span>
                                    ${m.streakBonus > 0 ? `<span class="bg-[#ff4d00]/15 border border-[#ff4d00]/20 text-[#ff4d00] px-2.5 py-1 text-[8px] font-black uppercase tracking-widest rounded-md shadow-[0_0_10px_rgba(255,77,0,0.15)] backdrop-blur-sm">🔥 Streak: ${activeStreak} (+${m.streakBonus})</span>` : `<span class="bg-white/5 border border-white/5 text-gray-400 px-2.5 py-1 text-[8px] font-black uppercase tracking-widest rounded-md backdrop-blur-sm">🔥 Streak: ${activeStreak}</span>`}
                                </div>
                            </div>
                            <div class="text-left md:text-right flex-shrink-0 relative z-0 flex flex-col items-start md:items-end w-full md:w-auto mt-3 md:mt-0">
                                <span class="block text-[#ff4d00] font-black text-2xl md:text-3xl italic tracking-tighter mb-2 drop-shadow-sm">+${totalXpDisplay}</span>
                                <button type="button" onclick="${btnAction}" class="btn-grind w-full md:w-auto" ${(isDoneToday || isPending || isExpired) ? 'disabled' : ''}>${btnText}</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                            </div>
                        </section>

                        <!-- FEED -->
                        <section class="max-w-3xl mx-auto mb-10 animate-reveal" style="animation-delay: 0.5s;">
                            <div class="flex flex-col gap-4 mb-5 px-1">
                                <div class="flex justify-between items-end border-b border-white/10 pb-3">
                                    <div>
                                        <p class="text-[#ff4d00] text-[9px] font-black uppercase tracking-widest mb-1 drop-shadow-sm">The Network</p>
                                        <h3 class="text-xl md:text-2xl font-black uppercase italic tracking-tighter text-white">Crew Activity</h3>
                                    </div>
                                    <span class="text-[8px] font-black bg-white/10 border border-white/10 text-gray-300 px-2.5 py-1 rounded-md italic backdrop-blur-sm">LIVE FEED</span>
                                </div>
                            </div>

                `;

                const myFriendsCount = (p.friends || []).length;
                const nextBounty = (myFriendsCount + 1) * 100;

                html += `
                            <div class="card p-6 rounded-2xl mb-6 border border-[#ff4d00]/20 shadow-[0_10px_30px_rgba(255,77,0,0.1)] relative overflow-hidden group hover:border-[#ff4d00]/40 transition-colors">
                                <div class="absolute inset-0 bg-gradient-to-r from-[#ff4d00]/10 to-transparent"></div>
                                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-5">
                                    <div class="text-center md:text-left flex-1">
                                        <p class="text-[#ff4d00] font-black italic uppercase tracking-widest text-xs mb-2 flex items-center justify-center md:justify-start gap-1.5">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                            Bounty Active
                                        </p>
                                        <p class="text-gray-300 text-[11px] leading-relaxed font-medium">Erweitere dein Network. Jeder neue Grinder bringt dir XP. Nächster Invite: <span class="text-white font-black bg-white/15 px-2 py-0.5 rounded border border-white/20 shadow-sm">+${nextBounty} XP</span></p>
                                    </div>
                                    <button type="button" onclick="window.openInviteModal()" class="w-full md:w-auto btn-grind px-6 py-3 flex items-center justify-center gap-2 whitespace-nowrap flex-shrink-0 shadow-sm">
                                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                        <span class="font-black italic uppercase text-[10px] tracking-widest">Crew Erweitern</span>
                                    </button>
                                </div>
                            </div>
                `;

                const friendsList = p.friends || [];
                const feedUsers = [...friendsList];
                const feedUsersLower = feedUsers.map(u => (u || '').toLowerCase());

                const feedActivities = (state.activities || [])
                    .filter(act => act.alias && feedUsersLower.includes(act.alias.toLowerCase()))
                    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
                    .slice(0, 10); 

                if (feedActivities.length === 0) {
                    if (friendsList.length === 0) {
                        html += `<div class="card text-center p-8 text-gray-400 italic text-xs">Deine Crew ist noch leer. <br><span class="text-[#ff4d00] font-medium mt-1 block">Lade Freunde ein und kassiere deinen XP Boost!</span></div>`;
                    } else {
                        html += `<div class="card text-center p-8 text-gray-400 italic text-xs">Noch keine Aktivität in deiner Crew. Time to grind!</div>`;
                    }
                } else {
                    html += `<div class="space-y-4">`;
                    
                    feedActivities.forEach(act => {
                        const isProUser = act.isPro === true;
                        let iconSvg = 'M5 13l4 4L19 7'; 
                        let colorClass = isProUser ? 'text-[#a855f7]' : 'text-[#ff4d00]';
                        let borderClass = isProUser ? 'border-[#a855f7]/40' : 'border-[#ff4d00]/40';
                        let bgClass = isProUser ? 'bg-[#a855f7]/10' : 'bg-[#ff4d00]/10';
                        let shadowClass = '';

                        if (act.type === 'LEVEL_UP') {
                            iconSvg = 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6';
                            borderClass = isProUser ? 'border-[#a855f7]' : 'border-[#ff4d00]';
                            shadowClass = isProUser ? 'shadow-[0_0_15px_rgba(168,85,247,0.4)]' : 'shadow-[0_0_15px_rgba(255,77,0,0.4)]';
                        } else if (act.type === 'REDEEM') {
                            iconSvg = 'M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7';
                        } else if (act.type === 'PRO') {
                            iconSvg = 'M13 10V3L4 14h7v7l9-11h-7z';
                            colorClass = 'text-white'; bgClass = 'bg-[#a855f7]'; borderClass = 'border-[#a855f7]';
                            shadowClass = 'shadow-[0_0_20px_rgba(168,85,247,0.6)]';
                        }

                        const time = getRelativeTime(act.timestamp);
                        const displayName = act.alias;
                        const nameColorClass = isProUser ? 'text-[#d8b4fe]' : 'text-[#ff4d00]';
                        const proBadge = isProUser ? `<span class="ml-2 align-middle bg-[#a855f7]/20 text-[#d8b4fe] border border-[#a855f7]/40 text-[8px] px-1.5 py-0.5 rounded-sm font-black shadow-[0_0_10px_rgba(168,85,247,0.2)]">PRO</span>` : '';
                        const dynamicText = act.text.replace(/text-\[#[a-fA-F0-9]+\]/g, isProUser ? 'text-[#d8b4fe]' : 'text-[#ff4d00]');

                        html += `
                            <div class="flex gap-4 relative z-10 items-center group">
                                <div class="w-10 h-10 rounded-full ${bgClass} backdrop-blur-md border ${borderClass} flex items-center justify-center flex-shrink-0 ${shadowClass} transition-transform group-hover:scale-110">
                                    <svg class="w-4 h-4 ${colorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconSvg}"></path></svg>
                                </div>
                                <div class="card p-4 flex-1 shadow-sm border-white/5 group-hover:border-white/20">
                                    <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-1.5">${time}</p>
                                    <p class="text-xs font-medium text-gray-300 leading-relaxed"><span class="${nameColorClass} italic uppercase font-black tracking-wide">${displayName}</span>${proBadge} <span class="text-gray-400 ml-1">${dynamicText}</span></p>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `
                        </section>
                    </main>
                    ${getFooterHTML()}
                `;

                appDiv.innerHTML = html;

                setTimeout(() => {
                    const currentNode = document.getElementById(`level-node-${safeLvl}`);
                    const passViewport = document.getElementById('pass-viewport');
                    
                    if (passViewport && currentNode && (state.prevLvl === null || state.dashboardNeedsScroll)) {
                        const scrollLeft = currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2);
                        passViewport.scrollTo({ left: scrollLeft, behavior: 'smooth' });
                        state.dashboardNeedsScroll = false;
                    }

                    const topCircle = document.getElementById('top-xp-circle');
                    const targetOffset = 653 - (653 * targetXpProgress / 100);
                    
                    const trackLine = document.getElementById('track-line');
                    if (trackLine) trackLine.style.width = `calc(150px * ${targetTrackProgress})`;

                    if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                        if (topCircle) {
                            topCircle.style.transition = 'stroke-dashoffset 800ms ease-out';
                            topCircle.style.strokeDashoffset = '0';
                            setTimeout(() => {
                                topCircle.style.transition = 'none';
                                topCircle.style.strokeDashoffset = '653';
                                void topCircle.offsetWidth;
                                topCircle.style.transition = 'stroke-dashoffset 800ms ease-out';
                                topCircle.style.strokeDashoffset = targetOffset.toString();
                            }, 800);
                        }
                        if (passViewport && currentNode) {
                            const scrollLeft = currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2);
                            passViewport.scrollTo({ left: scrollLeft, behavior: 'smooth' });
                        }
                    } else if (topCircle) {
                        topCircle.style.transition = 'stroke-dashoffset 800ms ease-out';
                        topCircle.style.strokeDashoffset = targetOffset.toString();
                    }

                    if (state.prevXp !== null && state.prevXp < safeXp) {
                        window.scrollTo({ top: 0, behavior: 'smooth' }); animateValue('xp-counter-num', state.prevXp, safeXp, 1000);
                        if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                            const lvlText = document.getElementById('main-lvl-text'); if (lvlText) lvlText.classList.add('animate-pop');
                            const newCircle = document.getElementById(`circle-node-${safeLvl}`); if (newCircle) newCircle.classList.add('animate-pop');
                        }
                    }
                    state.prevXp = safeXp; state.prevLvl = safeLvl;
                }, 50);
                return;
            }

            // --- 404 FALLBACK ---
            appDiv.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center p-6 min-h-[80vh] relative z-20 animate-reveal">
                    <h1 class="text-[6rem] md:text-[10rem] font-black italic text-white tracking-tighter mb-2 select-none opacity-20 drop-shadow-lg">404</h1>
                    <p class="text-[#ff4d00] font-black uppercase tracking-[0.4em] mb-4 text-xs">Signal Lost</p>
                    <p class="text-gray-400 font-medium max-w-sm text-xs leading-relaxed mb-10">Die angeforderte Position existiert nicht im Network.</p>
                    <button onclick="window.setView('dashboard')" class="btn-grind py-3 px-8">Return to Base</button>
                </div>
            `;
        }
    </script>
</body>
</html>
