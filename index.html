    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, arrayUnion, onSnapshot, collection, addDoc, query, where, getDocs, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtwsvmYSONjFufhbJ5I8G_RAMffnh7re0",
            authDomain: "theplot-app.firebaseapp.com",
            projectId: "theplot-app",
            storageBucket: "theplot-app.firebasestorage.app",
            messagingSenderId: "550703275210",
            appId: "1:550703275210:web:81bc0e5a373f87a3c92833"
        };
        
        const appInit = initializeApp(firebaseConfig); 
        const auth = getAuth(appInit); 
        const db = getFirestore(appInit);

        let state = {
            user: null, profile: null, prevXp: null, prevLvl: null, bundlePrice: '19.00', view: 'loading', prevView: 'dashboard',
            currentWeekTab: 1, authStep: 'phone', tempPhone: '', tempUploadData: null,
            weeklyData: { 1: { title: "Loading...", startOffset: 0, missions: [] } }, rewardData: [], habitData: [], pendingMissions: [], activities: [], activeSpots: [], seasonConfig: null, dashboardNeedsScroll: true
        };

        const defaultSpots = [
            { icon: '☕', name: 'Morning Check-in', subtitle: 'GuMo Café', xp: 200, color: '#3b82f6', colorClass: 'text-[#3b82f6]', bgClass: 'from-[#3b82f6]/10' },
            { icon: '🔥', name: 'Fitness Check-in', subtitle: 'Rocycle', xp: 400, color: '#ffffff', colorClass: 'text-white', bgClass: 'from-white/10' },
            { icon: '🏃', name: 'Event Drop', subtitle: 'PopUp Run', xp: 800, color: '#a855f7', colorClass: 'text-[#a855f7]', bgClass: 'from-[#a855f7]/10' }
        ];

        const RANKS = ["Rookie", "Grinder", "Hustler", "Athlete", "Machine", "Legend"];
        let holdTimer = null, holdProgress = 0, isRedeeming = false;
        window.currentVerify = null; window.countdownInterval = null;

        let renderTimeout = null;
        window.scheduleRender = () => {
            if (renderTimeout) clearTimeout(renderTimeout);
            renderTimeout = setTimeout(() => { requestAnimationFrame(() => { render(); }); }, 50);
        };

        const getRelativeTime = (timestamp) => {
            if(!timestamp) return "Gerade eben";
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "Gerade eben";
            if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
            if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;
            return `vor ${Math.floor(diff/86400)} Tagen`;
        };

        const getYesterdayStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().split('T')[0]; };
        const getWeekYear = (d) => { const date = new Date(d.getTime()); date.setUTCDate(date.getDate() + 4 - (date.getDay()||7)); const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1)); return `${date.getUTCFullYear()}-W${Math.ceil(( ( (date - yearStart) / 86400000) + 1)/7)}`; };
        const getPreviousWeekStr = () => { const d = new Date(); d.setDate(d.getDate() - 7); return getWeekYear(d); };

        window.showLiveNotification = (text, type = 'success', showPing = false) => {
            const notif = document.getElementById('live-notification-badge');
            const box = document.getElementById('live-notification-box');
            const textEl = document.getElementById('live-notification-text');
            const ping = document.getElementById('live-notification-ping');
            if(!notif || !textEl || !box) return;
            
            textEl.innerHTML = text; 
            if (type === 'error') {
                box.className = "bg-black/95 backdrop-blur-md border border-red-500 shadow-[0_10px_40px_rgba(239,68,68,0.3)] rounded-full py-3 px-6 flex items-center justify-center gap-3";
                textEl.className = "text-red-400 text-[11px] font-bold uppercase tracking-widest text-center whitespace-normal break-words leading-snug w-full";
            } else {
                box.className = "bg-black/95 backdrop-blur-md border border-[#ff4d00]/50 shadow-[0_10px_40px_rgba(255,77,0,0.3)] rounded-full py-3 px-6 flex items-center justify-center gap-3";
                textEl.className = "text-white text-[11px] font-bold uppercase tracking-widest text-center whitespace-normal break-words leading-snug w-full";
            }

            if (showPing) ping.classList.remove('hidden'); else ping.classList.add('hidden');
            
            notif.classList.remove('show');
            void notif.offsetWidth; // Force Reflow to ensure animation triggers
            notif.classList.add('show');
            
            if(window.notificationHideTimeout) clearTimeout(window.notificationHideTimeout);
            window.notificationHideTimeout = setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
        };

        window.showToast = (msg, type = 'success') => {
            window.showLiveNotification(msg, type, false);
        };

        window.logActivity = async (type, text, customAlias = null, customIsPro = null) => {
            try {
                if(!state.profile || !state.profile.alias) return;
                const aliasToUse = customAlias || state.profile.alias; const isProToUse = customIsPro !== null ? customIsPro : !!state.profile.hasPremium;
                await addDoc(collection(db, 'plot_activities'), { alias: aliasToUse, isPro: isProToUse, type: type, text: text, timestamp: Date.now() }).catch(err => {});
            } catch(e) {}
        };

        const getActiveWeek = () => {
            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date(); const start = new Date(state.seasonConfig.start);
            if(now < start) return 1;
            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate() + 1);
            firstSunday.setHours(23, 59, 59, 999);
            if (now.getTime() <= firstSunday.getTime()) return 1;
            return Math.max(1, Math.min(2 + Math.floor((now.getTime() - firstSunday.getTime()) / (1000 * 60 * 60 * 24) / 7), 4));
        };

        const getSeasonStatus = () => {
            if (!state.seasonConfig) return { status: 'loading' };
            if (state.seasonConfig.active === false || state.seasonConfig.active === 'false') return { status: 'offline' };
            const now = new Date(); const start = new Date(state.seasonConfig.start); const end = new Date(state.seasonConfig.end); end.setHours(23, 59, 59, 999);
            if (now < start) return { status: 'upcoming', date: start }; if (now > end) return { status: 'ended', date: end }; return { status: 'active' };
        };

        window.updateCountdown = () => {
            const el = document.getElementById('season-countdown'); if(!el || !state.seasonConfig) return;
            const distance = new Date(state.seasonConfig.start).getTime() - new Date().getTime();
            if (distance < 0) { el.innerHTML = "LAUNCHING..."; if(window.countdownInterval) clearInterval(window.countdownInterval); window.scheduleRender(); return; }
            el.innerHTML = `${Math.floor(distance / 86400000)}D ${Math.floor((distance % 86400000) / 3600000).toString().padStart(2, '0')}H ${Math.floor((distance % 3600000) / 60000).toString().padStart(2, '0')}M ${Math.floor((distance % 60000) / 1000).toString().padStart(2, '0')}S`;
        };

        // 100% ZUVERLÄSSIGER XP DROPDOWN TRIGGER (Entkoppelt vom reaktiven App-Rendern)
        window.triggerXpHud = (gainedXp, oldXp, newXp, oldLvl, newLvl) => {
            const hud = document.getElementById('xp-hud');
            const hudLvl = document.getElementById('hud-lvl');

                            if (habitStreak.lastWeek !== currentWeekStr) {
                                const nextStreak = activeStreak + 1;
                                currentBonus = (nextStreak > 1) ? (nextStreak - 1) * (parseInt(m.streakBonus) || 0) : 0;
                            }
                        } else if (isDailyStreak) {
                            const nextStreak = activeStreak + 1;
                            currentBonus = (nextStreak > 1) ? (nextStreak - 1) * (parseInt(m.streakBonus) || 0) : 0;
                        }
                    }
                    
                    const totalXpDisplay = isDoneToday ? m.xp : m.xp + currentBonus;

                    let badgeText = m.type === 'qr' ? '📍 Check-in' : (m.type === 'upload' ? '📷 Photo Upload' : '⚡ Action');
                    let btnText = isDoneToday ? 'VERIFIED' : (isPending ? 'WIRD ÜBERPRÜFT ⏳' : 'Verify Routine');

                    let cardClasses = `mockup p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition interactive border-[#1f1f1f]`;
                    let btnClasses = `btn-grind w-full md:w-auto text-[10px] bg-white text-black hover:bg-[#ff4d00] hover:text-white transition`;

                    if (isDoneToday) {
                        cardClasses = `mockup p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition border-[#1f1f1f] opacity-50 grayscale-[30%]`;
                        btnClasses = `w-full md:w-auto text-[10px] font-black uppercase tracking-widest py-3 px-6 rounded-md bg-[#111] text-gray-500 border border-[#333] cursor-not-allowed`;
                    } else if (isPending) {
                        cardClasses = `mockup p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.15)]`;
                        btnClasses = `w-full md:w-auto text-[10px] font-black uppercase tracking-widest py-3 px-6 rounded-md bg-yellow-500/10 text-yellow-500 border border-yellow-500/30 cursor-not-allowed`;
                    }

                    html += `
                        <div class="${cardClasses}">
                            <div class="pr-6 relative z-10 flex-1 w-full">
                                <div class="flex justify-between items-start mb-1">
                                    <h4 class="font-bold text-lg text-white tracking-tight break-words max-w-[70%]">${m.name}</h4>
                                    <span class="text-[9px] font-bold text-gray-500 tracking-widest uppercase bg-black px-2 py-1 rounded-sm border border-[#111]">${isWeekly ? 'WEEKLY STREAK' : 'DAILY'}</span>
                                </div>
                                <p class="text-gray-400 text-xs mt-1 font-medium leading-relaxed">${m.desc}</p>
                                <div class="flex flex-wrap items-center gap-2 mt-4">
                                    <span class="bg-[#111] border border-white/5 px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest text-gray-400">${badgeText}</span>
                                    ${m.streakBonus > 0 ? `<span class="border border-[#ff4d00]/30 bg-[#ff4d00]/10 text-[#ff4d00] px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest shadow-[0_0_10px_rgba(255,77,0,0.2)]">🔥 Streak: ${activeStreak} (+${m.streakBonus} XP/${isWeekly?'Woche':'Tag'})</span>` : `<span class="border border-white/5 bg-[#111] text-gray-300 px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest">🔥 Streak: ${activeStreak}</span>`}
                                </div>
                            </div>
                            <div class="text-left md:text-right flex-shrink-0 relative z-10 flex flex-col items-start md:items-end w-full md:w-auto mt-4 md:mt-0">
                                <span class="block ${isPending ? 'text-yellow-500' : 'text-white'} font-black text-2xl italic tracking-tighter mb-3">+${totalXpDisplay}</span>
                                <button type="button" onclick="window.claimItemById('${m.id}')" class="${btnClasses}" ${(isDoneToday || isPending) ? 'disabled' : ''}>${btnText}</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></section>`;
                
                html += `
                    <section class="max-w-3xl mx-auto mb-12">
                        <div class="flex flex-col gap-6 mb-8">
                            <div class="flex justify-between items-end border-b border-white/10 pb-4">
                                <div>
                                    <p class="text-[#ff4d00] text-[10px] font-black uppercase tracking-widest mb-1">The Network</p>
                                    <h3 class="text-3xl font-black uppercase italic tracking-tight">Crew Activity</h3>
                                </div>
                                <span class="text-[10px] font-black bg-[#1f1f1f] text-gray-400 border border-white/5 px-3 py-1.5 rounded-sm italic">LIVE FEED</span>
                            </div>
                        </div>
                `;
                
                html += `
                    <div class="mockup p-6 mb-8 border border-[#ff4d00]/20 relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-[#ff4d00]/5 to-transparent"></div>
                        <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                            <div class="text-center md:text-left flex-1">
                                <p class="text-[#ff4d00] font-black italic uppercase tracking-widest text-sm mb-2 flex items-center justify-center md:justify-start gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    Bounty Active
                                </p>
                                <p class="text-gray-400 text-[11px] leading-relaxed">Erweitere dein Network. Nächster Invite: <span class="text-white font-bold bg-white/10 px-2 py-0.5 rounded-sm">+${((p.friends || []).length + 1) * 100} XP</span>.</p>
                            </div>
                            <button type="button" onclick="window.openInviteModal()" class="w-full md:w-auto btn-bounty px-8 py-4 flex items-center justify-center gap-3 whitespace-nowrap flex-shrink-0">
                                <svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                <span class="font-black italic uppercase text-xs tracking-widest">Crew Erweitern</span>
                            </button>
                        </div>
                    </div>
                `;
                
                html += `<div id="live-feed-content">`;
                const friendsList = p.friends || []; 
                const feedUsersLower = friendsList.map(u => (u || '').toLowerCase());
                const feedActivities = (state.activities || []).filter(act => act.alias && feedUsersLower.includes(act.alias.toLowerCase())).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 10);
                
                if (feedActivities.length === 0) {
                    html += `<div class="text-center p-8 text-gray-600 italic text-sm border border-white/5 rounded-xl bg-[#080808]">Deine Crew ist noch leer oder inaktiv. <br><span class="text-[#ff4d00] font-bold" onclick="window.openInviteModal()" style="cursor:pointer">Lade Freunde ein!</span></div>`;
                } else {
                    html += `<div class="space-y-4 relative before:absolute before:inset-y-0 before:left-[19px] before:w-[2px] before:bg-[#1f1f1f]">`;
                    feedActivities.forEach(act => {
                        const isProUser = act.isPro === true;
                        let iconSvg = 'M5 13l4 4L19 7', colorClass = isProUser ? 'text-[#a855f7]' : 'text-[#ff4d00]', borderClass = isProUser ? 'border-[#a855f7]/30' : 'border-[#ff4d00]/30', shadowClass = '';
                        if (act.type === 'LEVEL_UP') { iconSvg = 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6'; borderClass = isProUser ? 'border-[#a855f7]' : 'border-[#ff4d00]'; shadowClass = isProUser ? 'shadow-[0_0_10px_rgba(168,85,247,0.3)]' : 'shadow-[0_0_10px_rgba(255,77,0,0.3)]'; } 
                        else if (act.type === 'REDEEM') { iconSvg = 'M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7'; borderClass = isProUser ? 'border-[#a855f7]' : 'border-[#ff4d00]'; shadowClass = isProUser ? 'shadow-[0_0_10px_rgba(168,85,247,0.3)]' : 'shadow-[0_0_10px_rgba(255,77,0,0.3)]'; } 
                        else if (act.type === 'PRO') { iconSvg = 'M13 10V3L4 14h7v7l9-11h-7z'; colorClass = 'text-[#a855f7]'; borderClass = 'border-[#a855f7]'; shadowClass = 'shadow-[0_0_15px_rgba(168,85,247,0.4)]'; }
                        const nameColorClass = isProUser ? 'text-[#d8b4fe]' : 'text-[#ff4d00]', proBadge = isProUser ? `<span class="ml-2 align-middle bg-[#a855f7]/20 text-[#a855f7] border border-[#a855f7]/30 text-[8px] px-1.5 py-0.5 rounded-sm font-black shadow-[0_0_10px_rgba(168,85,247,0.2)]">PRO</span>` : '', dynamicText = act.text.replace(/text-\[#[a-fA-F0-9]+\]/g, isProUser ? 'text-[#a855f7]' : 'text-[#ff4d00]');
                        html += `<div class="flex gap-4 relative z-10"><div class="w-10 h-10 rounded-full bg-[#0a0a0a] border-2 ${borderClass} flex items-center justify-center flex-shrink-0 ${shadowClass}"><svg class="w-4 h-4 ${colorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconSvg}"></path></svg></div><div class="bg-[#080808] border border-[#111] p-4 rounded-xl flex-1 shadow-sm"><p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">${getRelativeTime(act.timestamp)}</p><p class="text-sm font-medium text-gray-300"><span class="${nameColorClass} italic uppercase font-black">${act.alias}</span>${proBadge} <span class="text-gray-400 text-xs">${dynamicText}</span></p></div></div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;

                html += `</section></main>${getFooterHTML()}`;
                
                appDiv.innerHTML = html;

                if (syncViewport && !state.dashboardNeedsScroll) {
                    syncViewport.scrollLeft = savedScrollPosition;
                }

                if (window.xpAnimTimeout) clearTimeout(window.xpAnimTimeout);
                window.xpAnimTimeout = setTimeout(() => {
                    const passViewport = document.getElementById('pass-viewport');
                    const currentNode = document.getElementById(`level-node-${safeLvl}`);
                    
                    if (passViewport && state.dashboardNeedsScroll && currentNode) { 
                        passViewport.scrollTo({ left: currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2), behavior: 'smooth' }); 
                        state.dashboardNeedsScroll = false; 
                    }
                    
                    const topBar = document.getElementById('top-xp-bar');
                    const trackLine = document.getElementById('track-line');
                    
                    if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                        if (topBar) { 
                            topBar.style.transition = `width 1250ms ease-in`; 
                            topBar.style.width = '100%'; 
                            setTimeout(() => { 
                                topBar.style.transition = 'none'; 
                                topBar.style.width = '0%'; 
                                void topBar.offsetWidth; 
                                topBar.style.transition = `width 1250ms ease-out`; 
                                topBar.style.width = `${targetXpProgress}%`; 
                            }, 1250); 
                        }
                        if (trackLine) {
                            trackLine.style.width = `calc(max(1.5rem, calc((100vw - 72rem) / 2 + 1.5rem)) + 70px + (140px * ${targetTrackProgress}))`;
                        }
                        if (passViewport && currentNode) {
                            passViewport.scrollTo({ left: currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2), behavior: 'smooth' });
                        }
                    } else {
                        if (topBar) { 
                            topBar.style.transition = `width 2500ms ease-out`; 
                            topBar.style.width = `${targetXpProgress}%`; 
                        }
                        if (trackLine) {
                            trackLine.style.width = `calc(max(1.5rem, calc((100vw - 72rem) / 2 + 1.5rem)) + 70px + (140px * ${targetTrackProgress}))`;
                        }
                    }
                    
                    // Wir animieren die Dashboard-Statistiken weiterhin hierüber
                    if (state.prevXp !== null && state.prevXp < safeXp) {
                        animateValue('xp-counter-num', state.prevXp, safeXp, 2500);
                        
                        if (state.prevLvl !== null && safeLvl > state.prevLvl) { 
                            const lvlText = document.getElementById('main-lvl-text'); 
                            if (lvlText) lvlText.classList.add('animate-pop'); 
                            const newCircle = document.getElementById(`circle-node-${safeLvl}`); 
                            if (newCircle) newCircle.classList.add('animate-pop'); 
                        }
                    }
                    state.prevXp = safeXp; 
                    state.prevLvl = safeLvl;
                }, 100); 
                return;
            }
        }
    </script>
    
    <div id="install-banner" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-[999999] flex flex-col items-center justify-center p-6">
        <div class="bg-[#0a0a0a] border border-[#ff4d00]/30 p-8 rounded-xl shadow-[0_0_50px_rgba(255,77,0,0.3)] w-full max-w-md text-center relative animate-pop">
            <button onclick="closeInstallBanner()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="w-20 h-20 bg-[#1f1f1f] rounded-full mx-auto flex items-center justify-center mb-6 border-2 border-[#ff4d00]">
                <img src="https://grind-app.de/logo.jpg" class="w-full h-full rounded-full object-cover" alt="Logo">
            </div>
            <h3 class="text-3xl font-black italic uppercase tracking-tighter mb-2">Install App</h3>
            <p class="text-gray-400 text-xs font-medium leading-relaxed mb-8">Füge GRIND. zu deinem Home-Bildschirm hinzu.</p>
            <div class="bg-black/50 border border-white/10 p-5 rounded-lg flex flex-col gap-5 text-left mb-8">
                <div class="flex items-center gap-4 text-sm text-gray-300">
                    <span class="w-6 h-6 rounded-full bg-[#1f1f1f] text-[#ff4d00] flex items-center justify-center font-black text-xs flex-shrink-0">1</span>
                    <span id="step1-text">Tippe auf das Teilen-Symbol</span>
                    <span class="text-blue-400 flex-shrink-0 ml-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 0L8.5 6.5M12 3l3.5 3.5M6 10H4a2 2 0 00-2 2v8a2 2 0 002 2h16a2 2 0 002-2v-8a2 2 0 00-2-2h-2" /></svg></span>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-300">
                    <span class="w-6 h-6 rounded-full bg-[#1f1f1f] text-[#ff4d00] flex items-center justify-center font-black text-xs flex-shrink-0">2</span>
                    <span>Wähle</span>
                    <span class="text-white bg-[#2c2c2e] rounded shadow-sm border border-gray-600 p-1 flex-shrink-0 ml-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></span>
                    <span class="font-bold text-white uppercase tracking-widest text-[10px]">Zum Home-Bildschirm</span>
                </div>
            </div>
            <button onclick="closeInstallBanner()" class="btn-grind w-full py-4 text-sm">Verstanden</button>
        </div>
    </div>
    
    <script>
        const ua = window.navigator.userAgent.toLowerCase();
        const isIos = /iphone|ipad|ipod/.test(ua);
        const isInStandaloneMode = () => ('standalone' in window.navigator) && window.navigator.standalone;
        const isChrome = /crios/.test(ua);
        const isSafari = !isChrome && /safari/.test(ua);
        
        window.closeInstallBanner = () => { 
            localStorage.setItem('grind_install_dismissed', 'true'); 
            document.getElementById('install-banner').classList.add('hidden'); 
        };
        
        if (isIos && !isInStandaloneMode() && !localStorage.getItem('grind_install_dismissed')) { 
            const s = document.getElementById('step1-text'); 
            if (isChrome) s.innerText = 'Tippe oben rechts auf'; 
            else if (isSafari) s.innerText = 'Tippe unten auf'; 
            setTimeout(() => document.getElementById('install-banner').classList.remove('hidden'), 2000); 
        }
    </script>
</body>
</html>
