<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIND. // KÖLN DROPS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet für die butterweiche interaktive Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Canvas Confetti für sofortige Dopamin-Belohnung -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        accent: '#FF5500',
                        surface: '#121214',
                        card: '#1C1C1F',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090B;
            color: #FFFFFF;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Smooth Apple-like Glassmorphism */
        .glass {
            background: rgba(28, 28, 31, 0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-pill {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Clean Dark Map Styling */
        .leaflet-container {
            background: #09090B !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(95%) grayscale(65%);
        }
        .leaflet-control-attribution { display: none !important; }

        /* Custom Map Marker Pulse */
        @keyframes soft-pulse {
            0% { transform: scale(1); opacity: 0.7; }
            70% { transform: scale(2.2); opacity: 0; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .drop-marker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            background: #1C1C1F;
            border: 2.5px solid #FF5500;
            box-shadow: 0 8px 25px rgba(255, 85, 0, 0.45);
            font-size: 20px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .drop-marker.active-marker {
            transform: scale(1.22);
            background: #FF5500;
            border-color: #FFFFFF;
        }
        .drop-marker::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: #FF5500;
            z-index: -1;
            animation: soft-pulse 2.2s infinite;
        }

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Ticket Perforation Cutout */
        .ticket-card {
            position: relative;
            background: linear-gradient(135deg, #1E1E24 0%, #141417 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ticket-card::before, .ticket-card::after {
            content: '';
            position: absolute;
            top: 65%;
            width: 24px;
            height: 24px;
            background-color: #09090B;
            border-radius: 9999px;
            transform: translateY(-50%);
        }
        .ticket-card::before { left: -13px; border-right: 1px solid rgba(255,255,255,0.1); }
        .ticket-card::after { right: -13px; border-left: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- TOP FLOATING HEADER (Minimalistisch & sofort verständlich) -->
    <header class="fixed top-0 left-0 right-0 z-40 px-4 pt-4 pointer-events-none">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <!-- Brand & City Pill -->
            <div class="glass-pill px-4 py-2 rounded-full flex items-center gap-2.5 pointer-events-auto shadow-lg">
                <span class="font-extrabold text-lg tracking-tight">GRIND<span class="text-accent">.</span></span>
                <span class="h-3.5 w-[1px] bg-white/15"></span>
                <span class="flex items-center gap-1.5 text-xs font-semibold text-zinc-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Köln
                </span>
            </div>

            <!-- User Energy / Points Pill + Creator Switch -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <div onclick="UI.switchTab('wallet')" class="glass-pill px-3.5 py-2 rounded-full flex items-center gap-2 cursor-pointer hover:border-accent/50 transition shadow-lg">
                    <span class="text-sm">⚡</span>
                    <span id="header-sparks" class="font-bold text-sm text-white">450</span>
                </div>
                <button onclick="UI.openCreatorModal()" class="glass-pill w-10 h-10 rounded-full flex items-center justify-center text-sm hover:bg-accent hover:border-accent transition shadow-lg" title="Eigenen Drop in Köln platzieren">
                    ➕
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main id="app-content" class="flex-1 w-full max-w-md mx-auto relative min-h-screen pb-28"></main>

    <!-- BOTTOM NAVIGATION BAR (Daumen-freundlich wie bei Apple / Uber) -->
    <nav class="fixed bottom-5 left-0 right-0 z-40 px-4 pointer-events-none">
        <div class="max-w-xs mx-auto glass-pill p-1.5 rounded-full flex items-center justify-between shadow-[0_20px_50px_rgba(0,0,0,0.8)] pointer-events-auto">
            <button onclick="UI.switchTab('radar')" id="nav-radar" class="flex-1 py-2.5 rounded-full flex items-center justify-center gap-2 text-xs font-bold transition bg-accent text-white shadow-md">
                <span>📍</span> Drops
            </button>
            <button onclick="UI.switchTab('pulse')" id="nav-pulse" class="flex-1 py-2.5 rounded-full flex items-center justify-center gap-2 text-xs font-bold text-zinc-400 hover:text-white transition">
                <span>🔥</span> Live
            </button>
            <button onclick="UI.switchTab('wallet')" id="nav-wallet" class="flex-1 py-2.5 rounded-full flex items-center justify-center gap-2 text-xs font-bold text-zinc-400 hover:text-white transition relative">
                <span>🎟️</span> Wallet
                <span id="wallet-badge" class="w-4 h-4 rounded-full bg-accent text-[10px] text-white flex items-center justify-center font-extrabold">2</span>
            </button>
        </div>
    </nav>

    <!-- BOTTOM SHEET MODAL (Für Check-In, Beute & Drop-Erstellung) -->
    <div id="sheet-backdrop" onclick="UI.closeSheet(event)" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-end sm:items-center justify-center transition-opacity">
        <div onclick="event.stopPropagation()" class="w-full max-w-md bg-[#161619] border-t sm:border border-white/10 rounded-t-[32px] sm:rounded-[32px] p-6 pb-8 shadow-2xl transform transition-transform">
            <div class="w-12 h-1.5 bg-zinc-700 rounded-full mx-auto mb-5"></div>
            <div id="sheet-body"></div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           DATENMODELL: ECHTE KÖLNER DROPS STATT LANGWEILIGER AUFGABENLISTEN
           ========================================================================== */
        const Store = {
            activeTab: 'radar', // 'radar' | 'pulse' | 'wallet'
            selectedDropId: 'drop_weiher',
            sparks: 450,
            userLocation: { lat: 50.9351, lng: 6.9320 }, // Nähe Belgisches / Rathenauplatz
            map: null,
            markers: {},

            drops: [
                {
                    id: 'drop_weiher',
                    title: 'Sunset Run & Free Matcha',
                    place: 'Aachener Weiher • Lindenthal',
                    reward: '1x Gratis Iced Matcha oder Flat White',
                    partner: 'Partner-Café Belgisches Viertel',
                    emoji: '🏃',
                    category: 'Move & Refuel',
                    sparks: 150,
                    spotsLeft: 6,
                    totalSpots: 20,
                    timeLeft: 'Endet in 3 Std.',
                    lat: 50.9351,
                    lng: 6.9268,
                    claimed: false,
                    desc: 'Komm zum Aachener Weiher, dreh eine lockere Runde (oder mach 15 Min Pause am Wasser) und schalte direkt deinen Gratis-Drink frei.'
                },
                {
                    id: 'drop_belgisches',
                    title: 'Golden Hour Mystery Capsule',
                    place: 'Brüsseler Platz • Belgisches Viertel',
                    reward: 'GRIND. Heavyweight Socks + 200⚡',
                    partner: 'GRIND. Street Team',
                    emoji: '🎁',
                    category: 'Limited Street Drop',
                    sparks: 200,
                    spotsLeft: 3,
                    totalSpots: 10,
                    timeLeft: 'Nur noch 3 Stück!',
                    lat: 50.9384,
                    lng: 6.9369,
                    claimed: false,
                    desc: 'Nur 10 Kapseln heute Abend am Brüsseler Platz versteckt. Sei im 150m-Radius und öffne die Kapsel mit einem Tap.'
                },
                {
                    id: 'drop_poller',
                    title: 'Rhein-Ufer Sled & Sweat',
                    place: 'Poller Wiesen • Deutz',
                    reward: 'Free Recovery Shake + Sauna 2-for-1',
                    partner: 'Köln South Athletics',
                    emoji: '⚡',
                    category: 'Outdoor Session',
                    sparks: 250,
                    spotsLeft: 11,
                    totalSpots: 25,
                    timeLeft: 'Heute bis 21:00 Uhr',
                    lat: 50.9214,
                    lng: 6.9742,
                    claimed: false,
                    desc: 'Checke an den Poller Wiesen mit Blick auf den Dom ein. Perfekt für deine Feierabend-Runde oder ein kurzes Outdoor-Workout.'
                },
                {
                    id: 'drop_ehrenfeld',
                    title: 'Night Owl Espresso Tonic',
                    place: 'Venloer Str. • Ehrenfeld',
                    reward: 'Free Espresso Tonic / Cold Brew',
                    partner: 'Ehrenfeld Roasters',
                    emoji: '☕',
                    category: 'Coffee Drop',
                    sparks: 100,
                    spotsLeft: 8,
                    totalSpots: 15,
                    timeLeft: 'Noch 5 Std.',
                    lat: 50.9465,
                    lng: 6.9195,
                    claimed: false,
                    desc: 'Spaziergang durch Ehrenfeld? Hol dir deinen Koffein-Kick auf unseren Nacken – einfach vor Ort einchecken.'
                }
            ],

            wallet: [
                {
                    id: 'w_1',
                    title: '1x Gratis Espresso / Cappuccino',
                    partner: 'GuMo / Belgisches Viertel Köln',
                    code: 'CGN-COFFEE-88',
                    expires: 'Gültig bis Sonntag, 18:00 Uhr',
                    emoji: '☕',
                    used: false
                },
                {
                    id: 'w_2',
                    title: 'VIP Fast-Lane + Free Shake',
                    partner: 'Cologne Run Club • Rheinauhafen',
                    code: 'RUN-CGN-2026',
                    expires: 'Gültig für das nächste Event',
                    emoji: '⚡',
                    used: false
                }
            ],

            liveFeed: [
                { name: 'Lara (Ehrenfeld)', text: 'hat sich gerade den Free Matcha am Aachener Weiher geschnappt', time: 'vor 2 Min', emoji: '🏃' },
                { name: 'Fabio (Südstadt)', text: 'hat die Golden Hour Capsule am Brüsseler Platz geöffnet', time: 'vor 9 Min', emoji: '🎁' },
                { name: 'Moritz & Jana', text: 'haben an den Poller Wiesen eingecheckt (+250⚡)', time: 'vor 18 Min', emoji: '⚡' },
                { name: 'Kai (Nippes)', text: 'hat seinen Coffee-Voucher im Belgischen Viertel eingelöst', time: 'vor 31 Min', emoji: '☕' }
            ]
        };

        /* ==========================================================================
           UI & INTERAKTIONS-LOGIK (KINDERLEICHT & SOFORT BELOHNEND)
           ========================================================================== */
        const UI = {
            init() {
                this.updateHeader();
                this.render();
            },

            updateHeader() {
                document.getElementById('header-sparks').innerText = Store.sparks;
                const activeVouchers = Store.wallet.filter(w => !w.used).length;
                const badge = document.getElementById('wallet-badge');
                badge.innerText = activeVouchers;
                badge.style.display = activeVouchers > 0 ? 'flex' : 'none';
            },

            switchTab(tab) {
                Store.activeTab = tab;
                ['radar', 'pulse', 'wallet'].forEach(t => {
                    const btn = document.getElementById(`nav-${t}`);
                    if (t === tab) {
                        btn.className = "flex-1 py-2.5 rounded-full flex items-center justify-center gap-2 text-xs font-bold transition bg-accent text-white shadow-md relative";
                    } else {
                        btn.className = "flex-1 py-2.5 rounded-full flex items-center justify-center gap-2 text-xs font-bold text-zinc-400 hover:text-white transition relative";
                    }
                });
                this.render();
            },

            render() {
                const container = document.getElementById('app-content');
                if (Store.activeTab === 'radar') {
                    container.innerHTML = this.renderRadarView();
                    setTimeout(() => this.initMap(), 40);
                } else if (Store.activeTab === 'pulse') {
                    container.innerHTML = this.renderPulseView();
                } else if (Store.activeTab === 'wallet') {
                    container.innerHTML = this.renderWalletView();
                }
            },

            /* ----------------------------------------------------------------------
               TAB 1: DIE KARTE & DIE DROP-KARTEN (Wie Apple Maps / Pokémon GO)
               ---------------------------------------------------------------------- */
            renderRadarView() {
                const activeDrop = Store.drops.find(d => d.id === Store.selectedDropId) || Store.drops[0];

                return `
                    <!-- FULLSCREEN INTERACTIVE MAP -->
                    <div class="relative w-full h-[56vh] overflow-hidden rounded-b-[36px] shadow-2xl border-b border-white/10">
                        <div id="map-canvas" class="w-full h-full z-10"></div>
                        
                        <!-- Floating Map Hint -->
                        <div class="absolute bottom-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-none">
                            <div class="glass-pill px-3.5 py-1.5 rounded-full text-[11px] font-semibold text-zinc-200 shadow-lg">
                                🔥 <strong>${Store.drops.filter(d => !d.claimed).length} Live Drops</strong> heute in Köln aktiv
                            </div>
                        </div>
                    </div>

                    <!-- HORIZONTAL SWIPE CARDS FÜR JEDEN DROP -->
                    <div class="px-4 -mt-6 relative z-30">
                        <div class="flex gap-3 overflow-x-auto no-scrollbar py-2">
                            ${Store.drops.map(d => {
                                const isSel = d.id === activeDrop.id;
                                return `
                                    <button onclick="UI.selectDrop('${d.id}')" class="flex-shrink-0 px-4 py-2.5 rounded-2xl flex items-center gap-2.5 text-xs font-bold transition ${isSel ? 'bg-white text-black shadow-lg scale-[1.02]' : 'bg-card text-zinc-300 border border-white/5'}">
                                        <span class="text-base">${d.emoji}</span>
                                        <span>${d.place.split('•')[0].trim()}</span>${d.claimed ? '<span class="text-emerald-500">✓</span>' : `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${isSel ? 'bg-black/10 text-black' : 'bg-accent/20 text-accent'}">${d.spotsLeft} frei</span>`}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- SELECTED DROP HERO CARD -->
                        <div class="mt-3 bg-card border border-white/10 rounded-[28px] p-5 shadow-2xl">
                            <div class="flex justify-between items-start gap-3 mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-2xl bg-accent/15 border border-accent/30 flex items-center justify-center text-2xl">
                                        ${activeDrop.emoji}
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-[11px] font-bold uppercase tracking-wider text-accent">${activeDrop.category}</span>
                                            <span class="text-zinc-600">•</span>
                                            <span class="text-[11px] font-medium text-zinc-400">${activeDrop.timeLeft}</span>
                                        </div>
                                        <h2 class="text-xl font-extrabold text-white leading-tight mt-0.5">${activeDrop.title}</h2>
                                        <p class="text-xs text-zinc-400">${activeDrop.place}</p>
                                    </div>
                                </div>
                            </div>

                            <p class="text-xs text-zinc-300 leading-relaxed mb-4">
                                ${activeDrop.desc}
                            </p>

                            <!-- Was man bekommt (Die Beute) -->
                            <div class="bg-surface border border-white/5 rounded-2xl p-3.5 mb-4 flex items-center justify-between">
                                <div>
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 block">Deine Sofort-Beute</span>
                                    <span class="text-sm font-bold text-white">🎁 ${activeDrop.reward}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-full bg-accent/15 text-accent font-extrabold text-xs">
                                    +${activeDrop.sparks} ⚡
                                </span>
                            </div>

                            <!-- Verfügbarkeits-Balken -->
                            <div class="mb-5">
                                <div class="flex justify-between text-[11px] font-semibold mb-1.5">
                                    <span class="text-zinc-400">Verfügbare Drops an diesem Spot</span>
                                    <span class="text-white font-bold">Noch ${activeDrop.spotsLeft} von ${activeDrop.totalSpots} da</span>
                                </div>
                                <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden">
                                    <div class="h-full bg-gradient-to-r from-accent to-amber-400 rounded-full transition-all duration-500" style="width: ${(activeDrop.spotsLeft / activeDrop.totalSpots) * 100}%"></div>
                                </div>
                            </div>

                            <!-- DER EINZIGE GROSSE ACTION-BUTTON -->
                            ${activeDrop.claimed ? `
                                <button onclick="UI.switchTab('wallet')" class="w-full py-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-extrabold text-sm flex items-center justify-center gap-2">
                                    ✓ In deiner Wallet gespeichert – Jetzt ansehen
                                </button>
                            ` : `
                                <button onclick="UI.openClaimSheet('${activeDrop.id}')" class="w-full py-4 rounded-2xl bg-accent hover:bg-[#ff661a] active:scale-[0.99] text-white font-extrabold text-sm shadow-[0_10px_30px_rgba(255,85,0,0.4)] transition flex items-center justify-center gap-2">
                                    <span>📍</span> Vor Ort einchecken & Drop abholen
                                </button>
                            `}
                        </div>
                    </div>
                `;
            },

            initMap() {
                const mapEl = document.getElementById('map-canvas');
                if (!mapEl || typeof L === 'undefined') return;

                if (Store.map) {
                    Store.map.remove();
                    Store.map = null;
                }

                const activeDrop = Store.drops.find(d => d.id === Store.selectedDropId) || Store.drops[0];
                const map = L.map(mapEl, { zoomControl: false }).setView([activeDrop.lat, activeDrop.lng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

                Store.drops.forEach(d => {
                    const isSelected = d.id === activeDrop.id;
                    const icon = L.divIcon({
                        className: 'custom-pin',
                        html: `<div class="drop-marker ${isSelected ? 'active-marker' : ''}">${d.emoji}</div>`,
                        iconSize: [44, 44],
                        iconAnchor: [22, 22]
                    });

                    const marker = L.marker([d.lat, d.lng], { icon }).addTo(map);
                    marker.on('click', () => this.selectDrop(d.id));
                });

                Store.map = map;
            },

            selectDrop(id) {
                Store.selectedDropId = id;
                this.render();
            },

            /* ----------------------------------------------------------------------
               SUPER EINFACHER 1-TAP CHECK-IN (Ohne komplizierte Formulare!)
               ---------------------------------------------------------------------- */
            openClaimSheet(dropId) {
                const d = Store.drops.find(x => x.id === dropId);
                if (!d) return;

                const html = `
                    <div class="text-center">
                        <div class="w-16 h-16 rounded-3xl bg-accent/15 border border-accent/30 flex items-center justify-center text-4xl mx-auto mb-4">
                            ${d.emoji}
                        </div>
                        <span class="text-xs font-bold uppercase tracking-wider text-accent">${d.place}</span>
                        <h3 class="text-2xl font-extrabold text-white mt-1 mb-2">${d.title}</h3>
                        <p class="text-xs text-zinc-400 max-w-xs mx-auto mb-6">
                            Bist du vor Ort (oder möchtest du den Drop jetzt im Demo-Modus öffnen)? Du erhältst sofort <strong>${d.reward}</strong> in deine Wallet.
                        </p>

                        <div class="bg-surface border border-white/10 rounded-2xl p-4 mb-6 text-left flex items-center justify-between">
                            <div>
                                <p class="text-[11px] text-zinc-400">Standort-Check</p>
                                <p class="text-sm font-bold text-emerald-400">✓ Köln Sektor bereit</p>
                            </div>
                            <span class="text-xs font-bold bg-white/10 px-3 py-1.5 rounded-full">150m Radius</span>
                        </div>

                        <button onclick="UI.confirmClaim('${d.id}')" class="w-full py-4 rounded-2xl bg-accent hover:bg-[#ff661a] text-white font-extrabold text-base shadow-[0_10px_30px_rgba(255,85,0,0.4)] transition mb-3">
                            🎁 Kapsel jetzt öffnen (+${d.sparks} ⚡)
                        </button>
                        <button onclick="UI.closeSheet()" class="w-full py-3 rounded-2xl text-xs font-bold text-zinc-500 hover:text-white">
                            Später
                        </button>
                    </div>
                `;
                this.showSheet(html);
            },

            confirmClaim(dropId) {
                const d = Store.drops.find(x => x.id === dropId);
                if (!d || d.claimed) return;

                d.claimed = true;
                d.spotsLeft = Math.max(0, d.spotsLeft - 1);
                Store.sparks += d.sparks;

                // Direkt als schönes Ticket in die Wallet legen
                Store.wallet.unshift({
                    id: 'w_' + Date.now(),
                    title: d.reward,
                    partner: `${d.partner} (${d.place.split('•')[0].trim()})`,
                    code: `CGN-${Math.floor(1000 + Math.random() * 9000)}`,
                    expires: 'Ab sofort 7 Tage gültig',
                    emoji: d.emoji,
                    used: false
                });

                // In den Live-Feed pushen
                Store.liveFeed.unshift({
                    name: 'Du (Köln)',
                    text: `hast dir gerade '${d.reward}' am Spot ${d.place.split('•')[0]} gesichert!`,
                    time: 'Gerade eben',
                    emoji: d.emoji
                });

                this.closeSheet();
                this.updateHeader();

                // Konfetti-Belohnung!
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 70, spread: 65, origin: { y: 0.7 } });
                }

                this.switchTab('wallet');
            },

            /* ----------------------------------------------------------------------
               TAB 2: LIVE IN KÖLN (Sozialer Beweis & Freunde ohne leeren Feed)
               ---------------------------------------------------------------------- */
            renderPulseView() {
                return `
                    <div class="pt-20 px-4 space-y-6">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-accent">Live in deiner Stadt</span>
                            <h1 class="text-3xl font-extrabold mt-0.5">Köln Pulse 🔥</h1>
                            <p class="text-xs text-zinc-400 mt-1">Sieh in Echtzeit, wo in Köln gerade Drops geknackt werden.</p>
                        </div>

                        <!-- Freunde Einladen Banner (Simpel & Belohnend) -->
                        <div class="bg-gradient-to-r from-accent/20 via-amber-500/10 to-card border border-accent/30 rounded-[24px] p-5 flex items-center justify-between gap-4">
                            <div>
                                <span class="text-[11px] font-extrabold uppercase tracking-wider text-accent">Zusammen rausgehen</span>
                                <h3 class="text-base font-extrabold text-white mt-0.5">Nimm 1 Freund mit zum nächsten Drop</h3>
                                <p class="text-xs text-zinc-300 mt-1">Ihr bekommt beide sofort einen Gratis-Coffee-Drop freigeschaltet.</p>
                            </div>
                            <button onclick="UI.shareInvite()" class="flex-shrink-0 px-4 py-3 rounded-2xl bg-white text-black font-extrabold text-xs shadow-md active:scale-95 transition">
                                Teilen 🔗
                            </button>
                        </div>

                        <!-- Live Ticker Cards -->
                        <div class="space-y-3">
                            ${Store.liveFeed.map(item => `
                                <div class="bg-card border border-white/5 rounded-2xl p-4 flex items-center gap-3.5">
                                    <div class="w-11 h-11 rounded-2xl bg-surface flex items-center justify-center text-xl flex-shrink-0 border border-white/5">
                                        ${item.emoji}
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs text-zinc-200 leading-snug">
                                            <strong class="text-white">${item.name}</strong>${item.text}
                                        </p>
                                        <span class="text-[11px] text-zinc-500 font-medium">${item.time}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            /* ----------------------------------------------------------------------
               TAB 3: DEINE WALLET (Echte Gutscheine zum Vorzeigen im Café/Shop)
               ---------------------------------------------------------------------- */
            renderWalletView() {
                return `
                    <div class="pt-20 px-4 space-y-6">
                        <div class="flex items-end justify-between">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-accent">Deine Beute</span>
                                <h1 class="text-3xl font-extrabold mt-0.5">Drop Wallet 🎟️</h1>
                            </div>
                            <div class="text-right">
                                <span class="text-[11px] text-zinc-400 block">Gesammelte Energie</span>
                                <span class="text-lg font-extrabold text-accent">${Store.sparks} ⚡</span>
                            </div>
                        </div>

                        <p class="text-xs text-zinc-400">
                            Zeige diese Karten einfach beim Partner-Café oder Drop-Spot in Köln vor, um deine Belohnung einzulösen.
                        </p>

                        <div class="space-y-4">
                            ${Store.wallet.map(w => `
                                <div class="ticket-card rounded-[28px] p-5 shadow-xl ${w.used ? 'opacity-45' : ''}">
                                    <div class="flex items-start justify-between gap-3 pb-5 border-b border-dashed border-white/15">
                                        <div class="flex items-center gap-3.5">
                                            <div class="w-12 h-12 rounded-2xl bg-accent/15 border border-accent/30 flex items-center justify-center text-2xl">
                                                ${w.emoji}
                                            </div>
                                            <div>
                                                <h3 class="text-base font-extrabold text-white">${w.title}</h3>
                                                <p class="text-xs text-zinc-400 mt-0.5">${w.partner}</p>
                                                <span class="inline-block text-[10px] text-emerald-400 font-semibold mt-1">${w.expires}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="pt-4 flex items-center justify-between">
                                        <div>
                                            <span class="text-[10px] uppercase tracking-wider text-zinc-500 block font-bold">Pass-Code</span>
                                            <span class="font-mono text-sm font-extrabold text-white tracking-wider">${w.code}</span>
                                        </div>

                                        ${w.used ? `
                                            <span class="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-500 text-xs font-bold">Bereits eingelöst</span>
                                        ` : `
                                            <button onclick="UI.redeemVoucher('${w.id}')" class="px-5 py-2.5 rounded-xl bg-white hover:bg-accent text-black hover:text-white font-extrabold text-xs transition shadow">
                                                An der Kasse vorzeigen →
                                            </button>
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            redeemVoucher(id) {
                const v = Store.wallet.find(x => x.id === id);
                if (!v) return;

                const html = `
                    <div class="text-center">
                        <div class="w-16 h-16 rounded-3xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-3xl mx-auto mb-3">
                            ${v.emoji}
                        </div>
                        <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Live Voucher</span>
                        <h3 class="text-2xl font-extrabold text-white mt-1">${v.title}</h3>
                        <p class="text-xs text-zinc-400 mt-1 mb-6">${v.partner}</p>

                        <div class="bg-black border border-white/10 rounded-2xl p-5 mb-6">
                            <p class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1">Code für Partner / Barista</p>
                            <p class="font-mono text-2xl font-extrabold text-accent tracking-widest">${v.code}</p>
                        </div>

                        <button onclick="UI.confirmVoucherUse('${v.id}')" class="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-sm transition mb-2">
                            ✓ Jetzt entwerten & einlösen
                        </button>
                        <button onclick="UI.closeSheet()" class="w-full py-2.5 text-xs font-bold text-zinc-500">
                            Schließen
                        </button>
                    </div>
                `;
                this.showSheet(html);
            },

            confirmVoucherUse(id) {
                const v = Store.wallet.find(x => x.id === id);
                if (v) v.used = true;
                this.closeSheet();
                this.updateHeader();
                this.render();
            },

            /* ----------------------------------------------------------------------
               CREATOR-MODUS: IN 10 SEKUNDEN EINEN NEUEN KÖLN-DROP SETZEN
               ---------------------------------------------------------------------- */
            openCreatorModal() {
                const html = `
                    <div>
                        <span class="text-xs font-bold uppercase tracking-wider text-accent">Creator & Partner Mode</span>
                        <h3 class="text-2xl font-extrabold text-white mt-0.5 mb-1">Neuen Drop in Köln setzen 📍</h3>
                        <p class="text-xs text-zinc-400 mb-5">Platziere in 10 Sekunden eine neue Kapsel für deine Community oder ein Partner-Café.</p>

                        <form onsubmit="UI.createNewDrop(event)" class="space-y-3">
                            <div class="flex gap-2">
                                <input id="new-drop-emoji" value="🍹" required class="w-14 p-3.5 rounded-2xl bg-surface border border-white/10 text-center text-xl outline-none focus:border-accent">
                                <input id="new-drop-title" placeholder="Name (z.B. Sundowner Spritz Drop)" required class="flex-1 p-3.5 rounded-2xl bg-surface border border-white/10 text-sm text-white outline-none focus:border-accent">
                            </div>
                            <input id="new-drop-place" placeholder="Ort in Köln (z.B. Rathenauplatz • Neustadt-Süd)" required class="w-full p-3.5 rounded-2xl bg-surface border border-white/10 text-sm text-white outline-none focus:border-accent">
                            <input id="new-drop-reward" placeholder="Was gibt es gratis? (z.B. 1x Gratis Aperol / Limo)" required class="w-full p-3.5 rounded-2xl bg-surface border border-white/10 text-sm text-white outline-none focus:border-accent">
                            
                            <div class="grid grid-cols-2 gap-2">
                                <input id="new-drop-spots" type="number" placeholder="Anzahl (z.B. 15)" value="15" required class="p-3.5 rounded-2xl bg-surface border border-white/10 text-sm text-white outline-none focus:border-accent">
                                <select id="new-drop-veedel" class="p-3.5 rounded-2xl bg-surface border border-white/10 text-sm text-white outline-none focus:border-accent">
                                    <option value="50.9302,6.9392">📍 Rathenauplatz</option>
                                    <option value="50.9285,6.9588">📍 Chlodwigplatz (Südstadt)</option>
                                    <option value="50.9362,6.9098">📍 Stadtwald / Lindenthal</option>
                                    <option value="50.9515,6.9535">📍 Agnesviertel</option>
                                </select>
                            </div>

                            <button type="submit" class="w-full py-4 mt-2 rounded-2xl bg-accent hover:bg-[#ff661a] text-white font-extrabold text-sm shadow-lg transition">
                                🚀 Drop jetzt live auf die Karte setzen
                            </button>
                        </form>
                    </div>
                `;
                this.showSheet(html);
            },

            createNewDrop(e) {
                e.preventDefault();
                const emoji = document.getElementById('new-drop-emoji').value || '🎁';
                const title = document.getElementById('new-drop-title').value.trim();
                const place = document.getElementById('new-drop-place').value.trim();
                const reward = document.getElementById('new-drop-reward').value.trim();
                const count = parseInt(document.getElementById('new-drop-spots').value) || 10;
                const coords = document.getElementById('new-drop-veedel').value.split(',');

                const newId = 'drop_' + Date.now();
                Store.drops.unshift({
                    id: newId,
                    title,
                    place,
                    reward,
                    partner: 'Community Partner Köln',
                    emoji,
                    category: 'Fresh Live Drop',
                    sparks: 200,
                    spotsLeft: count,
                    totalSpots: count,
                    timeLeft: 'Gerade gestartet!',
                    lat: parseFloat(coords[0]),
                    lng: parseFloat(coords[1]),
                    claimed: false,
                    desc: `Frisch platzierter Drop in ${place}. Sei schnell, bevor alle ${count} Spots weg sind!`
                });

                Store.selectedDropId = newId;
                this.closeSheet();
                this.switchTab('radar');
            },

            shareInvite() {
                if (navigator.share) {
                    navigator.share({
                        title: 'GRIND. // KÖLN DROPS',
                        text: 'Komm mit zum nächsten Drop in Köln – es gibt noch freie Coffee- & Streetwear-Kapseln!',
                        url: window.location.href
                    }).catch(() => {});
                } else {
                    alert('Einladungs-Link für deine Crew wurde kopiert!');
                }
            },

            showSheet(html) {
                const bd = document.getElementById('sheet-backdrop');
                document.getElementById('sheet-body').innerHTML = html;
                bd.classList.remove('hidden');
                bd.classList.add('flex');
            },

            closeSheet(e) {
                const bd = document.getElementById('sheet-backdrop');
                bd.classList.add('hidden');
                bd.classList.remove('flex');
            }
        };

        window.UI = UI;
        window.addEventListener('DOMContentLoaded', () => UI.init());
    </script>
</body>
</html>
