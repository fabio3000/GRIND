    <style>

        .grecaptcha-badge:hover { filter: invert(1) grayscale(0) opacity(0.8); }

        @keyframes flashInOut { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); filter: blur(4px); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px); } 90% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); filter: blur(0px); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); filter: blur(4px); } }
        .legal-content h2 { color: white; font-weight: 900; font-style: italic; text-transform: uppercase; margin-top: 2.5rem; margin-bottom: 0.75rem; letter-spacing: 0.05em; font-size: 1.25rem; }
        .legal-content h3 { color: #d4d4d4; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .legal-content p { margin-bottom: 1rem; color: #a3a3a3; font-size: 0.875rem; line-height: 1.6; }

        .legal-content a:hover { color: #ffffff; text-decoration: underline; }

<body class="flex flex-col relative select-none">
    <div id="toast-container"></div>
    <div id="xp-hud" class="fixed top-0 left-0 right-0 z-[999999] transform -translate-y-[150%] transition-transform duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] pointer-events-none flex justify-center pt-4 px-4 sm:px-6">
        <div class="absolute top-2 w-full max-w-md h-32 bg-black/60 blur-2xl rounded-full pointer-events-none z-0"></div>
        <div class="bg-[#0a0a0a]/70 border border-[#ff4d00]/40 shadow-[0_20px_50px_rgba(0,0,0,0.7),_0_0_20px_rgba(255,77,0,0.15)] rounded-lg p-5 w-full max-w-sm flex flex-col gap-3 relative overflow-hidden backdrop-blur-2xl z-10">
            <div class="absolute inset-0 bg-gradient-to-b from-[#ff4d00]/15 to-transparent"></div>
            <div class="relative z-10 flex justify-between items-end">
                <div>
                    <p class="text-[#ff4d00] text-[9px] font-black uppercase tracking-[0.3em] mb-1 drop-shadow-md">XP Sync</p>
                    <h4 class="text-white font-black italic text-2xl leading-none">LVL <span id="hud-lvl">1</span></h4>
                </div>
                <div class="text-right">
                    <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest italic"><span id="hud-xp-num" class="text-white text-sm">0</span> / <span id="hud-xp-max">1000</span></span>
                </div>
            </div>
            <div class="w-full bg-black h-2.5 rounded-full overflow-hidden border border-white/10 relative z-10 shadow-inner">
                <div id="hud-xp-bar" class="grind-gradient h-full transition-all ease-out relative">
                    <div class="absolute top-0 right-0 bottom-0 w-10 bg-gradient-to-r from-transparent to-white/50"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="recaptcha-container"></div>
    <div id="app" class="flex-1 flex flex-col w-full z-10 relative pb-10">
        <div class="flex-1 flex items-center justify-center min-h-[60vh]">
            <div class="w-16 h-16 border-t-4 border-l-4 border-[#ff4d00] rounded-full animate-spin"></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, arrayUnion, onSnapshot, collection, addDoc, query, where, getDocs, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtwsvmYSONjFufhbJ5I8G_RAMffnh7re0",
            authDomain: "theplot-app.firebaseapp.com",
            projectId: "theplot-app",
            storageBucket: "theplot-app.firebasestorage.app",
            messagingSenderId: "550703275210",
            appId: "1:550703275210:web:81bc0e5a373f87a3c92833"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        let state = {
            user: null, 
            profile: null, 
            prevXp: null, 
            prevLvl: null,
            bundlePrice: '19.00', 
            view: 'loading', 
            prevView: 'dashboard',
            currentWeekTab: 1,
            authStep: 'phone', 
            tempPhone: '', 
            tempUploadData: null,
            weeklyData: { 1: { title: "Loading...", startOffset: 0, missions: [] } },
            rewardData: [], 
            habitData: [], 
            pendingMissions: [], 
            activities: [],
            seasonConfig: null,
            dashboardNeedsScroll: true
        };

        const RANKS = ["Rookie", "Grinder", "Hustler", "Athlete", "Machine", "Legend"];
        let holdTimer = null; 
        let holdProgress = 0; 
        let isRedeeming = false;
        window.currentVerify = null;
        window.countdownInterval = null;

        const getRelativeTime = (timestamp) => {
            if(!timestamp) return "Gerade eben";
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "Gerade eben";
            if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
            if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;
            return `vor ${Math.floor(diff/86400)} Tagen`;
        };

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div'); 
            toast.className = `toast ${type}`;
            const icon = type === 'error' 
                ? `<svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` 
                : `<svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            toast.innerHTML = `${icon} <div><div class="font-black text-[10px] uppercase tracking-widest text-gray-400 mb-0.5">System</div><div>${msg}</div></div>`;
            container.appendChild(toast); 
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { 
                toast.classList.remove('show'); 
                setTimeout(() => toast.remove(), 400); 
            }, 4000);
        };

        window.logActivity = async (type, text, customAlias = null, customIsPro = null) => {
            try {
                if(!state.profile || !state.profile.alias) return;
                const aliasToUse = customAlias || state.profile.alias;
                const isProToUse = customIsPro !== null ? customIsPro : !!state.profile.hasPremium;
                const newAct = { alias: aliasToUse, isPro: isProToUse, type: type, text: text, timestamp: Date.now() };
                await addDoc(collection(db, 'plot_activities'), newAct).catch(err => {});
            } catch(e) {}
        };

        const getActiveWeek = () => {
            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            if(now < start) return 1;
            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate() + 1);
            firstSunday.setHours(23, 59, 59, 999);
            if (now.getTime() <= firstSunday.getTime()) return 1;
            const diffTime = now.getTime() - firstSunday.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
            let week = 2 + Math.floor(diffDays / 7);
            return Math.max(1, Math.min(week, 4));
        };

        const getSeasonStatus = () => {
            if (!state.seasonConfig) return { status: 'loading' };
            if (state.seasonConfig.active === false || state.seasonConfig.active === 'false') return { status: 'offline' };
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            const end = new Date(state.seasonConfig.end);
            end.setHours(23, 59, 59, 999);
            if (now < start) return { status: 'upcoming', date: start };
            if (now > end) return { status: 'ended', date: end };
            return { status: 'active' };
        };

        window.updateCountdown = () => {
            const el = document.getElementById('season-countdown');
            if(!el || !state.seasonConfig) return;
            const start = new Date(state.seasonConfig.start).getTime();
            const now = new Date().getTime();
            const distance = start - now;
            if (distance < 0) {
                el.innerHTML = "LAUNCHING...";
                if(window.countdownInterval) clearInterval(window.countdownInterval);
                setTimeout(() => render(), 2000); 
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            el.innerHTML = `${days}D ${hours.toString().padStart(2, '0')}H ${minutes.toString().padStart(2, '0')}M ${seconds.toString().padStart(2, '0')}S`;
        };

        const setupSeasonData = () => {
            onSnapshot(doc(db, 'system', 'grind_season'), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.weeklyData = data.weeklyData || state.weeklyData;
                    state.rewardData = data.rewardData || [];
                    state.habitData = data.habitData || [];
                    state.seasonConfig = data.seasonConfig || { number: 1, active: true, start: '', end: '' };
                    state.currentWeekTab = getActiveWeek();
                }
                if(state.view === 'dashboard' || state.view === 'paywall') render();
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                state.user = user;
                onSnapshot(doc(db, 'plot_users', user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        state.profile = docSnap.data();
                        if (!state.profile.crewCode) {
                            const generatedCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                            state.profile.crewCode = generatedCode;
                            setDoc(doc(db, 'plot_users', user.uid), { crewCode: generatedCode }, { merge: true });
                        }
                        if (['loading', 'auth', 'onboarding'].includes(state.view)) {
                            state.view = 'dashboard';
                            state.dashboardNeedsScroll = true;
                            const urlParams = new URLSearchParams(window.location.search);
                            const crewCode = urlParams.get('crew');
                            if (crewCode) {
                                window.history.replaceState({}, document.title, window.location.pathname);
                                setTimeout(() => window.resolveInvite(crewCode), 1000);
                            }
                        }
                        render();
                    } else { 
                        state.view = 'onboarding'; 
                        render(); 
                    }
                });
                
                onSnapshot(collection(db, 'plot_pending_proofs'), (snap) => {
                    if (snap && snap.docs) {
                        state.pendingMissions = snap.docs.map(d => d.data())
                                                         .filter(data => data.uid === state.user.uid);
                        if(state.view === 'dashboard') render();
                    }
                });

                const activitiesQuery = query(collection(db, 'plot_activities'), orderBy('timestamp', 'desc'), limit(50));
                onSnapshot(activitiesQuery, (snap) => {
                    if(snap && snap.docs) {
                        state.activities = snap.docs.map(d => d.data());
                        if(state.view === 'dashboard') render();
                    }
                }, (error) => {});

                setupSeasonData();
                onSnapshot(doc(db, 'system', 'pricing'), (docSnap) => {
                    if (docSnap.exists()) state.bundlePrice = docSnap.data().bundlePrice; 
                    if (state.view === 'paywall') render(); 
                });
            } else { 
                state.user = null; state.profile = null; state.view = 'auth'; state.authStep = 'phone'; render(); 
            }
        });

        window.closeModal = () => {
            if(window.stopRedeemHold) window.stopRedeemHold(); 
            const forceClose = () => {
                const container = document.getElementById('modal-container');
                if(container) { 
                    container.classList.remove('opacity-100'); 
                    container.classList.add('opacity-0', 'pointer-events-none'); 
                    setTimeout(() => container.innerHTML = '', 300); 
                }
            };
            if(window.html5QrCode) {
                try {
                    const qrState = window.html5QrCode.getState();
                    if(qrState === 2) { 
                        let closed = false; 
                        const finish = () => { if(closed) return; closed = true; window.html5QrCode = null; forceClose(); };
                        window.html5QrCode.stop().then(() => { try { window.html5QrCode.clear(); } catch(e){} finish(); }).catch(finish);
                        setTimeout(finish, 800); 
                        return; 
                    } else { window.html5QrCode.clear(); window.html5QrCode = null; }
                } catch(e) { window.html5QrCode = null; }
            }
            forceClose();
        };

        window.openModal = (contentHtml) => {
            let container = document.getElementById('modal-container');
            if(!container) { 
                container = document.createElement('div'); 
                container.id = 'modal-container'; 
                container.className = 'fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 overflow-y-auto'; 
                document.body.appendChild(container); 
            }
            container.innerHTML = `
                <div class="bg-[#0a0a0a] border border-[#1f1f1f] p-8 rounded-sm max-w-md w-full shadow-[0_0_40px_rgba(255,77,0,0.1)] transform scale-95 transition-transform duration-300 relative my-auto">
                    <button type="button" onclick="window.closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white z-50">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    ${contentHtml}
                </div>`;
            setTimeout(() => { 
                container.classList.remove('opacity-0', 'pointer-events-none'); 
                container.classList.add('opacity-100');

                    canvas.width = width; canvas.height = height;

                                        <svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                        <span class="font-black italic uppercase text-xs tracking-widest">Crew Erweitern</span>
                                    </button>
                                </div>
                            </div>
                `;

                const friendsList = p.friends || []; const feedUsers = [...friendsList]; const feedUsersLower = feedUsers.map(u => (u || '').toLowerCase());
                const feedActivities = (state.activities || []).filter(act => act.alias && feedUsersLower.includes(act.alias.toLowerCase())).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 10);

                if (feedActivities.length === 0) {
                    if (friendsList.length === 0) html += `<div class="text-center p-8 text-gray-600 italic text-sm border border-white/5 rounded-sm bg-black/50">Deine Crew ist noch leer. <br><span class="text-[#ff4d00] font-bold">Lade Freunde ein und kassiere deinen XP Boost!</span></div>`;
                    else html += `<div class="text-center p-8 text-gray-600 italic text-sm border border-white/5 rounded-sm bg-black/50">Noch keine Aktivität in deiner Crew. Time to grind!</div>`;
                } else {
                    html += `<div class="space-y-4 relative before:absolute before:inset-y-0 before:left-[19px] before:w-[2px] before:bg-[#1f1f1f]">`;
                    feedActivities.forEach(act => {
                        const isProUser = act.isPro === true;
                        let iconSvg = 'M5 13l4 4L19 7'; let colorClass = isProUser ? 'text-[#a855f7]' : 'text-[#ff4d00]';
                        let borderClass = isProUser ? 'border-[#a855f7]/30' : 'border-[#ff4d00]/30'; let shadowClass = '';
                        if (act.type === 'LEVEL_UP') { iconSvg = 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6'; borderClass = isProUser ? 'border-[#a855f7]' : 'border-[#ff4d00]'; shadowClass = isProUser ? 'shadow-[0_0_10px_rgba(168,85,247,0.3)]' : 'shadow-[0_0_10px_rgba(255,77,0,0.3)]'; } 
                        else if (act.type === 'REDEEM') { iconSvg = 'M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7'; borderClass = isProUser ? 'border-[#a855f7]' : 'border-[#ff4d00]'; shadowClass = isProUser ? 'shadow-[0_0_10px_rgba(168,85,247,0.3)]' : 'shadow-[0_0_10px_rgba(255,77,0,0.3)]'; } 
                        else if (act.type === 'PRO') { iconSvg = 'M13 10V3L4 14h7v7l9-11h-7z'; colorClass = 'text-[#a855f7]'; borderClass = 'border-[#a855f7]'; shadowClass = 'shadow-[0_0_15px_rgba(168,85,247,0.4)]'; }
                        const time = getRelativeTime(act.timestamp); const displayName = act.alias;
                        const nameColorClass = isProUser ? 'text-[#d8b4fe]' : 'text-[#ff4d00]';
                        const proBadge = isProUser ? `<span class="ml-2 align-middle bg-[#a855f7]/20 text-[#a855f7] border border-[#a855f7]/30 text-[8px] px-1.5 py-0.5 rounded-sm font-black shadow-[0_0_10px_rgba(168,85,247,0.2)]">PRO</span>` : '';
                        const dynamicText = act.text.replace(/text-\[#[a-fA-F0-9]+\]/g, isProUser ? 'text-[#a855f7]' : 'text-[#ff4d00]');
                        html += `
                            <div class="flex gap-4 relative z-10">
                                <div class="w-10 h-10 rounded-full bg-[#0a0a0a] border-2 ${borderClass} flex items-center justify-center flex-shrink-0 ${shadowClass}"><svg class="w-4 h-4 ${colorClass}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconSvg}"></path></svg></div>
                                <div class="card p-4 rounded-sm flex-1"><p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">${time}</p><p class="text-sm font-medium text-gray-300"><span class="${nameColorClass} italic uppercase font-black">${displayName}</span>${proBadge} <span class="text-gray-400 text-xs">${dynamicText}</span></p></div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `</section></main>${getFooterHTML()}`;
                appDiv.innerHTML = html;

                setTimeout(() => {
                    const xpAnimDuration = 2500;
                    const currentNode = document.getElementById(`level-node-${safeLvl}`);
                    const passViewport = document.getElementById('pass-viewport');
                    if (passViewport && currentNode && (state.prevLvl === null || state.dashboardNeedsScroll)) {
                        const scrollLeft = currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2);
                        passViewport.scrollTo({ left: scrollLeft, behavior: 'smooth' }); state.dashboardNeedsScroll = false;
                    }
                    const topBar = document.getElementById('top-xp-bar'); const trackLine = document.getElementById('track-line');
                    if (trackLine) trackLine.style.width = `calc(140px * ${targetTrackProgress})`;
                    if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                        if (topBar) {
                            topBar.style.transition = `width ${xpAnimDuration/2}ms ease-in`; topBar.style.width = '100%';
                            setTimeout(() => { topBar.style.transition = 'none'; topBar.style.width = '0%'; void topBar.offsetWidth; topBar.style.transition = `width ${xpAnimDuration/2}ms ease-out`; topBar.style.width = `${targetXpProgress}%`; }, xpAnimDuration/2); 
                        }
                        if (passViewport && currentNode) {
                            const scrollLeft = currentNode.offsetLeft - (passViewport.offsetWidth / 2) + (currentNode.offsetWidth / 2); passViewport.scrollTo({ left: scrollLeft, behavior: 'smooth' });
                        }
                    } else if (topBar) { topBar.style.transition = `width ${xpAnimDuration}ms ease-out`; topBar.style.width = `${targetXpProgress}%`; }
                    
                    if (state.prevXp !== null && state.prevXp < safeXp) {
                        const hud = document.getElementById('xp-hud');
                        const hudLvl = document.getElementById('hud-lvl');
                        const hudXpNum = document.getElementById('hud-xp-num');
                        const hudXpMax = document.getElementById('hud-xp-max');
                        const hudXpBar = document.getElementById('hud-xp-bar');
                        const isScrolledDown = window.scrollY > 100;

                        if(isScrolledDown && hud) {
                            hudLvl.innerText = state.prevLvl;
                            hudXpNum.innerText = state.prevXp;
                            hudXpMax.innerText = state.prevLvl * 1000;
                            hudXpBar.style.transition = 'none';
                            hudXpBar.style.width = `${oldXpProgress}%`;
                            void hudXpBar.offsetWidth;

                            hud.classList.remove('-translate-y-[150%]');
                            hud.classList.add('translate-y-0');

                            animateValue('hud-xp-num', state.prevXp, safeXp, xpAnimDuration);

                            if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                                hudXpBar.style.transition = `width ${xpAnimDuration/2}ms ease-in`;
                                hudXpBar.style.width = '100%';
                                setTimeout(() => {
                                    hudLvl.innerText = safeLvl;
                                    hudLvl.classList.add('animate-pop');
                                    hudXpMax.innerText = safeLvl * 1000;
                                    hudXpBar.style.transition = 'none';
                                    hudXpBar.style.width = '0%';
                                    void hudXpBar.offsetWidth;
                                    hudXpBar.style.transition = `width ${xpAnimDuration/2}ms ease-out`;
                                    hudXpBar.style.width = `${targetXpProgress}%`;
                                }, xpAnimDuration/2);
                            } else {
                                hudXpBar.style.transition = `width ${xpAnimDuration}ms ease-out`;
                                hudXpBar.style.width = `${targetXpProgress}%`;
                            }

                            setTimeout(() => {
                                hud.classList.remove('translate-y-0');
                                hud.classList.add('-translate-y-[150%]');
                                if(hudLvl) hudLvl.classList.remove('animate-pop');
                            }, xpAnimDuration + 2500);
                        }

                        animateValue('xp-counter-num', state.prevXp, safeXp, xpAnimDuration);
                        if (state.prevLvl !== null && safeLvl > state.prevLvl) {
                            const lvlText = document.getElementById('main-lvl-text'); if (lvlText) lvlText.classList.add('animate-pop');
                            const newCircle = document.getElementById(`circle-node-${safeLvl}`); if (newCircle) newCircle.classList.add('animate-pop');
                        }
                    }
                    state.prevXp = safeXp; state.prevLvl = safeLvl;
                }, 50);
                return;
            }

            appDiv.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center text-center p-6 min-h-[80vh] relative z-20">
                    <h1 class="text-8xl md:text-9xl font-black italic text-[#1f1f1f] tracking-tighter mb-4 select-none">404</h1>
                    <p class="text-[#ff4d00] font-black uppercase tracking-[0.4em] mb-8 text-sm">Signal Lost</p>
                    <p class="text-gray-500 font-bold max-w-xs text-xs leading-relaxed mb-10">Die angeforderte Position existiert nicht auf der Grind Map.</p>
                    <button onclick="window.setView('dashboard')" class="btn-grind">Return to Base</button>
                </div>
            `;
        }
    </script>
    <div id="install-banner" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-[999999] flex flex-col items-center justify-center p-6">
        <div class="bg-[#0a0a0a] border border-[#ff4d00]/30 p-8 rounded-sm shadow-[0_0_50px_rgba(255,77,0,0.3)] w-full max-w-md text-center relative animate-pop">
            <button onclick="closeInstallBanner()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <div class="w-20 h-20 bg-[#1f1f1f] rounded-full mx-auto flex items-center justify-center mb-6 border-2 border-[#ff4d00]"><img src="https://grind-app.de/logo.jpg" class="w-full h-full rounded-full object-cover" alt="Logo"></div>
            <h3 class="text-3xl font-black italic uppercase tracking-tighter mb-2">Install App</h3>
            <p class="text-gray-400 text-xs font-medium leading-relaxed mb-8">Füge GRIND. zu deinem Home-Bildschirm hinzu, um direkt und im schnellen Fullscreen auf den Tracker zuzugreifen.</p>
            <div class="bg-black/50 border border-white/10 p-5 rounded-sm flex flex-col gap-5 text-left mb-8">
                <div class="flex items-center gap-4 text-sm text-gray-300">
                    <span class="w-6 h-6 rounded-full bg-[#1f1f1f] text-[#ff4d00] flex items-center justify-center font-black text-xs flex-shrink-0">1</span>
                    <span id="step1-text">Tippe auf das Teilen-Symbol</span>
                    <span class="text-blue-400 flex-shrink-0 ml-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 0L8.5 6.5M12 3l3.5 3.5M6 10H4a2 2 0 00-2 2v8a2 2 0 002 2h16a2 2 0 002-2v-8a2 2 0 00-2-2h-2" /></svg></span>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-300">
                    <span class="w-6 h-6 rounded-full bg-[#1f1f1f] text-[#ff4d00] flex items-center justify-center font-black text-xs flex-shrink-0">2</span>
                    <span>Wähle</span>
                    <span class="text-white bg-[#2c2c2e] rounded shadow-sm border border-gray-600 p-1 flex-shrink-0 ml-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></span>
                    <span class="font-bold text-white uppercase tracking-widest text-[10px]">Zum Home-Bildschirm</span>
                </div>
            </div>
            <button onclick="closeInstallBanner()" class="btn-grind w-full py-4 text-sm">Verstanden</button>
        </div>
    </div>
    <script>
        const ua = window.navigator.userAgent.toLowerCase();
        const isIos = /iphone|ipad|ipod/.test(ua);
        const isInStandaloneMode = () => ('standalone' in window.navigator) && window.navigator.standalone;
        const isChrome = /crios/.test(ua);
        const isSafari = !isChrome && /safari/.test(ua);
        window.closeInstallBanner = () => { localStorage.setItem('grind_install_dismissed', 'true'); document.getElementById('install-banner').classList.add('hidden'); };
        if (isIos && !isInStandaloneMode() && !localStorage.getItem('grind_install_dismissed')) {
            const step1 = document.getElementById('step1-text');
            if (isChrome) step1.innerText = 'Tippe (meist oben rechts) auf';
            else if (isSafari) step1.innerText = 'Tippe unten auf';
            setTimeout(() => { document.getElementById('install-banner').classList.remove('hidden'); }, 2000); 
        }
    </script>
</body>
</html>
