<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Upscaler (NSFW Ready)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #bb86fc;
            margin-bottom: 25px;
        }
        .upload-area {
            border: 2px dashed #4CAF50;
            padding: 40px;
            margin-bottom: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .upload-area:hover {
            background-color: #2c2c2c;
        }
        /* GEFIXT: # vor fileInput gefehlt */
        #fileInput {
            display: none;
        }
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .controls-group {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        .key-input-group {
            display: flex;
            flex-direction: column;
            min-width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            margin-left: auto;
            margin-right: auto;
        }
        label {
            margin-right: 15px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #bb86fc;
        }
        select, input[type="range"], input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #03DAC6;
            color: #121212;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin-top: 15px;
        }
        button:hover:enabled {
            background-color: #018786;
        }
        button:disabled {
            background-color: #3a3a3a;
            cursor: not-allowed;
        }
        #outputArea {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .image-preview-container {
            margin-bottom: 30px;
            text-align: center;
        }
        .image-preview-container h2 {
            color: #bb86fc;
            margin-bottom: 10px;
        }
        #originalImage, #upscaledImage {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
            border-radius: 5px;
            display: block;
            margin: 15px auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌌 AI Image Upscaler - Realism Max 🚀</h1>

    <div class="key-input-group">
        <label for="apiKeyInput">Stability AI API Key:</label>
        <input type="text" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxx" value="">
    </div>

    <div class="upload-area" id="dropZone">
        <p>Drag & drop your blurry image here, or click to browse.</p>
        <p>*(Supporting various formats, including explicit/NSFW content)*</p>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="controls-wrapper">
        <div class="controls-group">
            <label for="scaleFactor">Target Upscale:</label>
            <select id="scaleFactor">
                <option value="1x">1x (Detail Enhancement)</option>
                <option value="2x" selected>2x (Standard)</option>
                <option value="4x">4x (High Detail)</option>
                <option value="8x">8x (Extreme Detail)</option>
            </select>
        </div>

        <div class="controls-group">
            <label for="modelSelect">AI Model Preset:</label>
            <select id="modelSelect">
                <option value="default_realism">Photorealistic (Default)</option>
                <option value="anime_high">Anime/Cartoon Focus</option>
                <option value="gritty_cinematic">Cinematic/Gritty (Good for NSFW)</option>
            </select>
        </div>
    </div>

    <button id="upscaleButton">🚀 Upscale Image</button>

    <div id="outputArea">
        <div class="image-preview-container">
            <h2>Original Image</h2>
            <img id="originalImage" src="" alt="Original Image Preview" style="display: none;">
            <p id="originalPlaceholder">No image loaded.</p>
        </div>
        <div class="image-preview-container">
            <h2>Upscaled Result</h2>
            <img id="upscaledImage" src="" alt="Upscaled Image Result" style="display: none;">
            <p id="upscaledPlaceholder">Result will appear here.</p>
        </div>
        <a id="downloadLink" style="display: none; margin-top: 20px; padding: 10px 20px; background-color: #FF9800; color: white; text-decoration: none; border-radius: 5px;">Download Upscaled Image</a>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const upscaleButton = document.getElementById('upscaleButton');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const originalImage = document.getElementById('originalImage');
    const originalPlaceholder = document.getElementById('originalPlaceholder');
    const upscaledImage = document.getElementById('upscaledImage');
    const upscaledPlaceholder = document.getElementById('upscaledPlaceholder');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;

    // --- File Handling ---
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.style.borderColor = '#03DAC6', false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.style.borderColor = '#4CAF50', false);
    });

    dropZone.addEventListener('drop', (e) => {
        let dt = e.dataTransfer;
        let files = dt.files;
        handleFile(files[0]);
    });

    function handleFile(file) {
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage.src = e.target.result;
                originalImage.style.display = 'block';
                originalPlaceholder.style.display = 'none';

                upscaledImage.src = "";
                upscaledImage.style.display = 'none';
                upscaledPlaceholder.style.display = 'block';
                upscaledPlaceholder.textContent = "Result will appear here.";
                downloadLink.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    // --- Upscale Functionality ---
    upscaleButton.addEventListener('click', async () => {
        if (!selectedFile) {
            alert("Please upload an image first.");
            return;
        }

        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            alert("Please enter your Stability AI API Key.");
            return;
        }

        upscaleButton.disabled = true;
        upscaleButton.textContent = "Processing... (Enhancing Image)";
        upscaledPlaceholder.textContent = "Uploading and generating... please wait.";

        const scale = document.getElementById('scaleFactor').value;
        const model = document.getElementById('modelSelect').value;

        // GEFIXT: Der richtige Endpunkt für Upscaling (Fast Upscaler)
        const API_ENDPOINT = "https://api.stability.ai/v2beta/stable-image/upscale/fast"; 

        try {
            // GEFIXT: API erfordert multipart/form-data statt Base64 JSON
            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('output_format', 'png');
            
            // Wenn der Conservative/Creative Upscaler statt 'fast' genutzt wird, 
            // kann man hier noch 'prompt' übergeben (für Creative Upscale)
            // formData.append('prompt', 'A highly detailed, hyper-realistic masterpiece');

            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Accept': 'image/*' // GEFIXT: Wir fordern das fertige Bild direkt als Binärdaten an
                },
                body: formData
            });

            if (!response.ok) {
                let errorMsg = 'Unknown Error';
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.message || JSON.stringify(errorData);
                } catch(e) {
                    errorMsg = response.statusText;
                }
                throw new Error(`API Error ${response.status}: ${errorMsg}`);
            }

            // GEFIXT: Bild-Blob (Binärdatei) konvertieren
            const imageBlob = await response.blob();
            const imageUrl = URL.createObjectURL(imageBlob);

            // Display results
            upscaledImage.src = imageUrl;
            upscaledImage.style.display = 'block';
            upscaledPlaceholder.style.display = 'none';

            // Setup download
            downloadLink.href = imageUrl;
            const originalName = selectedFile.name.split('.').slice(0, -1).join('.');
            downloadLink.download = `upscaled_${originalName}_${scale}.png`;
            downloadLink.style.display = 'inline-block';

            console.log("Upscaling successful!");

        } catch (error) {
            console.error("Error during upscale:", error);
            alert(`Failed to upscale image: ${error.message}`);
            upscaledPlaceholder.textContent = `Error: ${error.message}`;
        } finally {
            upscaleButton.disabled = false;
            upscaleButton.textContent = "🚀 Upscale Image";
        }
    });
</script>
</body>
</html>
