<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Image Upscaler (NSFW Ready)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #4CAF50; /* Changed accent color for Gemini */
            margin-bottom: 25px;
        }
        .upload-area {
            border: 2px dashed #4CAF50;
            padding: 40px;
            margin-bottom: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .upload-area:hover {
            background-color: #2c2c2c;
        }
        #fileInput {
            display: none;
        }
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .controls-group {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        .key-input-group {
            display: flex;
            flex-direction: column;
            min-width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            margin-left: auto;
            margin-right: auto;
        }
        label {
            margin-right: 15px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #4CAF50;
        }
        select, input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #03DAC6;
            color: #121212;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin-top: 15px;
        }
        button:hover:enabled {
            background-color: #018786;
        }
        button:disabled {
            background-color: #3a3a3a;
            cursor: not-allowed;
        }
        #outputArea {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .image-preview-container {
            margin-bottom: 30px;
            text-align: center;
        }
        .image-preview-container h2 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        #originalImage, #upscaledImage {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
            border-radius: 5px;
            display: block;
            margin: 15px auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Gemini AI Image Upscaler 🚀</h1>

    <div class="key-input-group">
        <label for="apiKeyInput">Google Gemini API Key:</label>
        <input type="text" id="apiKeyInput" placeholder="AIzaSy......................" value="">
    </div>

    <div class="upload-area" id="dropZone">
        <p>Drag & drop your blurry image here, or click to browse.</p>
        <p>*(Supporting various formats via Gemini Multimodal)*</p>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="controls-wrapper">
        <div class="controls-group">
            <label for="scaleFactor">Target Upscale:</label>
            <select id="scaleFactor">
                <option value="1x">1x (Detail Enhancement)</option>
                <option value="2x" selected>2x (Standard)</option>
                <option value="4x">4x (High Detail)</option>
                <option value="8x">8x (Extreme Detail)</option>
            </select>
        </div>

        <div class="controls-group">
            <label for="modelSelect">AI Model Preset:</label>
            <select id="modelSelect">
                <option value="Photorealistic (Default)">Photorealistic (Default)</option>
                <option value="Anime/Cartoon Focus">Anime/Cartoon Focus</option>
                <option value="Cinematic/Gritty">Cinematic/Gritty (Good for NSFW)</option>
            </select>
        </div>
    </div>

    <button id="upscaleButton">🚀 Upscale Image with Gemini</button>

    <div id="outputArea">
        <div class="image-preview-container">
            <h2>Original Image</h2>
            <img id="originalImage" src="" alt="Original Image Preview" style="display: none;">
            <p id="originalPlaceholder">No image loaded.</p>
        </div>
        <div class="image-preview-container">
            <h2>Upscaled Result</h2>
            <img id="upscaledImage" src="" alt="Upscaled Image Result" style="display: none;">
            <p id="upscaledPlaceholder">Result will appear here.</p>
        </div>
        <a id="downloadLink" style="display: none; margin-top: 20px; padding: 10px 20px; background-color: #FF9800; color: white; text-decoration: none; border-radius: 5px;">Download Upscaled Image</a>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const upscaleButton = document.getElementById('upscaleButton');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const originalImage = document.getElementById('originalImage');
    const originalPlaceholder = document.getElementById('originalPlaceholder');
    const upscaledImage = document.getElementById('upscaledImage');
    const upscaledPlaceholder = document.getElementById('upscaledPlaceholder');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;
    let selectedMimeType = null;

    // --- File Handling ---
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.style.borderColor = '#03DAC6', false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.style.borderColor = '#4CAF50', false);
    });

    dropZone.addEventListener('drop', (e) => {
        handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (file) {
            selectedFile = file;
            selectedMimeType = file.type;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage.src = e.target.result;
                originalImage.style.display = 'block';
                originalPlaceholder.style.display = 'none';

                upscaledImage.src = "";
                upscaledImage.style.display = 'none';
                upscaledPlaceholder.style.display = 'block';
                upscaledPlaceholder.textContent = "Result will appear here.";
                downloadLink.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    // --- Gemini API Upscale Functionality ---
    upscaleButton.addEventListener('click', async () => {
        if (!selectedFile) {
            alert("Please upload an image first.");
            return;
        }

        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            alert("Please enter your Google Gemini API Key.");
            return;
        }

        upscaleButton.disabled = true;
        upscaleButton.textContent = "Processing with Gemini... 🪄";
        upscaledPlaceholder.textContent = "Uploading and generating... this may take a few seconds.";

        const scaleText = document.getElementById('scaleFactor').options[document.getElementById('scaleFactor').selectedIndex].text;
        const modelStyle = document.getElementById('modelSelect').value;

        // Nutzt standardmäßig das multimodale Gemini Modell (z.B. gemini-2.5-flash oder gemini-1.5-pro)
        const MODEL_NAME = "gemini-2.0-flash"; // Falls dieses streikt, zu "gemini-1.5-pro-latest" ändern
        const API_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`; 

        try {
            const reader = new FileReader();
            reader.readAsDataURL(selectedFile);
            
            reader.onload = async (e) => {
                // Nur den reinen Base64 String extrahieren (ohne 'data:image/jpeg;base64,')
                const base64Image = e.target.result.split(',')[1];

                // Dynamischer Prompt basierend auf der 3er-Auswahl
                const promptText = `Analyze this image and recreate an enhanced, upscaled version of it. 
                Target Enhancement: ${scaleText}. 
                Visual Style: ${modelStyle}. 
                Focus on high quality, hyper-realistic details, and maximum sharpness. Return ONLY the enhanced image, no text.`;

                // Gemini Payload mit deaktivierten Safety-Settings für NSFW-Unterstützung
                const payload = {
                    contents: [{
                        parts: [
                            { text: promptText },
                            {
                                inlineData: {
                                    mimeType: selectedMimeType,
                                    data: base64Image
                                }
                            }
                        ]
                    }],
                    // Safety Settings komplett freischalten (NSFW Ready)
                    safetySettings: [
                        { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                    ]
                };

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error ? data.error.message : `API Error ${response.status}`);
                }

                // Versuchen das Bild aus der Antwort von Gemini zu extrahieren
                let base64Output = null;
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    for (const part of data.candidates[0].content.parts) {
                        if (part.inlineData && part.inlineData.data) {
                            base64Output = part.inlineData.data;
                            break;
                        }
                    }
                }

                if (base64Output) {
                    // Erfolgreich ein Bild von Gemini erhalten!
                    const imageUrl = `data:image/png;base64,${base64Output}`;
                    
                    upscaledImage.src = imageUrl;
                    upscaledImage.style.display = 'block';
                    upscaledPlaceholder.style.display = 'none';

                    const originalName = selectedFile.name.split('.').slice(0, -1).join('.');
                    downloadLink.href = imageUrl;
                    downloadLink.download = `gemini_upscaled_${originalName}.png`;
                    downloadLink.style.display = 'inline-block';
                    
                } else {
                    // Falls Gemini nur Text zurückgibt (z.B. wegen Account/Model Limitierungen)
                    const fallbackText = data.candidates[0].content.parts[0].text;
                    throw new Error("Gemini returned text instead of an image. Response: " + fallbackText);
                }
            };
        } catch (error) {
            console.error("Error during upscale:", error);
            alert(`Failed to upscale: ${error.message}`);
            upscaledPlaceholder.textContent = `Error: ${error.message}`;
        } finally {
            upscaleButton.disabled = false;
            upscaleButton.textContent = "🚀 Upscale Image with Gemini";
        }
    });
</script>
</body>
</html>
