
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIND. | Creator Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font vorladen für den Canvas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            overflow: hidden; 
        }

        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: #0a0a0a; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: #ff4d00; }

        .btn-primary { 
            background: #ffffff; color: #000000; font-weight: 900; text-transform: uppercase; 
            padding: 16px 24px; font-size: 14px; transition: all 0.2s ease; 
            border-radius: 4px; letter-spacing: 0.05em; display: inline-block; text-align: center; cursor: pointer;
            border: none;
        }
        .btn-primary:hover { background: #ff4d00; color: #ffffff; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,77,0,0.4); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row antialiased">

    <!-- LINKE SEITE: Controls / Editor -->
    <div class="w-full md:w-[400px] bg-[#0a0a0a] border-r border-[#1f1f1f] flex flex-col h-[50%] md:h-full z-20 shadow-2xl">
        
        <div class="p-5 border-b border-[#1f1f1f] bg-[#050505] flex justify-between items-center">
            <h1 class="text-xl font-black italic tracking-tighter">GRIND<span class="text-[#ff4d00]">.</span> <span class="text-gray-500 text-xs tracking-widest uppercase ml-2 not-italic">Creator</span></h1>
        </div>

        <div class="flex-1 overflow-y-auto sidebar-scroll p-6 flex flex-col gap-6">
            
            <!-- Format Auswahl (NEU) -->
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Instagram Format</label>
                <div class="flex gap-2">
                    <button onclick="setFormat('square')" id="btn-format-square" class="flex-1 py-2 bg-[#1f1f1f] border border-[#ff4d00] text-[#ff4d00] text-[11px] font-bold uppercase rounded transition">1:1 (Quadrat)</button>
                    <button onclick="setFormat('portrait')" id="btn-format-portrait" class="flex-1 py-2 bg-[#111] border border-[#333] text-gray-400 text-[11px] font-bold uppercase rounded hover:bg-[#1f1f1f] transition">4:5 (Portrait)</button>
                </div>
            </div>

            <!-- Text Ausrichtung -->
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Text Ausrichtung</label>
                <div class="flex gap-2">
                    <button onclick="setLayout('left')" id="btn-layout-left" class="flex-1 py-2 bg-[#1f1f1f] border border-[#ff4d00] text-[#ff4d00] text-[11px] font-bold uppercase rounded transition">Links</button>
                    <button onclick="setLayout('center')" id="btn-layout-center" class="flex-1 py-2 bg-[#111] border border-[#333] text-gray-400 text-[11px] font-bold uppercase rounded hover:bg-[#1f1f1f] transition">Zentriert</button>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Tagline (Orange)</label>
                <input type="text" id="input-tag" value="SYSTEM UPDATE" oninput="drawCanvas()" class="w-full bg-[#111] border border-[#333] rounded px-4 py-3 text-sm text-white focus:outline-none focus:border-[#ff4d00] uppercase tracking-widest font-bold">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Headline</label>
                <textarea id="input-headline" rows="3" oninput="drawCanvas()" class="w-full bg-[#111] border border-[#333] rounded px-4 py-3 text-sm text-white focus:outline-none focus:border-[#ff4d00] font-black italic tracking-tighter uppercase resize-none">NO EXCUSES.
JUST EXECUTION.</textarea>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Body Text</label>
                <textarea id="input-body" rows="4" oninput="drawCanvas()" class="w-full bg-[#111] border border-[#333] rounded px-4 py-3 text-sm text-gray-300 focus:outline-none focus:border-[#ff4d00] resize-none leading-relaxed">Wenn der Wecker klingelt, hast du zwei Optionen: Weiterschlafen und träumen, oder aufstehen und deine Ziele jagen. Das Network belohnt die, die den Grind durchziehen.</textarea>
            </div>

        </div>

        <div class="p-5 border-t border-[#1f1f1f] bg-[#050505]">
            <button onclick="exportPost()" class="btn-primary w-full flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Post Exportieren
            </button>
        </div>

    </div>

    <!-- RECHTE SEITE: Live Canvas Vorschau -->
    <div class="flex-1 bg-[#1a1a1a] relative flex items-center justify-center p-4 md:p-8 h-[50%] md:h-full bg-[radial-gradient(#333_1px,transparent_1px)] [background-size:20px_20px]">
        <!-- Das Canvas-Element, responsive skaliert per CSS -->
        <canvas id="creator-canvas" width="1080" height="1080" class="max-w-full max-h-full object-contain shadow-[0_0_50px_rgba(0,0,0,0.8)] rounded-sm border border-[#333]"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('creator-canvas');
        const ctx = canvas.getContext('2d');
        let currentLayout = 'left';
        let currentFormat = 'square'; // 'square' (1:1) oder 'portrait' (4:5)

        // Stellt sicher, dass der Font geladen ist, bevor gezeichnet wird
        document.fonts.ready.then(() => {
            setTimeout(drawCanvas, 100); // Kurzer Delay stellt sicher, dass die Font-Engine 100% bereit ist
        });

        function setFormat(format) {
            currentFormat = format;
            const btnSquare = document.getElementById('btn-format-square');
            const btnPortrait = document.getElementById('btn-format-portrait');

            if (format === 'portrait') {
                canvas.height = 1350; // 4:5 Instagram Format
                btnPortrait.className = "flex-1 py-2 bg-[#1f1f1f] border border-[#ff4d00] text-[#ff4d00] text-[11px] font-bold uppercase rounded transition";
                btnSquare.className = "flex-1 py-2 bg-[#111] border border-[#333] text-gray-400 text-[11px] font-bold uppercase rounded hover:bg-[#1f1f1f] transition";
            } else {
                canvas.height = 1080; // 1:1 Instagram Quadrat
                btnSquare.className = "flex-1 py-2 bg-[#1f1f1f] border border-[#ff4d00] text-[#ff4d00] text-[11px] font-bold uppercase rounded transition";
                btnPortrait.className = "flex-1 py-2 bg-[#111] border border-[#333] text-gray-400 text-[11px] font-bold uppercase rounded hover:bg-[#1f1f1f] transition";
            }
            drawCanvas();
        }

        function setLayout(style) {
            currentLayout = style;
            const btnLeft = document.getElementById('btn-layout-left');
            const btnCenter = document.getElementById('btn-layout-center');

            if (style === 'center') {
                btnCenter.className = "flex-1 py-2 bg-[#1f1f1f] border border-[#ff4d00] text-[#ff4d00] text-[11px] font-bold uppercase rounded transition";
                btnLeft.className = "flex-1 py-2 bg-[#111] border border-[#333] text-gray-400 text-[11px] font-bold uppercase rounded hover:bg-[#1f1f1f] transition";
            } else {
                btnLeft.className = "flex-1 py-2 bg-[#1f1f1f] border border-[#ff4d00] text-[#ff4d00] text-[11px] font-bold uppercase rounded transition";
                btnCenter.className = "flex-1 py-2 bg-[#111] border border-[#333] text-gray-400 text-[11px] font-bold uppercase rounded hover:bg-[#1f1f1f] transition";
            }
            drawCanvas();
        }

        // Hilfsfunktion: Berechnet die Höhe des Textes mit Zeilenumbrüchen
        function measureWrappedTextHeight(text, maxWidth, lineHeight, font) {
            if (!text) return 0;
            ctx.font = font;
            const paragraphs = text.split('\n');
            let height = 0;
            for(let p = 0; p < paragraphs.length; p++) {
                const words = paragraphs[p].split(' ');
                let line = '';
                for(let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        height += lineHeight;
                        line = words[n] + ' ';
                    } else {
                        line = testLine;
                    }
                }
                height += lineHeight;
            }
            return height;
        }

        // Hilfsfunktion: Zeichnet Text mit automatischen Zeilenumbrüchen
        function drawWrappedText(text, x, y, maxWidth, lineHeight) {
            if (!text) return y;
            const paragraphs = text.split('\n');
            let currentY = y;
            for(let p = 0; p < paragraphs.length; p++) {
                const words = paragraphs[p].split(' ');
                let line = '';
                for(let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line.trim(), x, currentY);
                        line = words[n] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line.trim(), x, currentY);
                currentY += lineHeight;
            }
            return currentY;
        }

        function drawCanvas() {
            const W = canvas.width;
            const H = canvas.height;

            // 1. Hintergrund zeichnen
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, W, H);

            // Radialer Verlauf
            const bgGradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.8);
            bgGradient.addColorStop(0, '#120600');
            bgGradient.addColorStop(1, '#050505');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, W, H);

            // Subtiles Raster / Noise
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            for(let i = 0; i <= W; i += 100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
            for(let i = 0; i <= H; i += 100) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

            // Mittlerer Oranger Glow
            const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.5);
            glow.addColorStop(0, 'rgba(255, 77, 0, 0.15)');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, W, H);

            // 2. Eingaben auslesen
            const tag = document.getElementById('input-tag').value.trim().toUpperCase();
            const head = document.getElementById('input-headline').value.trim().toUpperCase();
            const body = document.getElementById('input-body').value.trim();

            const isCenter = currentLayout === 'center';
            const startX = isCenter ? W / 2 : 120;
            const maxWidth = W - 240; // 120px Abstand links und rechts

            // 3. Totale Texthöhe berechnen (Für perfekte vertikale Zentrierung)
            let totalHeight = 0;
            const tagFont = '900 24px "Inter"';
            const headFont = 'italic 900 110px "Inter"';
            const bodyFont = '500 36px "Inter"';

            if (tag) totalHeight += 24 + 30; // 24px höhe + 30px gap
            if (head) totalHeight += measureWrappedTextHeight(head, maxWidth, 100, headFont) + 50; // gap 50
            if (body) totalHeight += measureWrappedTextHeight(body, maxWidth, 56, bodyFont);

            // Startpunkt Y berechnen: Gesamthöhe - Footer(180) zentriert
            let currentY = ((H - 180) / 2) - (totalHeight / 2);

            // 4. Text Zeichnen
            ctx.textAlign = isCenter ? 'center' : 'left';
            ctx.textBaseline = 'top';

            // Tagline
            if (tag) {
                ctx.font = tagFont;
                ctx.fillStyle = '#ff4d00';
                if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '8px';
                ctx.fillText(tag, startX, currentY);
                if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
                currentY += 54; 
            }

            // Headline
            if (head) {
                ctx.font = headFont;
                ctx.fillStyle = '#ffffff';
                if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '-2px';
                
                // Schatten für Tiefe
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 40;
                ctx.shadowOffsetY = 10;
                
                currentY = drawWrappedText(head, startX, currentY, maxWidth, 100);
                
                ctx.shadowColor = 'transparent'; // Reset Shadow
                if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
                currentY += 50;
            }

            // Body
            if (body) {
                ctx.font = bodyFont;
                ctx.fillStyle = '#cccccc';
                drawWrappedText(body, startX, currentY, maxWidth, 56);
            }

            // 5. Footer Zeichnen (Fixiert unten)
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            
            // "LEVEL UP YOUR LIFE" Subtitle
            ctx.font = '700 18px "Inter"';
            ctx.fillStyle = '#666666';
            if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '6px';
            ctx.fillText('LEVEL UP YOUR LIFE', 120, H - 130);
            if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';

            // "GRIND." Logo
            ctx.font = 'italic 900 46px "Inter"';
            const textGrind = 'GRIND';
            const textDot = '.';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(textGrind, 120, H - 80);
            const wGrind = ctx.measureText(textGrind).width;
            ctx.fillStyle = '#ff4d00';
            ctx.fillText(textDot, 120 + wGrind, H - 80);

            // Icon rechts unten (Kreis mit Pfeil)
            const cx = W - 120 - 32; // X Zentrum (Rechter Rand - Margin - Radius)
            const cy = H - 80 - 24;  // Y Zentrum
            
            ctx.strokeStyle = '#ff4d00';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy, 32, 0, Math.PI * 2);
            ctx.stroke();

            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            // Pfeil zeichnen
            ctx.moveTo(cx - 8, cy + 8);
            ctx.lineTo(cx + 8, cy - 8);
            ctx.moveTo(cx - 2, cy - 8);
            ctx.lineTo(cx + 8, cy - 8);
            ctx.lineTo(cx + 8, cy + 2);
            ctx.stroke();
        }

        // --- Export / Share Logik ---
        function exportPost() {
            canvas.toBlob(async (blob) => {
                if (!blob) return alert("Fehler bei der Bildgenerierung."); 
                
                const fileName = `GRIND_POST_${currentFormat}_${Date.now()}.png`;
                const file = new File([blob], fileName, { type: 'image/png' });
                
                const fallbackDownload = () => { 
                    const link = document.createElement('a'); 
                    link.download = fileName; 
                    link.href = canvas.toDataURL('image/png'); 
                    link.click(); 
                };
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) { 
                    try { 
                        await navigator.share({ 
                            files: [file], 
                            title: 'GRIND.', 
                            text: 'Join the Hustle.' 
                        }); 
                    } catch (err) { 
                        if (err.name !== 'AbortError') fallbackDownload(); 
                    } 
                } else { 
                    fallbackDownload(); 
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
