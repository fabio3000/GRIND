<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIND. | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-9tSrke72PouQMnMX-a7eZSW0jkFMBWY&libraries=places&callback=initGooglePlaces" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            min-height: 100vh;
        }
        
        .grind-gradient { background: linear-gradient(90deg, #ff4d00, #ff8800); }
        .card { background: #0f0f0f; border: 1px solid #1f1f1f; }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { pointer-events: auto; background: #0a0a0a; border: 1px solid #1f1f1f; color: white; padding: 16px 24px; border-radius: 4px; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 12px; }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid #ff4d00; }
        .toast.error { border-left: 4px solid #dc2626; }
        .toast.info { border-left: 4px solid #3b82f6; }
        
        .btn-grind { background: white; color: black; font-weight: 900; font-style: italic; text-transform: uppercase; padding: 12px 24px; font-size: 12px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(255,255,255,0.1); cursor: pointer; border-radius: 4px; border: none; }
        .btn-grind:hover { background: #ff4d00; color: white; box-shadow: 0 4px 20px rgba(255, 77, 0, 0.4); }
        .btn-grind:disabled { background: #1f1f1f; color: #555; cursor: not-allowed; box-shadow: none; border-color: #1f1f1f; }
        
        .admin-tab { padding: 12px 24px; font-size: 10px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.1em; border-bottom: 2px solid transparent; color: #666; cursor: pointer; transition: all 0.3s; }
        .admin-tab.active { color: #ff4d00; border-bottom-color: #ff4d00; }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #050505; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #ff4d00; }
    </style>
</head>
<body class="flex flex-col relative">

    <div id="toast-container"></div>
    <div id="recaptcha-container"></div>
    
    <div id="app" class="flex-1 flex flex-col w-full z-10 relative pb-24">
        <div class="flex-1 flex items-center justify-center min-h-[60vh]"><div class="w-16 h-16 border-t-4 border-l-4 border-[#ff4d00] rounded-full animate-spin"></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDoc, deleteDoc, updateDoc, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyDtwsvmYSONjFufhbJ5I8G_RAMffnh7re0",
            authDomain: "theplot-app.firebaseapp.com",
            projectId: "theplot-app",
            storageBucket: "theplot-app.firebasestorage.app",
            messagingSenderId: "550703275210",
            appId: "1:550703275210:web:81bc0e5a373f87a3c92833"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        // --- 2. STATE MANAGEMENT ---
        let state = {
            user: null, profile: null, view: 'loading',
            authStep: 'phone', tempPhone: '',
            adminTab: 'control', adminEditWeek: 1, announcements: null, 
            pendingProofs: [], weeklyData: {}, rewardData: [], habitData: [], activeSpots: [],
            rewardBackup: null, tempAiContent: null,
            seasonConfig: { number: 1, active: true, start: '', end: '' }
        };

        let isSubscribed = false;

        // --- 3. UTILS ---
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div'); toast.className = `toast ${type}`;
            const icon = type === 'error' ? `<svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` : `<svg class="w-5 h-5 text-[#ff4d00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            toast.innerHTML = `${icon} <div><div class="font-black text-[10px] uppercase tracking-widest text-gray-400 mb-0.5">System</div><div>${msg}</div></div>`;
            container.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4000);
        };

        function safeRender(force = false) {
            const active = document.activeElement;
            const isTyping = !force && active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
            if (!isTyping) {
                render();
            }
        }

        const getActiveWeek = () => {
            if(!state.seasonConfig || !state.seasonConfig.start) return 1;
            const now = new Date();
            const start = new Date(state.seasonConfig.start);
            if(now < start) return 1;
            let firstSunday = new Date(start.getFullYear(), start.getMonth(), 1);
            while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate() + 1);
            firstSunday.setHours(23, 59, 59, 999);
            if (now.getTime() <= firstSunday.getTime()) return 1;
            const diffTime = now.getTime() - firstSunday.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
            let week = 2 + Math.floor(diffDays / 7);
            return Math.max(1, Math.min(week, 12));
        };

        // --- 4. AUTH & DATEN-LISTENER ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                state.user = user;
                onSnapshot(doc(db, 'plot_users', user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const profile = docSnap.data();
                        if (profile.isAdmin) {
                            state.profile = profile; 
                            state.view = 'admin';
                            
                            if(!isSubscribed) {
                                isSubscribed = true;
                                
                                onSnapshot(doc(db, 'system', 'grind_season'), (sSnap) => {
                                    if (sSnap.exists()) {
                                        const data = sSnap.data();
                                        state.weeklyData = data.weeklyData || {}; 
                                        state.rewardData = data.rewardData || [];
                                        state.habitData = data.habitData || [];
                                        state.activeSpots = data.activeSpots || [];
                                        state.rewardBackup = data.rewardBackup || null;
                                        state.seasonConfig = data.seasonConfig || { number: 1, active: true, start: '', end: '' };
                                        
                                        const curW = getActiveWeek();
                                        if (state.adminEditWeek < 1 || state.adminEditWeek > 12) state.adminEditWeek = curW;

                                        if(state.view === 'admin') safeRender(true);
                                    } else {
                                        setDoc(doc(db, 'system', 'grind_season'), { weeklyData: {}, rewardData: [], habitData: [], activeSpots: [], seasonConfig: state.seasonConfig }, { merge: true });
                                        if(state.view === 'admin') safeRender(true);
                                    }
                                });

                                onSnapshot(collection(db, 'plot_pending_proofs'), (pSnap) => {
                                    state.pendingProofs = pSnap.docs.map(d => ({id: d.id, ...d.data()}));
                                    if(state.view === 'admin') safeRender(true);
                                });
                            }
                            safeRender(true); 
                        } else { state.view = 'denied'; render(); }
                    } else { state.view = 'denied'; render(); }
                });
            } else { state.user = null; state.profile = null; state.view = 'auth'; state.authStep = 'phone'; render(); }
        });

        window.setAdminTab = (tab) => {
            state.adminTab = tab;
            if (tab === 'announcements' && state.announcements == null) {
                window.loadAnnouncementsList();
            }
            render();
        };
        window.setAdminEditWeek = (week) => { state.adminEditWeek = week; render(); };
        window.handleLogout = () => { state.view = 'loading'; render(); signOut(auth); };

        // --- 5. SEASON CONFIG ---
        window.saveSeasonSetup = async (e) => {
            e.preventDefault();
            const config = {
                number: parseInt(document.getElementById('cfg_num').value) || 1,
                start: document.getElementById('cfg_start').value,
                end: document.getElementById('cfg_end').value,
                active: document.getElementById('cfg_active').value === 'true'
            };
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Speichern...";
            try {
                await setDoc(doc(db, 'system', 'grind_season'), { seasonConfig: config }, { merge: true });
                window.showToast("Season Setup erfolgreich gespeichert.", "success");
            } catch(err) { window.showToast("Fehler beim Speichern des Setups.", "error"); } 
            finally { btn.innerText = "Config Speichern"; }
        };

        // --- 6. PROOF MANAGEMENT & AI CHECK ---
        window.acceptProof = async (proofId, uid, mid, xp) => {
            try {
                const proof = state.pendingProofs.find(p => p.id === proofId) || {};
                const submissionDate = proof.submissionDate || new Date().toISOString().split('T')[0];
                
                const userRef = doc(db, 'plot_users', uid); const snap = await getDoc(userRef);
                if(snap.exists()) {
                    const data = snap.data(); 
                    const isRepeatable = String(mid).startsWith('rep_');
                    let finalXp = xp; let updateData = {}; let newCompleted = [...(data.completed || [])];
                    
                    if (isRepeatable) {
                        const habit = state.habitData.find(h => h.id === mid);
                        const streakBonus = habit ? (parseInt(habit.streakBonus) || 0) : 0;
                        const streaks = data.streaks || {};
                        const habitStreak = streaks[mid] || { streak: 0, lastDate: '', lastTimestamp: 0 };
                        
                        let newStreak = 1;
                        if (habitStreak.lastDate) {
                            const sub = new Date(submissionDate);
                            const last = new Date(habitStreak.lastDate);
                            const diffDays = Math.round(Math.abs((sub - last) / (1000 * 60 * 60 * 24)));
                            if (diffDays === 0) newStreak = habitStreak.streak; 
                            else if (diffDays === 1) newStreak = habitStreak.streak + 1;
                            else newStreak = 1;
                        }
                        
                        if (habitStreak.lastDate !== submissionDate) {
                            streaks[mid] = { streak: newStreak, lastDate: submissionDate, lastTimestamp: Date.now() };
                            updateData.streaks = streaks;
                            
                            if (habit && (habit.frequency === 'weekly_streak' || habit.frequency === 'weekly')) {
                                finalXp = xp + (newStreak > 0 && newStreak % 7 === 0 ? streakBonus : 0);
                            } else {
                                finalXp = xp + (newStreak > 1 ? (newStreak - 1) * streakBonus : 0);
                            }
                        } else {
                            finalXp = 0;
                        }
                    } else {
                        if (!newCompleted.includes(mid)) newCompleted.push(mid);
                        else finalXp = 0;
                    }
                    
                    if (finalXp > 0 || Object.keys(updateData).length > 0) {
                        const newXp = (data.xp || 0) + finalXp;
                        updateData.xp = newXp;
                        updateData.lvl = Math.floor(newXp / 1000) + 1;
                        updateData.completed = newCompleted;
                        await setDoc(userRef, updateData, { merge: true });
                    }
                }
                await deleteDoc(doc(db, 'plot_pending_proofs', proofId));
                window.showToast("Proof akzeptiert. XP & Streaks aktualisiert.", "success");
            } catch(e) { window.showToast("Fehler bei Akzeptanz.", "error"); }
        };

        window.rejectProof = async (proofId) => {
            try { await deleteDoc(doc(db, 'plot_pending_proofs', proofId)); window.showToast("Proof gelöscht.", "info"); } 
            catch(e) { window.showToast("Fehler bei Ablehnung.", "error"); }
        };

        window.aiCheckProof = async (proofId) => {
            const proof = state.pendingProofs.find(p => p.id === proofId);
            if(!proof) return window.showToast("Beweis nicht gefunden.", "error");

            const btn = document.getElementById(`ai_btn_${proofId}`);
            const resDiv = document.getElementById(`ai_res_${proofId}`);
            if(btn) btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>`;
            
            try {
                const apiKey = ""; // Wird von der Runtime-Umgebung automatisch gefüllt
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                let contents = [];

                if (proof.type === 'upload') {
                    const base64Data = proof.data.split(',')[1];
                    const mimeType = proof.data.split(';')[0].split(':')[1];
                    contents = [{
                        parts: [
                            { text: `Prüfe dieses Beweisfoto für die Fitness-Mission: "${proof.missionName}". Ist das ein authentischer Beweis für diese Herausforderung? Antworte kurz mit "JA:" oder "NEIN:" und einem Satz Begründung.` },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }];
                } else {
                    contents = [{ parts: [{ text: `Macht der eingereichte QR/Barcode "${proof.data}" Sinn für die Aufgabe "${proof.missionName}"? Antworte kurz mit JA oder NEIN und Begründung.` }] }];
                }

                const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents }) });
                if (!res.ok) throw new Error("API Fetch failed");
                const resData = await res.json();
                const text = resData.candidates?.[0]?.content?.parts?.[0]?.text;

                if(text) {
                    resDiv.innerHTML = `<span class="font-bold">🤖 KI Coach:</span> ${text}`;
                    resDiv.classList.remove('hidden');
                }
            } catch (err) { window.showToast("KI Analyse fehlgeschlagen.", "error"); } 
            finally { if(btn) btn.innerHTML = `🤖`; }
        };

        // --- 7. MANUAL MISSION & HABIT & SPOTS CONTROL ---
        window.initGooglePlaces = () => {
            window._googlePlacesReady = true;
            document.querySelectorAll('.geo-search-input').forEach(input => window.attachPlacesAutocomplete(input));
        };

        window.attachPlacesAutocomplete = (input) => {
            if (!window.google || !window.google.maps || !window.google.maps.places) return;
            const ac = new google.maps.places.Autocomplete(input, {
                types: ['establishment', 'geocode'],
                componentRestrictions: { country: 'de' },
                fields: ['name', 'geometry', 'formatted_address']
            });
            const pacStyle = document.getElementById('pac-dark-style');
            if (!pacStyle) {
                const s = document.createElement('style');
                s.id = 'pac-dark-style';
                s.textContent = `.pac-container{background:#0a0a0a!important;border:1px solid #1f1f1f!important;border-top:none!important;font-family:Inter,sans-serif!important;z-index:99999!important}.pac-item{background:#0a0a0a!important;color:#9ca3af!important;border-top:1px solid #1f1f1f!important;padding:8px 12px!important;cursor:pointer!important;font-size:12px!important}.pac-item:hover,.pac-item-selected{background:#1f1f1f!important}.pac-item-query{color:#fff!important;font-weight:900!important}.pac-icon{display:none!important}.pac-matched{color:#ff4d00!important}`;
                document.head.appendChild(s);
            }
            ac.addListener('place_changed', () => {
                const place = ac.getPlace();
                if (!place.geometry) return;
                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();
                const container = input.closest('[data-geo-container]');
                if (container) {
                    const latIn = container.querySelector('[data-lat-input]');
                    const lngIn = container.querySelector('[data-lng-input]');
                    if (latIn) latIn.value = lat.toFixed(7);
                    if (lngIn) lngIn.value = lng.toFixed(7);
                    const conf = container.querySelector('[data-geo-confirm]');
                    if (conf) {
                        conf.textContent = '✓ ' + (place.name || place.formatted_address) + ' · ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
                        conf.style.display = 'block';
                    }
                }
            });
        };

        const _attachNewGeoInputs = () => {
            if (!window._googlePlacesReady) return;
            document.querySelectorAll('.geo-search-input:not([data-ac-attached])').forEach(input => {
                input.setAttribute('data-ac-attached', '1');
                window.attachPlacesAutocomplete(input);
            });
        };

        window.addManualMission = async (e) => {
            const type = document.getElementById('new_mis_type').value;
            const latVal = parseFloat(document.getElementById('new_mis_lat')?.value) || null;
            const lngVal = parseFloat(document.getElementById('new_mis_lng')?.value) || null;
            const newMission = { 
                id: 'm_' + Date.now(), 
                name: document.getElementById('new_mis_name').value, 
                desc: document.getElementById('new_mis_desc').value, 
                xp: parseInt(document.getElementById('new_mis_xp').value), 
                type: type,
                qr_solution: type === 'qr' ? document.getElementById('new_mis_qr_solution').value.trim() : '',
                lat: (type === 'qr' && latVal) ? latVal : null,
                lng: (type === 'qr' && lngVal) ? lngVal : null
            };
            const updatedWeekly = JSON.parse(JSON.stringify(state.weeklyData));
            if(!updatedWeekly[state.adminEditWeek]) updatedWeekly[state.adminEditWeek] = { title: "Woche " + state.adminEditWeek, missions: [] };
            if(!updatedWeekly[state.adminEditWeek].missions) updatedWeekly[state.adminEditWeek].missions = [];
            updatedWeekly[state.adminEditWeek].missions.push(newMission);
            
            try {
                await setDoc(doc(db, 'system', 'grind_season'), { weeklyData: updatedWeekly }, { merge: true });
                window.showToast("Drop live geschaltet.", "success");
                document.getElementById('new_mis_name').value = ''; document.getElementById('new_mis_desc').value = '';
                document.getElementById('new_mis_xp').value = ''; document.getElementById('new_mis_qr_solution').value = '';
            } catch(err) { window.showToast("Fehler beim Speichern.", "error"); }
        };

        window.deleteMission = async (week, missionId) => {
            if(!confirm("Drop wirklich löschen?")) return;
            const updatedWeekly = JSON.parse(JSON.stringify(state.weeklyData));
            updatedWeekly[week].missions = updatedWeekly[week].missions.filter(m => m.id !== missionId);
            await setDoc(doc(db, 'system', 'grind_season'), { weeklyData: updatedWeekly }, { merge: true });
            window.showToast("Drop entfernt.", "success");
        };

        window.addManualHabit = async (e) => {
            const type = document.getElementById('new_hab_type').value;
            const freq = document.getElementById('new_hab_freq').value;
            const latVal = parseFloat(document.getElementById('new_hab_lat')?.value) || null;
            const lngVal = parseFloat(document.getElementById('new_hab_lng')?.value) || null;
            const newHabit = { 
                id: 'rep_' + Date.now(), 
                name: document.getElementById('new_hab_name').value, 
                desc: document.getElementById('new_hab_desc').value, 
                xp: parseInt(document.getElementById('new_hab_xp').value), 
                streakBonus: freq !== 'daily' ? (parseInt(document.getElementById('new_hab_streak').value) || 0) : 0,
                endDate: document.getElementById('new_hab_end').value,
                frequency: freq,
                type: type,
                qr_solution: type === 'qr' ? document.getElementById('new_hab_qr').value.trim() : '',
                lat: (type === 'qr' && latVal) ? latVal : null,
                lng: (type === 'qr' && lngVal) ? lngVal : null
            };
            const updatedHabits = JSON.parse(JSON.stringify(state.habitData));
            updatedHabits.push(newHabit);
            
            try {
                await setDoc(doc(db, 'system', 'grind_season'), { habitData: updatedHabits }, { merge: true });
                window.showToast("Core Routine live geschaltet.", "success");
                e.target.reset(); document.getElementById('new_hab_qr').style.display = 'none';
                document.getElementById('new_hab_geo').style.display = 'none';
                document.getElementById('streak_wrapper').style.display = 'none';
                document.getElementById('xp_wrapper').className = 'w-full transition-all';
            } catch(err) { window.showToast("Fehler beim Speichern.", "error"); }
        };

        window.deleteHabit = async (habitId) => {
            if(!confirm("Routine wirklich löschen?")) return;
            const updatedHabits = state.habitData.filter(h => h.id !== habitId);
            await setDoc(doc(db, 'system', 'grind_season'), { habitData: updatedHabits }, { merge: true });
            window.showToast("Routine entfernt.", "success");
        };

        // --- ADD LOCAL SPOTS FUNCTIONS HERE ---
        window.addSpot = async (e) => {
            const icon = document.getElementById('new_spot_icon').value.trim() || '📍';
            const name = document.getElementById('new_spot_name').value.trim();
            const subtitle = document.getElementById('new_spot_subtitle').value.trim();
            const latVal = document.getElementById('new_spot_lat').value;
            const lngVal = document.getElementById('new_spot_lng').value;
            const xp = parseInt(document.getElementById('new_spot_xp').value) || 0;
            const theme = document.getElementById('new_spot_theme').value;

            let color = '#ffffff';
            if (theme === 'orange') color = '#ff4d00';
            else if (theme === 'blue') color = '#3b82f6';
            else if (theme === 'purple') color = '#a855f7';

            const newSpot = { 
                id: 'spot_' + Date.now(), 
                icon, name, subtitle, xp, theme, color,
                lat: latVal ? parseFloat(latVal) : null,
                lng: lngVal ? parseFloat(lngVal) : null
            };

            const updatedSpots = JSON.parse(JSON.stringify(state.activeSpots || []));
            updatedSpots.push(newSpot);
            
            try {
                await setDoc(doc(db, 'system', 'grind_season'), { activeSpots: updatedSpots }, { merge: true });
                window.showToast("Local Spot live geschaltet.", "success");
                e.target.reset();
            } catch(err) { window.showToast("Fehler beim Speichern.", "error"); }
        };

        window.deleteSpot = async (spotId) => {
            if(!confirm("Spot wirklich löschen?")) return;
            const updatedSpots = (state.activeSpots || []).filter(s => s.id !== spotId);
            try {
                await setDoc(doc(db, 'system', 'grind_season'), { activeSpots: updatedSpots }, { merge: true });
                window.showToast("Spot entfernt.", "success");
            } catch(e) { window.showToast("Fehler beim Löschen.", "error"); }
        };

        // --- ANNOUNCEMENTS ---
        window.sendAnnouncement = async () => {
            const title = document.getElementById('ann_title').value.trim();
            const body = document.getElementById('ann_body').value.trim();
            const type = document.getElementById('ann_type').value;
            const cta_label = document.getElementById('ann_cta_label').value.trim();
            const cta_link = document.getElementById('ann_cta_link').value.trim();
            if (!title || !body) return window.showToast('Titel und Text sind Pflichtfelder.', 'error');
            try {
                await addDoc(collection(db, 'grind_announcements'), {
                    type, title, body,

        // --- 8. MAGIC CREATOR (KI GENERATOR) ---
        window.generateMagicContent = async () => {

            if(!input) return window.showToast("Bitte schreibe der KI einen Prompt.", "error");

            const btn = document.getElementById('ai-magic-btn');
            const resDiv = document.getElementById('ai-magic-result');

            resDiv.innerHTML = '<div class="flex justify-center p-6"><div class="w-8 h-8 border-2 border-[#ff4d00] border-t-transparent rounded-full animate-spin"></div></div>';
            
            try {
                const apiKey = ""; 
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const schema = {
                    type: "OBJECT",
                    properties: {
                        operations: {
                            type: "ARRAY",
                            items: { type: "OBJECT", properties: { name: {type: "STRING"}, desc: {type: "STRING"}, xp: {type: "INTEGER"}, type: {type: "STRING", enum: ["qr", "upload", "instant"]} } }
                        },
                        habits: {
                            type: "ARRAY",
                            items: { type: "OBJECT", properties: { name: {type: "STRING"}, desc: {type: "STRING"}, xp: {type: "INTEGER"}, streakBonus: {type: "INTEGER"}, type: {type: "STRING", enum: ["qr", "upload", "instant"]} } }
                        },
                        loots: {
                            type: "ARRAY",
                            items: { type: "OBJECT", properties: { lvl: {type: "INTEGER"}, tier: {type: "STRING", enum: ["free", "pro"]}, title: {type: "STRING"}, type: {type: "STRING", enum: ["qr", "shipping", "link", "xp", "lvl"]}, info: {type: "STRING"} } }
                        }
                    }
                };

                const payload = { 
                    contents: [{ parts: [{ text: `Erstelle Grind-App Inhalte basierend auf diesem User-Input: "${input}"` }] }], 
                    systemInstruction: { parts: [{ text: "Du bist der Operations Director einer Health & Hustle App. Erstelle passend zum Prompt Operations (wöchentlich), Habits (täglich) oder Loots (Belohnungen). Du kannst von allem mehrere generieren. Nutze exakt die Enums im JSON Schema. XP Ops: 300-1000. Base XP Habits: 50-200. Levels für Loots: 1-30." }] }, 
                    generationConfig: { responseMimeType: "application/json", responseSchema: schema } 
                };
                
                const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("API Fetch failed");
                const data = await res.json(); 
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if(text) {
                    state.tempAiContent = JSON.parse(text);
                    window.renderAiResults();
                    window.showToast("KI Entwurf ist bereit!", "success");
                }
            } catch (err) { 
                console.error(err);
                window.showToast("KI Fehler aufgetreten.", "error"); 
                resDiv.innerHTML = '<p class="text-xs text-red-500 italic p-4 text-center">Fehler beim Generieren. Bitte versuche es erneut.</p>';

                    </div>`).join('') + `</div>`;

            if(c.loots && c.loots.length > 0) {

            html += '</div>';
            resDiv.innerHTML = html;

        window.acceptAiItem = async (category, index) => {
            const item = state.tempAiContent[category][index];
            try {
                if(category === 'operations') {
                    item.id = 'ai_op_' + Date.now();
                    if(!item.qr_solution) item.qr_solution = '';

                    if(!updatedWeekly[state.adminEditWeek]) updatedWeekly[state.adminEditWeek] = { title: "Woche " + state.adminEditWeek, missions: [] };
                    if(!updatedWeekly[state.adminEditWeek].missions) updatedWeekly[state.adminEditWeek].missions = [];
                    updatedWeekly[state.adminEditWeek].missions.push(item);
                    await setDoc(doc(db, 'system', 'grind_season'), { weeklyData: updatedWeekly }, { merge: true });
                } else if (category === 'habits') {
                    item.id = 'ai_hab_' + Date.now();
                    if(!item.qr_solution) item.qr_solution = '';
                    item.frequency = item.streakBonus > 0 ? 'daily_streak' : 'daily'; 
                    if(item.frequency === 'daily') item.streakBonus = 0; 
                    item.endDate = new Date(Date.now() + 60*86400000).toISOString().split('T')[0];

                    updatedHabits.push(item);
                    await setDoc(doc(db, 'system', 'grind_season'), { habitData: updatedHabits }, { merge: true });
                } else if (category === 'loots') {
                    let updatedRewards = JSON.parse(JSON.stringify(state.rewardData));
                    let existing = updatedRewards.find(r => r.lvl === item.lvl);
                    if (!existing) { existing = { lvl: item.lvl }; updatedRewards.push(existing); }
                    existing[item.tier] = item.title;
                    existing[`${item.tier}_type`] = item.type;

        window.addReward = async (e) => {

            const tier = document.getElementById('rew_tier').value;
            const title = document.getElementById('rew_title').value;
            const type = document.getElementById('rew_type').value;
            const info = document.getElementById('rew_info').value;
            const fieldsInput = document.getElementById('rew_fields');
            const fields = fieldsInput ? fieldsInput.value : '';

            let updatedRewards = JSON.parse(JSON.stringify(state.rewardData));
            let existing = updatedRewards.find(r => r.lvl === lvl);

            if (!existing) { existing = { lvl: lvl }; updatedRewards.push(existing); }
            existing[tier] = title; existing[`${tier}_type`] = type; existing[`${tier}_info`] = info;
            
            if (type === 'shipping') existing[`${tier}_fields`] = fields;
            else delete existing[`${tier}_fields`];
            
            updatedRewards.sort((a, b) => a.lvl - b.lvl);

            try {
                await setDoc(doc(db, 'system', 'grind_season'), { rewardData: updatedRewards }, { merge: true });
                window.showToast(`Level ${lvl} Reward gespeichert.`, "success");
                e.target.reset(); if(fieldsInput) fieldsInput.style.display = 'none';

            let existing = updatedRewards.find(r => r.lvl === lvl);
            if(existing) {
                delete existing[tier]; delete existing[`${tier}_type`]; delete existing[`${tier}_info`]; delete existing[`${tier}_fields`];

                                                <option value="instant">Instant Claim</option>
                                            </select>
                                            <input id="new_hab_qr" placeholder="QR Code Text" class="w-full p-3 bg-[#050505] border border-[#1f1f1f] rounded-sm text-sm text-white outline-none focus:border-[#3b82f6]" style="display: none;">
                                            <div id="new_hab_geo" data-geo-container style="display:none;flex-direction:column;gap:8px;">
                                                <input type="text" class="geo-search-input w-full p-3 bg-[#050505] border border-[#3b82f6]/30 rounded-sm text-sm text-white outline-none focus:border-[#3b82f6]" placeholder="🔍 Location suchen (z.B. Rheinufer Köln)..." autocomplete="off" onkeydown="_attachNewGeoInputs()">
                                                <p data-geo-confirm class="text-[9px] text-[#3b82f6] font-bold uppercase tracking-widest px-1" style="display:none"></p>
                                                <input id="new_hab_lat" data-lat-input type="number" step="any" class="hidden" readonly>
                                                <input id="new_hab_lng" data-lng-input type="number" step="any" class="hidden" readonly>
                                            </div>
                                            <button type="submit" class="w-full bg-white text-black font-black uppercase text-[10px] tracking-widest py-3 rounded-sm hover:bg-[#3b82f6] hover:text-white transition">Routine Hinzufügen</button>
                                        </form>
                                    </div>
                                </div>

                                <!-- LOOT MANAGER -->
                                <div class="card p-6 rounded-sm">
                                    <div class="flex justify-between items-center mb-6">
                                        <h3 class="text-lg font-black uppercase tracking-widest text-[#ff4d00]">Loot Manager</h3>
                                        
                                        <!-- DELETE ALL / RESTORE BUTTONS -->
                                        <div class="flex gap-2">
                                            ${state.rewardBackup && (Date.now() - state.rewardBackup.timestamp < 86400000) 
                                                ? `<button onclick="window.restoreRewards()" class="bg-green-900/50 hover:bg-green-600 border border-green-500/50 text-white text-[9px] px-2 py-1 font-bold uppercase rounded-sm transition">Restore (24h)</button>` 
                                                : ''}
                                            <button onclick="window.deleteAllRewards()" class="bg-red-900/50 hover:bg-red-600 border border-red-500/50 text-white text-[9px] px-2 py-1 font-bold uppercase rounded-sm transition">Alle Löschen</button>
                                        </div>
                                    </div>
                                    
                                    <div class="max-h-48 overflow-y-auto custom-scroll pr-2 space-y-2 mb-6">
                                        ${state.rewardData.length === 0 ? '<p class="text-xs text-gray-600 italic">Keine Rewards konfiguriert.</p>' : ''}
                                        ${state.rewardData.sort((a,b)=>a.lvl-b.lvl).map(r => `
                                            ${r.free ? `
                                            <div class="bg-[#050505] p-2 border border-white/5 rounded-sm flex justify-between items-center">
                                                <div><span class="bg-gray-800 text-white px-1.5 py-0.5 rounded-sm text-[8px] font-black mr-2">LVL ${r.lvl}</span><span class="bg-[#ff4d00]/20 text-[#ff4d00] px-1.5 py-0.5 rounded-sm text-[8px] font-black mr-2 uppercase">FREE</span><span class="text-xs text-gray-300">${r.free}</span></div>
                                                <button type="button" onclick="window.deleteReward(${r.lvl}, 'free')" class="text-gray-600 hover:text-red-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                            </div>` : ''}
                                            ${r.pro ? `
                                            <div class="bg-[#050505] p-2 border border-white/5 rounded-sm flex justify-between items-center">
                                                <div><span class="bg-gray-800 text-white px-1.5 py-0.5 rounded-sm text-[8px] font-black mr-2">LVL ${r.lvl}</span><span class="bg-[#a855f7]/20 text-[#a855f7] px-1.5 py-0.5 rounded-sm text-[8px] font-black mr-2 uppercase">PRO</span><span class="text-xs text-gray-300">${r.pro}</span></div>
                                                <button type="button" onclick="window.deleteReward(${r.lvl}, 'pro')" class="text-gray-600 hover:text-red-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                            </div>` : ''}
                                        `).join('')}
                                    </div>
                                    <div class="border-t border-[#1f1f1f] pt-6">
                                        <h4 class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-4">Neuen Reward einstellen</h4>
                                        <form onsubmit="event.preventDefault(); window.addReward(event);" class="space-y-3">
                                            <div class="flex gap-2">
                                                <input id="rew_lvl" type="number" min="1" max="30" placeholder="Level" required class="w-1/3 p-3 bg-[#050505] border border-[#1f1f1f] rounded-sm text-sm text-white outline-none focus:border-[#ff4d00]">
                                                <select id="rew_tier" class="w-2/3 p-3 bg-[#050505] border border-[#1f1f1f] rounded-sm text-sm text-white outline-none focus:border-[#ff4d00] appearance-none cursor-pointer"><option value="free">FREE Tier</option><option value="pro">PRO Tier</option></select>
                                            </div>
                                            <input id="rew_title" placeholder="Titel (z.B. Free ESN Bar)" required class="w-full p-3 bg-[#050505] border border-[#1f1f1f] rounded-sm text-sm text-white outline-none focus:border-[#ff4d00]">
                                            <select id="rew_type" onchange="window.updateRewardInfoPlaceholder(this.value)" class="w-full p-3 bg-[#050505] border border-[#1f1f1f] rounded-sm text-sm text-white outline-none focus:border-[#ff4d00] appearance-none cursor-pointer">
                                                <option value="qr">Lokal einlösen (QR Scan)</option>
                                                <option value="shipping">Formular / Physischer Versand</option>
                                                <option value="link">Digital (Link / Code)</option>
                                                <option value="xp">XP Boost (+ XP)</option>
                                                <option value="lvl">Level Boost (+ Level)</option>
                                            </select>
                                            <input id="rew_info" placeholder="Einlöse-Anweisung" required class="w-full p-3 bg-[#050505] border border-[#1f1f1f] rounded-sm text-sm text-white outline-none focus:border-[#ff4d00]">
                                            <input id="rew_fields" placeholder="Formular-Felder (kommasepariert, z.B. Vorname, Adresse, T-Shirt Größe)" class="w-full p-3 bg-[#111] border border-[#333] rounded-sm text-sm text-white outline-none focus:border-[#ff4d00]" style="display: none;">
                                            <button type="submit" class="w-full bg-[#1f1f1f] hover:bg-[#ff4d00] text-white font-bold py-3 rounded-sm text-xs uppercase tracking-widest transition">Speichern</button>
                                        </form>
                                    </div>
                                </div>

                            </div>
                        </div>
                    `;

                }

                html += `</main>`; appDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
